<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galerie des poses</title>
<style>
body{margin:0;font:15px system-ui,sans-serif;background:#1c1d2e;color:#eee;padding:10px}
h1{font-size:19px;margin:4px 0}h2{font-size:16px;margin:18px 0 6px;color:#ffd166}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.c{background:#2a2c44;border-radius:10px;padding:6px;text-align:center;border:3px solid transparent}
.c.del{border-color:#e0507a;opacity:.55}.c.keep{border-color:#4cd07d}
.c img{width:100%;border-radius:6px;background:#000;display:block}
.c b{display:block;font-size:12px;margin:5px 0}
button{font:inherit;font-size:13px;padding:6px 9px;border-radius:7px;border:0;margin:2px;color:#fff;background:#555}
button.k{background:#2e9b5b}button.d{background:#c03a62}button.big{background:#e0507a;padding:10px 14px;font-weight:700}
#o{white-space:pre-wrap;background:#111;padding:10px;border-radius:8px;margin-top:12px;font:12px monospace}
</style></head><body>
<h1>Galerie des poses (vrai moteur)</h1>
<p>Touche une pose pour la marquer : <b style="color:#4cd07d">Garder</b> / <b style="color:#e0507a">Supprimer</b>. Puis « Generer mon texte » et colle-le dans le chat.</p>
<div id="root"></div>
<button class="big" onclick="out()">Generer mon texte</button><div id="o"></div>
<script>
var C=[{"key": "rest0", "t": "Repos - Kaze", "s": "Repos (menus, casiers)", "img": "poses/rest0.jpg"}, {"key": "rest1", "t": "Repos - Gorr", "s": "Repos (menus, casiers)", "img": "poses/rest1.jpg"}, {"key": "rest2", "t": "Repos - Sora", "s": "Repos (menus, casiers)", "img": "poses/rest2.jpg"}, {"key": "rest3", "t": "Repos - Tetsu", "s": "Repos (menus, casiers)", "img": "poses/rest3.jpg"}, {"key": "rest4", "t": "Repos - Nova", "s": "Repos (menus, casiers)", "img": "poses/rest4.jpg"}, {"key": "rest5", "t": "Repos - Kage", "s": "Repos (menus, casiers)", "img": "poses/rest5.jpg"}, {"key": "rest6", "t": "Repos - Bo", "s": "Repos (menus, casiers)", "img": "poses/rest6.jpg"}, {"key": "rest7", "t": "Repos - Piege", "s": "Repos (menus, casiers)", "img": "poses/rest7.jpg"}, {"key": "rest8", "t": "Repos - Zui", "s": "Repos (menus, casiers)", "img": "poses/rest8.jpg"}, {"key": "rest9", "t": "Repos - Yume", "s": "Repos (menus, casiers)", "img": "poses/rest9.jpg"}, {"key": "greet0", "t": "Salut - Kaze", "s": "Saluts a l'ouverture du casier", "img": "poses/greet0.jpg"}, {"key": "greet1", "t": "Salut - Gorr", "s": "Saluts a l'ouverture du casier", "img": "poses/greet1.jpg"}, {"key": "greet2", "t": "Salut - Sora", "s": "Saluts a l'ouverture du casier", "img": "poses/greet2.jpg"}, {"key": "greet3", "t": "Salut - Tetsu", "s": "Saluts a l'ouverture du casier", "img": "poses/greet3.jpg"}, {"key": "greet4", "t": "Salut - Nova", "s": "Saluts a l'ouverture du casier", "img": "poses/greet4.jpg"}, {"key": "greet5", "t": "Salut - Kage", "s": "Saluts a l'ouverture du casier", "img": "poses/greet5.jpg"}, {"key": "greet6", "t": "Salut - Bo", "s": "Saluts a l'ouverture du casier", "img": "poses/greet6.jpg"}, {"key": "greet7", "t": "Salut - Piege", "s": "Saluts a l'ouverture du casier", "img": "poses/greet7.jpg"}, {"key": "greet8", "t": "Salut - Zui", "s": "Saluts a l'ouverture du casier", "img": "poses/greet8.jpg"}, {"key": "greet9", "t": "Salut - Yume", "s": "Saluts a l'ouverture du casier", "img": "poses/greet9.jpg"}, {"key": "guard", "t": "Garde de combat de Kaze (au repos)", "s": "Garde et marche de Kaze", "img": "poses/guard.jpg"}, {"key": "walk0", "t": "Marche de Kaze - pas 1", "s": "Garde et marche de Kaze", "img": "poses/walk0.jpg"}, {"key": "walk1", "t": "Marche de Kaze - pas 2", "s": "Garde et marche de Kaze", "img": "poses/walk1.jpg"}, {"key": "cut0", "t": "Cut-in de super - Kaze", "s": "Cut-in des supers", "img": "poses/cut0.jpg"}, {"key": "cut1", "t": "Cut-in de super - Gorr", "s": "Cut-in des supers", "img": "poses/cut1.jpg"}, {"key": "cut2", "t": "Cut-in de super - Sora", "s": "Cut-in des supers", "img": "poses/cut2.jpg"}, {"key": "cut3", "t": "Cut-in de super - Tetsu", "s": "Cut-in des supers", "img": "poses/cut3.jpg"}, {"key": "cut4", "t": "Cut-in de super - Nova", "s": "Cut-in des supers", "img": "poses/cut4.jpg"}, {"key": "cut5", "t": "Cut-in de super - Kage", "s": "Cut-in des supers", "img": "poses/cut5.jpg"}, {"key": "cut6", "t": "Cut-in de super - Bo", "s": "Cut-in des supers", "img": "poses/cut6.jpg"}, {"key": "cut7", "t": "Cut-in de super - Piege", "s": "Cut-in des supers", "img": "poses/cut7.jpg"}, {"key": "cut8", "t": "Cut-in de super - Zui", "s": "Cut-in des supers", "img": "poses/cut8.jpg"}, {"key": "cut9", "t": "Cut-in de super - Yume", "s": "Cut-in des supers", "img": "poses/cut9.jpg"}],st={};
var root=document.getElementById('root'),last='',grid;
C.forEach(function(c){
 if(c.s!==last){last=c.s;var h=document.createElement('h2');h.textContent=c.s;root.appendChild(h);grid=document.createElement('div');grid.className='g';root.appendChild(grid);}
 var d=document.createElement('div');d.className='c';d.id='c_'+c.key;
 d.innerHTML='<img src="'+c.img+'" alt=""><b>'+c.t+'</b><button class="k" data-k="'+c.key+'" data-v="1">Garder</button><button class="d" data-k="'+c.key+'" data-v="-1">Supprimer</button>';
 grid.appendChild(d);
});
root.addEventListener('click',function(e){var b=e.target;if(!b.dataset||!b.dataset.k)return;var k=b.dataset.k,v=+b.dataset.v;st[k]=(st[k]===v)?0:v;
 document.getElementById('c_'+k).className='c '+(st[k]>0?'keep':st[k]<0?'del':'');});
function out(){var del=[],keep=[],un=[];C.forEach(function(c){var v=st[c.key];(v<0?del:v>0?keep:un).push(c.t);});
 document.getElementById('o').textContent='A SUPPRIMER :\n- '+(del.join('\n- ')||'rien')+'\n\nA GARDER :\n- '+(keep.join('\n- ')||'rien')+'\n\nNON VUES : '+un.length;}
</script></body></html>
