<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Test accessibilite</title>
<style>body{font:16px system-ui;background:#fff3e0;color:#221834;padding:14px;max-width:720px;margin:auto}li{margin:6px 0}button{font:inherit;font-weight:700;padding:10px 14px;border-radius:999px;border:2px solid #221834;margin:4px 6px 0 0;background:#fff3e0}.v{background:#2f8f5b;color:#fff}.x{background:#d8456b;color:#fff}textarea{width:100%;box-sizing:border-box;border:2px solid #221834;border-radius:10px}pre{white-space:pre-wrap}button{min-height:44px}</style><script src="verdicts.js"></script>
<style id="afh-responsive">
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;min-height:100dvh;overflow-x:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body{overflow-wrap:anywhere;min-height:100dvh}
img,video,canvas,svg,iframe{max-width:100%}
img,video{height:auto}
h1{font-size:clamp(18px,4.2vw,34px)}
h2{font-size:clamp(14px,3vw,24px)}
pre,textarea,input,select{max-width:100%}
@media (max-width:480px){button,a.open,select{min-height:44px}}
</style></head><body>
<h1>Test accessibilite</h1>
<ol><li>Éclat de manche (modes groupe) passe par le limiteur.</li><li>Éclat de cinematique de dialogue passe par le limiteur.</li><li>Sous-titres OBJET / SAISIE / PROJECTION.</li></ol>
<p>Restant : éclats d'intro, captions hors combat, réglage TDAH dedie, vraie session par réglage.</p>
<button class="v" onclick="r('Valide')">Valider</button><button class="x" onclick="r('A refaire')">À refaire</button>
<textarea id="t" rows="3" placeholder="Commentaire"></textarea><pre id="o"></pre>
<script>function r(v){document.getElementById('o').textContent='Retour : '+v+' - '+document.getElementById('t').value}</script></body></html>
