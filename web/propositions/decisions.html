var G=[["OUVERTES : À TRANCHER D'ABORD (tools/DECISIONS.md)", [{"id": "boutons-pied", "titre": "Pied : garder un 7e element permanent ?", "texte": "Les 6 touches demandees sont stick, Poing, Saut, Garde, Pouvoir, Pause ; j'ai GARDE Pied (la 2e attaque, indispensable aux combos) : 7 elements permanents. Alternative : fusionner Pied dans Poing (glisser vers le bas), mais cela change le jeu.", "page": "boutons_combat.html"}, {"id": "clign-android", "titre": "Verifier sur le telephone", "texte": "Mesure faite en WebGL logiciel : recharger la PWA sur le telephone (cache vide) et confirmer que le clignotement du debut a disparu.", "page": "decisions.html"}, {"id": "daemons_equilibre_2", "titre": "Rampe des lieux plus douce a la fin", "texte": "Rampe lineaire 1,60 a 2,10 (avant : 1,56 a 2,45 en dents de scie) ; veux-tu un dernier lieu plus dur (pente 0,50 reglable) ?", "page": "daemons_boss_attaques_2.html"}, {"id": "gc_hitstop", "titre": "Échelle unique d'arrêt sur impact", "texte": "Remplacer les 11 valeurs en dur de sim.rs (0,2,3,4,5,6,8,10,11,12,14) par la table léger 4 / moyen 6 / lourd 10 / super 14 (src/gameplay_scale.rs) : change le feeling et le hash.", "page": "decisions.html"}, {"id": "gc_heal", "titre": "Unifier les soins", "texte": "Aujourd'hui : objet 25 % (min 35), gorgée de bouteille, animal soigneur 7 % (min 10), daemon 3-4 %, siphon 50 % des dégâts, vol de vie par mod : proposer un barème unique par rareté.", "page": "decisions.html"}, {"id": "gc_dot_shield", "titre": "Brûlure et poison contre le bouclier", "texte": "Mesuré : la brûlure passe à travers le bouclier (test burn_ignores_shield_measured). Faire absorber les DOT par le bouclier change l'équilibre.", "page": "decisions.html"}, {"id": "drapeau_terrain", "titre": "Drapeau : terrain et durée", "texte": "Terrain de 3000 (3,5 écrans paysage), 3 points ou 5 min, point en or en cas d'égalité : on garde, ou on raccourcit le terrain à 2400 ?", "page": "decisions.html"}, {"id": "mg_test_humains", "titre": "Test avec humains", "texte": "Join/leave en ligne et 1 joueur n'ont ete verifies que par tests unitaires ; prevoir une session reelle a 3-4 personnes.", "page": "modes_groupe.html"}, {"id": "mgf_same_screen", "titre": "Vrai ecran partage a 2", "texte": "Le mode local lance toi + des IA ; un vrai 2 joueurs sur le meme ecran (2e manette) demande un lancement a 2 humains : a faire ?", "page": "modes_groupe_fusion.html"}, {"id": "nv_aides", "titre": "Cinq parcours d'aide", "texte": "Aide a l'apprentissage, Conseils, Premier jour, onboarding et teach : un parcours unique est possible mais c'est un choix de design (environ 2 000 lignes).", "page": "nettoyage_visible.html"}, {"id": "nv_defis_entrainements", "titre": "Trois systemes de defis, deux entrainements", "texte": "Challenges, Epreuves et Run du jour ; Premier jour et entrainement libre : lesquels garder ? Chaque retrait change des sauvegardes et des ecrans.", "page": "nettoyage_visible.html"}, {"id": "pe_succes_trophees", "titre": "Succès et Trophées : même chose, deux noms", "texte": "Défis > Succès compte 89 succès, Social > Trophées en compte 75 : fusionner sous un seul nom (Succès) et un seul compteur ?", "page": "parcours_ecrans.html"}, {"id": "pe_carnet_lieux", "titre": "« Carnet » dit trois fois", "texte": "« Carnet de lieux » existe dans Social (19/39 lieux) et en fin de jeu (12/47 lieux), plus l'onglet « Carnet » de la garde-robe : un seul écran, un seul total (39 ou 47) ?", "page": "parcours_ecrans.html"}, {"id": "pe_defis", "titre": "Six façons de dire « défi »", "texte": "Défis procéduraux (hub Entraînement), Défis, Défis du cauchemar, Run du jour et défis, Défi du jour, Défis entre amis : regrouper sous un seul écran « Défis » à onglets ?", "page": "parcours_ecrans.html"}, {"id": "pe_entrainement", "titre": "Deux tutoriels, quatre salles d'entraînement", "texte": "Parcours « Premier jour » (31 étapes) et Tutoriel (15 étapes) enseignent la même chose ; Entraînement et techniques, Labo et Combo-défi s'ajoutent : n'en garder qu'une entrée « S'entraîner » ?", "page": "parcours_ecrans.html"}, {"id": "presence40-protege", "titre": "Heros absent protege", "texte": "Le heros en attente est immobile mais peut etre frappe ; l'invulnerabilite exige un nouvel etat de simulation et un changement de protocole : a decider avec l'autre agent protocole.", "page": "decisions.html"}, {"id": "rlsd-2", "titre": "Duree d'une run solo", "texte": "Le bot gagne en 19-26 min ; un humain sera plus lent. Faut-il ajouter des etages ou des vagues pour viser 30-40 min, au risque de lasser ?", "page": "decisions.html"}, {"id": "rlsd-3", "titre": "Boss final trop doux ?", "texte": "Boss final a 0,8 des PV du roster (avant 1,5) avec une garde plus faible : il reste la cause de la plupart des morts. Le durcir si les joueurs le trouvent trop facile.", "page": "decisions.html"}, {"id": "rlsd-4", "titre": "Boucle 2", "texte": "Boucle 2 durcie (coups +0,12 par tour, boss +40 % PV par tour) mais jamais jouee par le bot. Mesurer a la main avant de valider.", "page": "decisions.html"}, {"id": "rb-4", "titre": "Courbe de la boucle", "texte": "Boucle +1 : ennemis plus nombreux (+1 par vague jusqu'a 8), PV des ennemis +25 % d'avance, boss +30 % de PV par tour, un peu de chaleur automatique (+2 par tour, 12 au plus). Plus raide ou plus douce ?", "page": "decisions.html"}, {"id": "rb-5", "titre": "Boss final : Shogun renforce + garde", "texte": "Etage 16 : garde d'elite (Maitre Noir) puis Shogun a 150 % de PV. On peut ajouter un 5e boss dedie (nouvel ennemi) plus tard : le generateur est pret.", "page": "decisions.html"}, {"id": "rb-6", "titre": "Coop : la boucle repart seule", "texte": "En coop, apres 10 s d'ecran de victoire puis les cartes cool, la boucle repart toute seule ; seul le bouton Menu quitte. Alternative : un vote Continuer / Menu (commande reseau de plus).", "page": "decisions.html"}, {"id": "rythme3", "titre": "Courbe plate", "texte": "Les vagues 2 des stages 4 à 39 coûtent toutes 600-800 PV
