r.html"}, {"id": "roguelite_ui", "titre": "Menu pause en onglets et cartes de choix", "texte": "Avant / après.", "page": "roguelite_ui.html"}, {"id": "roguelite_look", "titre": "Evolution visuelle du héros (6 paliers)", "texte": "16 variantes pour aura, ailes, traînees.", "page": "roguelite_look.html"}, {"id": "roguelite_commandes", "titre": "Commandes progressives", "texte": "Les touches apparaissent quand le pouvoir est gagne.", "page": "roguelite_commandes.html"}, {"id": "armes_feu_roguelite", "titre": "Armes a feu du roguelite", "texte": "11 idees dont 5 en jeu.", "page": "armes_feu_roguelite.html"}, {"id": "run_coop", "titre": "Run coop 16 niveaux en ligne", "texte": "Structure par chapitres.", "page": "run_coop.html"}]], ["NOUVEAU : NIVEAUX, MENUS, SYSTÈME", [{"id": "niveaux_vague2", "titre": "23 nouveaux lieux", "texte": "Paradis, enfers, Paris, Shibuya, etc.", "page": "niveaux_vague2.html"}, {"id": "niveaux_vague3", "titre": "8 lieux de plus + signatures de boss", "texte": "Rio, Sydney, Agra, fête foraine, serre, surf, ferme, macaques.", "page": "niveaux_vague3.html"}, {"id": "menus_hierarchie", "titre": "Nouvelle hierarchie des menus", "texte": "Titre court, 3 niveaux maxi.", "page": "menus_hierarchie.html"}, {"id": "accessibilite", "titre": "Accessibilite", "texte": "Daltonisme, une main, effets, taille du texte.", "page": "accessibilite.html"}, {"id": "manettes", "titre": "Manettes", "texte": "Glyphes par famille, tables de repli.", "page": "manettes.html"}, {"id": "textes", "titre": "Accents, glossaire, i18n", "texte": "Avant / après.", "page": "textes.html"}, {"id": "perf", "titre": "Performance, poids, PWA", "texte": "Tableaux avant / après.", "page": "perf.html"}, {"id": "qa_visuel", "titre": "QA visuel", "texte": "Defauts trouves et corriges.", "page": "qa_visuel.html"}, {"id": "online_qa", "titre": "QA en ligne", "texte": "Durcissement multijoueur.", "page": "online_qa.html"}]], ["ROGUELITE", [{"id": "roguelite", "titre": "Roguelite : objets et pouvoirs", "texte": "Tes verdicts precedents.", "page": "roguelite.html"}, {"id": "roguelite_profondeur", "titre": "Roguelite : salles, reliques, progression", "texte": "20 idees a classer. Seule la logique est ecrite, pas encore branchee.", "page": "roguelite_profondeur.html"}]], ["NOUVEAU", [{"id": "anneau_8_emplacements", "titre": "Huit directions de pouvoirs", "texte": "Passer de 5 touches de pouvoir à 8 directions (diagonales) change la simulation et le protocole : on le fait, ou on garde 5 ?", "page": "decisions.html"}, {"id": "ag-1", "titre": "Objets equipes du profil", "texte": "Le deblocage permanent « objet equipe au depart » (meta du profil) revient a chaque run solo en plus du pouvoir de depart : le garder (choix du joueur) ou le supprimer pour que SEUL le pouvoir de depart revienne ?", "page": "decisions.html"}, {"id": "ag-2", "titre": "Arme a feu vide", "texte": "Une arme a feu vide est perdue a la derniere balle (comme le jeu normal). L'alternative : la garder en main pour frapper (coup de crosse) ou la jeter a l'ecran comme objet ramassable sans munitions.", "page": "decisions.html"}, {"id": "ag-3", "titre": "Palier cool a 9 pouvoirs", "texte": "Apres tri, le palier cool n'a que 9 pouvoirs distincts (24 au total, aucune arme). Garder ainsi ou ajouter 3 a 5 nouveaux pouvoirs cool (invocations, auras) a l'avenir ?", "page": "decisions.html"}, {"id": "ag-4", "titre": "Armes a feu des ennemis", "texte": "Les heros tirent plus fort (revolver 11 -> 16 hors roguelite), les ennemis armes gardent leurs anciennes valeurs pour ne pas durcir la campagne. Aligner aussi les ennemis ?", "page": "decisions.html"}, {"id": "ag-5", "titre": "Grenade : contact large", "texte": "Une grenade lancee explose des qu'elle frole un adversaire (marge de 30 px de large et 60 px de haut) ou au premier rebond au sol. Trop permissif (elle ne passe jamais au-dessus d'une tete) ou a garder ?", "page": "decisions.html"}, {"id": "ac-1", "titre": "Tir de Ki chargeable avec la roue", "texte": "En roguelite (2 pouvoirs ou plus) le maintien sur Pouvoir ouvre la roue : le tir de Ki a 3 niveaux n'est plus accessible au tactile. Option : une touche dediee (regle de sim, hash et protocole changent).", "page": "decisions.html"}, {"id": "ac-3", "titre": "Pied maintenu au contact : charge ou saisie", "texte": "Au contact d'un ennemi saisissable, un Pied (meme maintenu) lance la SAISIE, jamais la charge. Option : si le bouton reste enfonce plus de 8 images, la saisie cede la place a la charge (regle de sim : hash change).", "page": "decisions.html"}, {"id": "ac-2", "titre": "Anneau de charge : garder, agrandir ou discret", "texte": "Anneau fin a 3 crans autour du bouton tenu et du heros, sans texte. Le garder tel quel, ou l'epaissir / ajouter une vibration a chaque cran.", "page": "decisions.html"}, {"id": "aes-1", "titre": "Paliers d'annonce des coups", "texte": "Garder les paliers adoucis de main (sbires 8/9/11 images, boss 5/6/7) ou revenir aux paliers stricts de l'audit (8/10/13 et 5/8/10) : plus lisible mais change l'equilibre.", "page": "decisions.html"}, {"id": "aes-2", "titre": "Boss daemons sans attaque", "texte": "Hannya, Kirin et Bakeneko n'attaquent pas : proposer de leur donner 2 a 3 coups propres annonces (non corriges ici, aucune mesure faite).", "page": "decisions.html"}, {"id": "aes-3", "titre": "Posture des boss de terrain v2", "texte": "Les boss v2 sans fiche partagent la personnalite Shogun : accepter ou commander une personnalite propre par boss.", "page": "decisions.html"}, {"id": "aes-4", "titre": "Sbires v2 par premier coup", "texte": "Les sbires des terrains v2 prennent la personnalite de leur type de base (reconnu a leur premier coup) : valider ou exiger des postures par terrain.", "page": "decisions.html"}, {"id": "aes-5", "titre": "Dette de poses partagees", "texte": "Sauts d'articulation et coup bas (poses partagees avec les heros) non corriges : a traiter dans un lot poses avec validation visuelle.", "page": "decisions.html"}, {"id": "bandeaux_invite", "titre": "Inviter : icone seule", "texte": "L'invitation est une petite icone (silhouette + plus) a cote du signal reseau, sans texte ni bandeau. Garder ainsi, ou remettre un mot « Inviter » sous l'icone ?", "page": "bandeaux.html"}, {"id": "bandeaux_rubans", "titre": "Annonces de vague / boss", "texte": "Les grands rubans diagonaux (VAGUE 2, BOSS, ETAGE NETTOYE...) deviennent une petite plaque de 2 s sous le HUD. Valider, ou garder un ruban seulement pour les boss ?", "page": "bandeaux.html"}, {"id": "bandeaux_transition", "titre": "Carte de passage opaque", "texte": "La carte lune/pluie + pastilles d'entree d'etage est maintenant pleine encre (plus rien ne transparait). La garder opaque, ou la supprimer en partie en ligne ?", "page": "bandeaux.html"}, {"id": "boss_ange", "titre": "L'Ange intégré (V12, V13, V14)", "texte": "Phase 1 anneau simple et ailes repliées, phase 2 aurole fendue et neuf lames, phases 3 et 4 double aurole et sept lames ; le cou est raccourci.", "page": "boss_integres.html"}, {"id": "boss_brute", "titre": "Brute intégrée (V18 puis V19)", "texte": "Cornes et cape en phase 1, puis lune et épaulières dès la phase 2 : les deux variantes validées servent de progression.", "page": "boss_integres.html"}, {"id": "boss_valerie", "titre": "Valérie Kogen intégrée (V23)", "texte": "Cape et couronne dorée.", "page": "boss_integres.html"}, {"id": "boss_kaze_roi", "titre": "Kaze, PDG en roi (V27)", "texte": "Lune imposante à graduations, couronne haute à cinq pointes, anneau d'autorité doré au sol : le président le plus puissant.", "page": "boss_integres.html"}, {"id": "boss_rappel", "titre": "Le Rappel intégré (V32)", "texte": "Cape et orbes qui tournent autour de lui.", "page": "boss_integres.html"}, {"id": "boutons-contexte", "titre": "Saisie / Ki / Super / Course contextuels", "texte": "Ces 4 touches n'apparaissent que quand elles servent (Super : jauge prete ; Ki : jauge non pleine ou invocation prete ; Saisie : ennemi au contact ; Course : stick pousse) ; sans information du mode, tout reste visible comme avant.", "page": "boutons_combat.html"}, {"id": "boutons-pause", "titre": "Pause discrete", "texte": "Pause reste en place mais a moitie transparente (toujours appui maintenu) ; faut-il la deplacer dans un coin haut ?", "page": "boutons_combat.html"}, {"id": "boutons-barre", "titre": "Barre d'objets du bas en run", "texte": "Absente de main au moment de l'audit (probablement le travail « menus en run ») : l'audit fait echouer toute barre ou pastille qui recouvre un bouton ; a confirmer avec l'autre agent, pastille ouvrant le menu conseillee.", "page": "boutons_combat.html"}, {"id": "boutons-hud", "titre": "HUD : pastilles de pacte et chrono sous le coeur du HUD", "texte": "Les pastilles de pacte et le chrono du mode chaleur ne se superposent plus aux noms ni au chrono central (place stable sous le HUD, retour a la ligne).", "page": "boutons_combat.html"}, {"id": "ck_pas_de_serialisation", "titre": "Pas d'instantane serialise du monde", "texte": "World compte plus de 100 champs et des centaines de types imbriques (noms statiques, tables de coups, modes) : une serialisation exacte est trop risquee ; on garde des instantanes EN MEMOIRE du client, certifies par l'empreinte du relais.", "page": "decisions.html"}, {"id": "ck_retour_instantane", "titre": "Le joueur qui revient repart de son point de sauvegarde", "texte": "Coupure wifi/4G, telephone verrouille, page masquee : le client reprend a son dernier point certifie (toutes les 5 s) et ne rejoue que quelques secondes au lieu de toute la partie.", "page": "decisions.html"}, {"id": "ck_arrivant_neuf", "titre": "L'ami qui arrive d'un autre appareil rejoue encore depuis l'image 0", "texte": "Sans serialisation, un appareil neuf n'a aucun instantane : il rejoue le journal (plus vite : sans tampon de replay, 28 ms par image affichee, barre de progression). A decider : le cout du rejeu a 10 minutes sur telephone justifie-t-il un jour un instantane envoye par un pair ?", "page": "decisions.html"}, {"id": "ck_protocole", "titre": "Protocole inchange (23)", "texte": "Le champ `agreed` du message de reprise est additif : un ancien client l'ignore, un ancien relais n'en envoie pas (rejeu complet). On ne force donc pas de rechargement ; a monter a 24 seulement si on veut forcer tout le monde sur le nouveau chemin.", "page": "decisions.html"}, {"id": "ck_reconnexion", "titre": "Reconnexion immediate et bornee", "texte": "Retour au premier plan, online/offline, changement de reseau, socket fermee 1005/1006 : reprise tout de suite avec le jeton, attente exponentielle bornee a 8 s, abandon apres 14 essais (un evenement du navigateur relance une serie).", "page": "decisions.html"}, {"id": "clavier_mobile_1", "titre": "Vrai clavier du telephone", "texte": "Toucher un champ de texte ouvre maintenant le clavier du telephone (barre Valider au-dessus) : pseudo, code de partie, description du studio, signalement, chat, serveur, code d'ami.", "page": "decisions.html"}, {"id": "clavier_mobile_2", "titre": "Chat tactile", "texte": "Nouvelle puce « Ecrire » parmi les phrases rapides du chat en partie (avant : phrases toutes faites seulement sur mobile). A garder ?", "page": "decisions.html"}, {"id": "clavier_mobile_3", "titre": "Signalement tactile", "texte": "L'ecran « Signaler un probleme » a maintenant un champ a toucher et deux boutons Envoyer / Annuler (avant : aucun moyen d'ecrire sur mobile).", "page": "decisions.html"}, {"id": "clavier_mobile_4", "titre": "Coller par bouton", "texte": "Le bouton « Coller » du code demande l'autorisation du navigateur ; si elle est refusee, un message indique l'appui long dans le champ du code.", "page": "decisions.html"}, {"id": "clavier_mobile_5", "titre": "Navigateurs integres", "texte": "Dans Facebook / Instagram / WebView le pont est coupe et le jeu garde son propre clavier AZERTY a l'ecran. Faut-il aussi afficher un conseil « ouvre dans Chrome » ?", "page": "decisions.html"}, {"id": "clign-retour-titre", "titre": "Bouton Retour au titre", "texte": "Le bouton Retour apparait sur la toute premiere animation du titre alors qu'il n'y a nulle part ou retourner : le masquer pendant l'intro ?", "page": "decisions.html"}, {"id": "clign-flash-titre", "titre": "Flash blanc du logo", "texte": "Une trame blanche sur l'impact du logo AI FIGHTER est voulue ; la garder, ou l'adoucir (sensibilite a la lumiere) ?", "page": "decisions.html"}, {"id": "clign-poids-wasm", "titre": "Wasm de 6,7 Mo", "texte": "Le telechargement du wasm domine le demarrage en 4G (15 s) : compresser (brotli) ou alleger pour raccourcir l'ecran de chargement ?", "page": "decisions.html"}, {"id": "ccf-1", "titre": "Foot : egalite 4 parties sur 18", "texte": "Pas de but en or : une egalite au foot est une issue legitime et le but en or change le hash (PROTOCOL_VERSION 24 + net.rs, server.js, tests). A decider : le veux-tu quand meme ?", "page": "decisions.html"}, {"id": "ccf-2", "titre": "Colline : mort subite appliquee", "texte": "Egalite d'equipes en fin de derniere manche : prolongation jusqu'au prochain point (40 s max). Les 7 egalites sur 18 etaient 6 parties a 2 joueurs (sans equipe, par conception) + 1 vraie egalite.", "page": "decisions.html"}, {"id": "ccf-3", "titre": "Danse du sabre (Sora #30) : poignet 165 deg", "texte": "Non traite : mesure non obtenue (file de compilation saturee). Piste : variante SlashSpin sur le modele de Tourbillon de garde, meme case, memes images, meme hitbox.", "page": "decisions.html"}, {"id": "ccf-4", "titre": "Hitbox plus longue que le membre dessine", "texte": "Gorr, Nova, Sora, Zui, Yume, Kage, Tetsu : non traite ici. Regle proposee : allonger le geste (pose) avant de raccourcir la hitbox, mesure move_coherence avant/apres.", "page": "decisions.html"}, {"id": "ccf-5", "titre": "Lieux 21 a 47 : audit visuel a faire", "texte": "Planche contact (tools/decor_audit.py) non produite : aucune capture de lieu cette passe. A lancer quand la file de compilation est libre.", "page": "decisions.html"}, {"id": "ccf-6", "titre": "Baselines golden (text_w)", "texte": "Non regenerees : sans captures verifiees a l'oeil, on ne les ecrase pas. A faire apres l'audit des lieux.", "page": "decisions.html"}, {"id": "ccf-7", "titre": "Zones des daemons : ellipse partout", "texte": "Les zones et anneaux touchaient dans les coins du rectangle, hors de l'ellipse dessinee ; Vol de patte marque en anneau autour du boss. Un peu moins de zone touchante : OK pour l'equilibre ?", "page": "decisions.html"}, {"id": "cs-1", "titre": "Icone du special au-dessus de la tete", "texte": "Tu as demande une icone AU-DESSUS du personnage : elle remplace la pastille posee sous les pieds (choix d'avant, qui evitait la tete). Valider le dessus, ou remettre sous les pieds ?", "page": "decisions.html"}, {"id": "cs-2", "titre": "Stick droit : choisit, ne lance pas", "texte": "A la manette, le stick droit CHOISIT le special (haut, bas, avant, retour au neutre) et la gachette Special le lance. Alternative : le stick droit lance directement le special pointe (ancien comportement de la roue).", "page": "decisions.html"}, {"id": "cs-3", "titre": "Transformation gratuite hors roguelite", "texte": "En roguelite la transformation exige l'objet Eveil du Ki. Hors roguelite (campagne, duel) elle reste un pouvoir de base du heros : la verrouiller aussi derriere un objet a ramasser, ou laisser comme aujourd'hui ?", "page": "decisions.html"}, {"id": "cs-4", "titre": "Double touche Ki + Super", "texte": "La double touche Ki + Super lance toujours la transformation d'un coup, mais seulement Ki PLEIN. La retirer pour que la seconde barre soit le seul chemin ?", "page": "decisions.html"}, {"id": "dba-1", "titre": "Hannya, Kirin et Bakeneko attaquent", "texte": "Chaque daemon de boss a maintenant 3 coups annoncés 30 images à l'avance (zone marquée au sol, nom affiché) : valider le principe et les dégâts (3 à 5 PV par coup).", "page": "daemons_boss_attaques.html"}, {"id": "dba-2", "titre": "Cadences changées", "texte": "Hannya passe de 600 à 420 images entre deux coups, Kirin de 240 à 300 (son soin reste entre 50 et 70 % des PV, un peu plus lent) : accepter ou ajuster.", "page": "daemons_boss_attaques.html"}, {"id": "dba-3", "titre": "Vol de patte du Bakeneko", "texte": "Le vol d'arme devient un des trois coups (un cycle sur trois, seulement si le héros porte une arme à moins de 450) : garder ou le rendre plus rare.", "page": "daemons_boss_attaques.html"}, {"id": "dba-4", "titre": "Garde-fou : aucun daemon de boss sans attaque", "texte": "Un test mesure les 13 daemons de boss contre un héros immobile : tout daemon silencieux fait échouer les tests.", "page": "daemons_boss_attaques.html"}, {"id": "dba-5", "titre": "Autres daemons de boss", "texte": "Les 10 autres daemons de boss gardent leur coup unique (par cycle) : leur donner aussi 2 à 3 coups annoncés est une suite possible.", "page": "daemons_boss_attaques.html"}, {"id": "daemons_equilibre_1", "titre": "Daemons de boss : 3 coups chacun", "texte": "Les 13 daemons de boss ont maintenant 3 coups annonces (>= 30 images, nom, zone au sol) ; garde-fous verts.", "page": "daemons_boss_attaques_2.html"}, {"id": "daemons_equilibre_3", "titre": "Shogun reskinnes : deja justes", "texte": "Mesure bot : les gros boss (x1,4+) ne sont pas plus durs que les petits ; rien change, garde-fou ajoute.", "page": "daemons_boss_attaques_2.html"}, {"id": "daemons_equilibre_4", "titre": "Paliers de depart conserves", "texte": "Paliers 5/6/7 (boss) et 8/9/11 (sbires) gardes : lisibilite d'abord ; pas d'essai A/B mesure.", "page": "daemons_boss_attaques_2.html"}, {"id": "dp_taille", "titre": "Daemons à 60 % de leur taille", "texte": "Le rendu des daemons est réduit à 0,6 (la hitbox de simulation ne bouge pas) : c'est la bonne taille, ou 0,7 ?", "page": "daemons_petits.html"}, {"id": "dp_caractere", "titre": "Un caractère par daemon", "texte": "Chaque espèce a une attente, une démarche, une réaction aux coups, un signe d'humeur et une aura propres : la planche contact te convient-elle ?", "page": "daemons_petits.html"}, {"id": "dp_texte", "titre": "Plus aucun texte sur les daemons", "texte": "Noms et étiquettes (SPÉCIAL, COUP, KI...) sont retirés : seuls restent les pictogrammes de charge et les noms d'attaques de boss.", "page": "daemons_petits.html"}, {"id": "dp_pastille", "titre": "Pastille de pouvoir sous les pieds", "texte": "La pastille du pouvoir prêt est sous le héros (au niveau de l'anneau) ; le triangle de joueur reste au-dessus : le déplacer aussi ?", "page": "daemons_petits.html"}, {"id": "dp_bouton", "titre": "Bouton SUPER nettoyé", "texte": "Plaque unie + glyphe du pouvoir, recharge en anneau fin, une seule pastille (le pouvoir suivant) : plus d'éventail de pastilles.", "page": "daemons_petits.html"}, {"id": "dp_lien", "titre": "Lien héros-daemon quasi invisible", "texte": "Fil de 1 px très transparent, seulement quand le daemon est loin ; supprimé quand il est proche : le supprimer tout à fait ?", "page": "daemons_petits.html"}, {"id": "dr-1", "titre": "Rejeu plus rapide", "texte": "Le rejeu du journal d'un arrivant prend plusieurs secondes sur telephone : prevoir un ecran de chargement et des instantanes periodiques du monde plutot qu'un rejeu depuis l'image 0.", "page": "decisions.html"}, {"id": "dr-2", "titre": "Attente des amis a l'arrivee", "texte": "Pendant son rejeu l'arrivant est tenu par l'IA (il voit la partie, ne joue pas) : acceptable, ou preferer un petit decompte avant la reprise ?", "page": "decisions.html"}, {"id": "dr-3", "titre": "Ecran « Recreer la partie »", "texte": "Apres deux reprises en 45 s le jeu s'arrete et propose de recreer la partie : valider le texte et le delai.", "page": "decisions.html"}, {"id": "diag-1", "titre": "Rapport auto sur desynchro", "texte": "Garder l'envoi automatique (desync, gel > 7 s, connexion perdue) actif par defaut, avec le reglage Options pour le couper ?", "page": "decisions.html"}, {"id": "diag-2", "titre": "Gel reseau : seuil", "texte": "Le rapport de gel part a 7 s sans progres (420 images) : plus court (4 s) ou plus long (12 s) ?", "page": "decisions.html"}, {"id": "diag-3", "titre": "Disque Render", "texte": "Les rapports disparaissent a chaque deploiement : monter un disque persistant (REPORTS_FILE) ou relever souvent avec fetch_reports.sh ?", "page": "decisions.html"}, {"id": "diag-4", "titre": "Hash plus frequent", "texte": "Les hashs sont echanges toutes les 60 images : passer a 30 pour situer plus finement la 1re divergence (trafic x2 sur 'hash', a valider car cela touche le comportement en ligne) ?", "page": "decisions.html"}, {"id": "do_lieux39", "titre": "Trophées « 39 lieux » et « 39 stages » périmés", "texte": "sc_lieu39 (« Tour du monde ») et sc_stage39 (« Toute la carte ») datent de 39 stages ; la campagne en compte 47, donc ils se valident 8 lieux avant la fin : relever les buts à 47 (équilibre des trophées, pas la sim) ?", "page": "decisions.html"}, {"id": "do_histoire15", "titre": "Trophée « Lecteur assidu » trop tôt", "texte": "sc_s_story (« Terminer toute l'histoire ») se valide à 15 chapitres alors que l'histoire en compte 19 : passer le but à 19 (équilibre des trophées secrets) ?", "page": "decisions.html"}, {"id": "do_dem7", "titre": "Daemons de boss : 13 mais cosmétiques pour 7", "texte": "Les pièces de garde-robe « Boss » ne couvrent que les 7 premiers daemons sur 13, et sc_dem7 s'appelle « sept esprits » : garder, ou ajouter 6 pièces / viser les 13 ?", "page": "decisions.html"}, {"id": "do_defis_jumeaux", "titre": "4 paires de défis identiques", "texte": "Mêmes règle, gag, décor, manches et chapitre : bowling/depart, toit/defenestration, primes/inventaire, tableur/mdp ; seuls le titre et le texte changent (supprimer l'un ou différencier la règle touche l'équilibre et les succès par défi).", "page": "decisions.html"}, {"id": "do_apparence_doublons", "titre": "9 accessoires en double (équipement et garde-robe)", "texte": "Oreilles de chat, lunettes rondes, cache-oeil, écharpe, bonnet à pompon, sac à dos, masque de ninja, bandeau et cape existent à la fois comme pièces d'équipement (apparence) et comme accessoires de garde-robe, avec deux dessins : fusionner les deux systèmes ?", "page": "decisions.html"}, {"id": "do_apparence_gratuite", "titre": "58 pièces d'apparence gratuites et jamais gagnées", "texte": "Les pièces d'équipement « (apparence) » sont toutes offertes d'office ; aucune ne sert de récompense. Les lier à des succès ou lieux en ferait des objectifs (changement de progression).", "page": "decisions.html"}, {"id": "eqd_1", "titre": "Équipement du roguelite rattaché au squelette", "texte": "Épaulières, brassards, écharpe, bandeau, couronne et lueur des yeux suivent maintenant les articulations du héros dans toutes les poses : à valider sur téléphone.", "page": "equipement_decors.html"}, {"id": "eqd_2", "titre": "Enseigne du ramen recentrée", "texte": "Le texte « RAMEN 24/24 » est centré dans son panneau, posé sur l'auvent par deux pieds, et se réduit tout seul s'il est trop large.", "page": "equipement_decors.html"}, {"id": "eqd_3", "titre": "Client assis sur un tabouret", "texte": "Le client est assis sur un tabouret visible, pieds au sol, face au bol ; le cuisinier se tient derrière le comptoir et le regarde.", "page": "equipement_decors.html"}, {"id": "eqd_4", "titre": "Textes centrés partout", "texte": "La mesure des textes du décor utilisait la mauvaise police : tous les titres, bulles et enseignes centrés se recalent (léger décalage visible sur les anciennes captures de référence).", "page": "equipement_decors.html"}, {"id": "eqd_5", "titre": "Convives de la cantine sur leurs tabourets", "texte": "Les convives étaient assis sur la table ; ils s'assoient maintenant sur le tabouret, et les bureaux ont un fauteuil.", "page": "equipement_decors.html"}, {"id": "eqd_6", "titre": "Effets de souffle et de poitrine à rattacher ?", "texte": "Les lueurs de cri (bouche) et de poitrine des pouvoirs du roguelite sont encore posées à hauteur fixe : à rattacher aussi à la tête et au torse ?", "page": "equipement_decors.html"}, {"id": "fin_niveau_carte_unique", "titre": "Une seule carte de fin de niveau", "texte": "Etoiles, pieces (compteur), une nouveaute, puis Continuer : on garde ce format court pour la campagne et l'histoire ?", "page": "decisions.html"}, {"id": "fin_niveau_etoiles", "titre": "Etoiles dessinees", "texte": "Les etoiles s'affichent en texte (**-) faute de glyphe dans la police : veux-tu de vraies etoiles dessinees (petit lot de rendu) ?", "page": "decisions.html"}, {"id": "fin_niveau_bilan_profil", "titre": "Detail des gains", "texte": "Le bilan complet n'est plus montre automatiquement ; il reste dans la pause (Revoir le dernier bilan). Faut-il aussi un onglet dans Progression ?", "page": "decisions.html"}, {"id": "audit_quotidien", "titre": "Fusionner les armes du quotidien", "texte": "11 armes de melee lentes aux roles proches : en garder 5 (balai, barre, poele, chandelier, pelle) ?", "page": "decisions.html"}, {"id": "audit_pieces", "titre": "Pieces d'arme equipees", "texte": "Garder les pieces katana / baton / masse / nunchaku / kunai en plus des armes au sol, ou les retirer ?", "page": "decisions.html"}, {"id": "audit_statuts", "titre": "Statuts visibles", "texte": "Ajouter une icone au-dessus de la tete pour poison, aveugle et ralenti ?", "page": "decisions.html"}, {"id": "audit_orientation", "titre": "Orientation du coup", "texte": "Valider le cahier des charges : stick gauche = haut / bas / estoc / diagonales pour armes, poings, pieds.", "page": "decisions.html"}, {"id": "gc_cryo", "titre": "Poison x2 sous gel, brûlure non", "texte": "Le poison double sous gel (synergie cryo) mais pas la brûlure : donner un équivalent (brûlure x1,5 sous gel) ou retirer le x2.", "page": "decisions.html"}, {"id": "gc_direct_hp", "titre": "PV écrits hors chaîne de dégâts", "texte": "Écritures directes restantes (épines, recul d'attaque, chute) : les passer par apply_hit change les chiffres et le hash.", "page": "decisions.html"}, {"id": "hc_brief", "titre": "Bandeau objectif + carte du parcours", "texte": "Au debut de chaque chapitre (et a la fin de l'epilogue), un bandeau montre le lieu, l'objectif en 8 mots et « TU ES ICI » sur la carte : garder tel quel ?", "page": "histoire_claire.html"}, {"id": "hc_fil", "titre": "Fil rouge : le badge vole", "texte": "Acte 1 a 3 : retrouver son badge ; acte 4-5 : monter a la PDG ; saison 2 : atteindre le bouton ARRET avant 07:00. Valider ce fil unique ?", "page": "histoire_claire.html"}, {"id": "hc_boss", "titre": "Un seul dernier boss : Le Rappel", "texte": "Valerie ferme la saison 1, Kaze la saison 2, Le Rappel (le reveil) ferme le jeu ; L'Ange reste hors histoire, sans lien explicite.", "page": "histoire_claire.html"}, {"id": "hc_courts", "titre": "Textes raccourcis (environ 47 %)", "texte": "Repliques de 150 caracteres maxi, 6 repliques maxi par intro, test automatique a l'appui : encore trop long, ou bien ?", "page": "histoire_claire.html"}, {"id": "hc_nuits", "titre": "Compte des nuits : 47 puis 48", "texte": "47 nuits avant le jeu, la saison 2 et le final sont la 48e : tranche applique partout dans les dialogues.", "page": "histoire_claire.html"}, {"id": "hc_dlg", "titre": "Rendu des dialogues : on garde dlg_stage", "texte": "Le dialogue de main (decor du lieu, bonshommes du rig, boutons tactiles masques) remplace l'idee « vrai moteur » de l'autre branche : pas de double systeme.", "page": "histoire_claire.html"}, {"id": "if_pause_discrete", "titre": "Pause discrete en haut a droite ?", "texte": "Aucune place libre pres du pouce droit : la deplacer gene le Super (portrait) ou la rangee haute (paysage). Garder pres du stick ?", "page": "decisions.html"}, {"id": "if_ff_pal", "titre": "Tir ami : la prise suit-elle le reglage ?", "texte": "Desactive = pas de tir ni de prise d'ami ; Reduit / Normal = les deux. Une prise sans tir ami (ancien reglage) disparait.", "page": "decisions.html"}, {"id": "if_dpad", "titre": "D-pad pour la roue des pouvoirs ?", "texte": "Le stick droit ouvre la roue ; le D-pad sert deja a se deplacer. Le laisser ainsi ?", "page": "decisions.html"}, {"id": "if_clavier_court", "titre": "Clavier de 32 touches sur ecran court", "texte": "Sous 640 pt de haut, on le remplace par le vrai clavier (toucher le code). Acceptable ?", "page": "decisions.html"}, {"id": "lieux-1", "titre": "Auditer l'écran brut hors lieux", "texte": "Une trentaine de fichiers UI utilisent encore la largeur de fenêtre réelle ; on les audite par capture ?", "page": "decisions.html"}, {"id": "lieux-2", "titre": "Captures golden des 20 lieux", "texte": "Lancer la planche golden des lieux pour valider parallaxe et lisibilité après ce correctif ?", "page": "decisions.html"}, {"id": "lieux_famille_1", "titre": "Audit visuel des lieux 21-47", "texte": "Le garde-fou de donnees est vert ; lancer une passe de captures golden (parallaxe, vagues longues) sur Serre, Cantine, Louvre, Paradis ?", "page": "decisions.html"}, {"id": "menu_fond_variante", "titre": "Menu du titre sur la ville animee : quelle variante ?", "texte": "A (plaques creme, retenue), B (verre sombre) ou C (une seule carte translucide) : A est en place par defaut, a vous de trancher sur les captures.", "page": "menu_fond_anime.html"}, {"id": "menu_fond_paysage", "titre": "Paysage : colonne de menu a droite", "texte": "En paysage et sur tablette le menu est une colonne a droite (logo et heros a gauche) ; garder, ou le centrer comme avant ?", "page": "menu_fond_anime.html"}, {"id": "menus_run_deux_familles", "titre": "Menu en run : Pouvoirs / Passifs", "texte": "Un seul ecran d'icones : Pouvoirs (touche + recharge) et Passifs (objets et bonus fusionnes), description en bas, Reprendre / Abandonner / Quitter.", "page": "menus_en_run.html"}, {"id": "menus_run_abandon_confirme", "titre": "Abandonner demande un 2e appui", "texte": "Un faux clic tuait la run : le bouton passe en « Sur ? » au premier appui. A garder ?", "page": "menus_en_run.html"}, {"id": "menus_demarrage_defilement", "titre": "Demarrage : le heros en grand", "texte": "Balayage ou fleches pour changer de heros, gros bouton LANCER, graine et objets derriere la roue dentee, Jouer a plusieurs dessous.", "page": "menus_en_run.html"}, {"id": "menus_fin_de_run", "titre": "Fin de run sans impasse", "texte": "Score, etage, deblocages, puis Rejouer (meme heros, nouvelle graine) / Changer de heros / Menu. La meme graine se choisit dans la roue dentee.", "page": "menus_en_run.html"}, {"id": "menus_pause_campagne", "titre": "A faire : pause de la campagne", "texte": "La pause campagne reste une liste de 13 lignes : proposer 4 gros boutons (Reprendre, Recommencer, Aide, Menu) + « Plus ».", "page": "menus_en_run.html"}, {"id": "menus_defaite_campagne", "titre": "A faire : ecran de defaite campagne", "texte": "4 lignes de texte, libelles longs : passer au meme gabarit que la fin de run (un principal Continuer + 2 sorties).", "page": "menus_en_run.html"}, {"id": "mpa1", "titre": "Moteur de mise en page", "texte": "Fait et teste sur 9 formats sans capture ; pret pour les ecrans et le composant 3 cartes du roguelite.", "page": "mise_en_page_auto.html"}, {"id": "mpa2", "titre": "Deux portes au titre", "texte": "Proposition : Creer une partie en ligne et Rejoindre un ami directement au titre, plus d'ecran Menu en ligne. A valider.", "page": "mise_en_page_auto.html"}, {"id": "mpa3", "titre": "Clavier de code a l'ecran", "texte": "32 touches de 48 pt pour saisir le code sans clavier : a valider avant branchement.", "page": "mise_en_page_auto.html"}, {"id": "mpa4", "titre": "Reglages a part", "texte": "Visibilite supprimee (prive par defaut, public = partie rapide) ; heros, couleur, decor, tirs amis dans Reglages de la partie.", "page": "mise_en_page_auto.html"}, {"id": "drapeau_super", "titre": "Drapeau : Super et Ki coupés", "texte": "Super, Ki et spécial sont coupés pour tous en drapeau (comme avant) : on les réactive hors porteur ?", "page": "decisions.html"}, {"id": "mg_horde_ok", "titre": "Horde : garder l'equilibre", "texte": "Les bots gagnent la horde 11/18 en 235 s : pas trop dure, on ne touche pas (le 2/18 ne se reproduit pas).", "page": "modes_groupe.html"}, {"id": "mgf_rl_doublon", "titre": "Roguelite coop en double", "texte": "Roguelite coop est aussi dans Titre > Roguelite ; le garder la (sujet d'un autre agent) ou le retirer et ne laisser que Creer une partie ?", "page": "modes_groupe_fusion.html"}, {"id": "mgf_local_memoire", "titre": "Seul / sur cet ecran : memoire du choix", "texte": "Le bouton Jouer seul est remis a En ligne a chaque lancement ; le retenir dans le profil (foot en local = 2 pressions au lieu de 3) ?", "page": "modes_groupe_fusion.html"}, {"id": "mgf_vote_texte", "titre": "Fin de manche : mots sur les icones du vote", "texte": "Le vote du mode suivant n'a que des icones : ajouter le nom du mode sous chaque icone (cibles deja > 54 px) ?", "page": "modes_groupe_fusion.html"}, {"id": "horde_facile", "titre": "Horde un peu plus facile ?", "texte": "Les bots gagnent la horde 4 fois sur 18 : baisser les PV ennemis (0,7 -> 0,6) ?", "page": "decisions.html"}, {"id": "m6-1", "titre": "Offre Render Starter", "texte": "Apres les correctifs, un salon de 6 joueurs coute au relais environ 0,5 % d'un coeur de PC (avant : 5 %), donc le CPU n'est plus le goulot meme en gratuit. Le Starter (7 $/mois) reste utile pour une seule raison : plus de demarrage a froid de 30 a 60 s apres 15 min sans visite. Le prendre ou garder le gratuit ?", "page": "decisions.html"}, {"id": "m6-2", "titre": "Delai d'entree jusqu'a 400 ms", "texte": "Le delai d'entree adaptatif monte maintenant jusqu'a 24 images (400 ms, avant 200 ms) quand la liaison l'exige : a 6 en 4G le jeu attend moins, mais les coups des mauvais reseaux paraissent plus lents. Garder 400 ms, ou plafonner a 300 ms (plus de gels, moins de lenteur) ?", "page": "decisions.html"}, {"id": "m6-3", "titre": "Appareil neuf en cours de partie", "texte": "Un telephone qui arrive apres 10 min rejoue toute la partie (environ 3 s sur PC, 10 a 20 s sur telephone). Le reduire exigerait de serialiser tout le monde du jeu (risque de desynchro silencieuse). Laisser tel quel (ecran « Connexion a la partie » avec barre) ou lancer ce chantier ?", "page": "decisions.html"}, {"id": "mj_inapp", "titre": "Navigateur intégré (WhatsApp/Instagram)", "texte": "Détecter le navigateur intégré et proposer « Ouvrir dans Chrome/Safari » avec le lien copié ?", "page": "multijoueur_refonte.html"}, {"id": "mj_ttl", "titre": "Durée de vie d'un salon vide", "texte": "60 s de grâce actuellement : l'ami qui arrive avant toi après fermeture d'appli trouve un salon fermé. Passer à 5 min pour un salon privé non lancé ?", "page": "multijoueur_refonte.html"}, {"id": "mj_ecrans", "titre": "Refonte des écrans en ligne", "texte": "Lancer le lot 2 : un écran Jouer avec un ami (code, QR, Partager, présents, Lancer) et un champ Rejoindre ?", "page": "multijoueur_refonte.html"}, {"id": "mj_supprimer", "titre": "Supprimer quick/create/options/lobby", "texte": "Retirer l'ancien lobby serveur+client après migration des écrans (protocole 19) ?", "page": "multijoueur_refonte.html"}, {"id": "mj_plein", "titre": "Salon plein", "texte": "Au-delà de 8 : « Salon plein, crée le tien » avec bouton, plutôt qu'une file d'attente ?", "page": "multijoueur_refonte.html"}, {"id": "musique-1", "titre": "Musique des menus a plein volume", "texte": "Les menus jouaient a 30 % du reglage (bug corrige) : verifier a l'oreille que le niveau titre vous convient.", "page": "decisions.html"}, {"id": "musique-2", "titre": "Baisse pendant les dialogues", "texte": "La musique descend a 55 % pendant les dialogues : trop ou pas assez ?", "page": "decisions.html"}, {"id": "musique-3", "titre": "Normaliser le volume des pistes", "texte": "Egaliser le niveau des pistes fournies et composees (gain par piste) : a faire si l'ecoute montre des ecarts.", "page": "decisions.html"}, {"id": "mu-1", "titre": "Musique = tes 8 pistes d'origine", "texte": "Les 15 pistes composées par le moteur sont retirées ; la musique du jeu est de nouveau « Final Escalation » (6 versions), Level 1 et Level 2, même volume, boucle raccordée. Écoute-les sur la page et dis si la répartition lieux et boss te va.", "page": "musiques_a_trier.html"}, {"id": "mu-4", "titre": "Ambiance de l'Ange", "texte": "Les 5 calques de drone et de chœur du combat de l'Ange sont encore générés par le moteur, par-dessus tes pistes : les garder comme effet d'ambiance ou les couper ?", "page": "decisions.html"}, {"id": "netchaos-reprise-journal", "titre": "Reprise = rejeu complet : les points de sauvegarde sont le vrai correctif", "texte": "Apres une coupure de 10 s, la recuperation depasse 8 s (9 a 22 s a 4 joueurs) car on rejoue tout le journal ; sur telephone c'est x3 et croit avec la duree de partie : faire des points de sauvegarde la priorite reseau.", "page": "decisions.html"}, {"id": "netchaos-seuil-gel-rtt", "titre": "Seuil de gel du relais : suivre le RTT mesure", "texte": "Le relais met une place en attente apres 900 ms fixes puis impose un rejeu complet au moindre message : sur un lien a gigue ca fait 3 rejeux en 35 s ; proposition : seuil = max(900 ms, 4 x RTT) et pas de rejeu pour quelques images manquees.", "page": "decisions.html"}, {"id": "netchaos-limite-240", "titre": "Limite de 240 messages/s : perte silencieuse d'entrees", "texte": "Au-dela de 240 messages par seconde et par connexion le relais jette sans rien dire, ce qui laisse un trou dans le journal (desynchro) ; proposition : exempter input/hash (deja bornes par le budget d'images) ou renvoyer une erreur 'rate' qui declenche une reprise.", "page": "decisions.html"}, {"id": "netchaos-nightly", "titre": "Banc CHAOS dans le nocturne", "texte": "Une etape du nightly lance la matrice complete (2/4/8 joueurs, 3 modes, ~40 min) et publie tools/netchaos/latest.md dans le resume : a garder, ou limiter a la version rapide (9 min) ?", "page": "decisions.html"}, {"id": "netchaos-transport-non-ordonne", "titre": "Le relais suppose des messages ordonnes", "texte": "Une entree arrivee avant la precedente laisse un trou muet dans le journal : sans objet en WebSocket/TCP, mais a corriger (numeros de sequence, renvoi) avant tout passage a un transport non fiable.", "page": "decisions.html"}, {"id": "nv_reduire_effets", "titre": "Un seul reglage de confort ?", "texte": "Options propose « Tremblements de l'ecran » et, dans Accessibilite, « Moins d'effets » : meme intention, deux endroits. Fusionner (garder le curseur et faire de « Moins d'effets » son cran 0) ?", "page": "nettoyage_visible.html"}, {"id": "nv_physique_membres", "titre": "Physique des membres : garder ?", "texte": "Reglage technique (raideur, amortissement) a effet purement visuel, lie au mode Ragdoll annexe : le retirer des Options avec lui, ou le laisser ?", "page": "nettoyage_visible.html"}, {"id": "nv_jouer_hors_ligne", "titre": "« Jouer hors ligne » chevauche l'ecran En ligne", "texte": "Touche le lobby (hors de mon perimetre) : a trancher avec l'architecte multijoueur avant tout retrait.", "page": "nettoyage_visible.html"}, {"id": "nv_ecrans_debug", "titre": "Ecrans de dev encore atteignables", "texte": "Anims, Gear, Studio, Ragdoll, Labo : plus de lien depuis les menus du joueur ? Si oui, les passer derriere une compilation « dev ».", "page": "nettoyage_visible.html"}, {"id": "pe_hub_plus", "titre": "Le hub « Plus » est un fourre-tout", "texte": "Options > Plus contient Progression, Studio de création IA, Tableau des némésis et Social : ranger Progression et Némésis dans « Mon combattant », garder Social au titre ?", "page": "parcours_ecrans.html"}, {"id": "pe_aspect_brut", "titre": "Écrans à l'aspect brut", "texte": "Spéciaux (fond blanc, texte tout petit, sans carte) et Mes créations (noms de fichiers creations_export.json visibles) détonnent : les refaire avec la carte standard ?", "page": "parcours_ecrans.html"}, {"id": "pe_textes_coupes", "titre": "Textes coupés restants (portrait / petit paysage)", "texte": "Entraînement : boutons PASSER / QUITTER / MENU et RETOUR AU JEU tronqués ; Défaite : conseil coupé en paysage ; Pacte de punition : « ASCENSION : NON » chevauche RETOUR ; « NIVEAU TERMINE » sans accent en coop (hors lot roguelite/en ligne).", "page": "parcours_ecrans.html"}, {"id": "pe_menu_doublons", "titre": "Même geste à deux endroits", "texte": "Boutique de coups (Atelier de combos) et Progression affichent tous deux « Prochain : Rafale de griffes » ; Réglages existe en hub, en onglet de la garde-robe et en titre d'écran : garder un seul chemin ?", "page": "parcours_ecrans.html"}, {"id": "pp_attente", "titre": "Compte a rebours de la salle d'attente", "texte": "20 s par defaut (le chef le change : 10, 20, 30, 60 s). Garder 20 s ?", "page": "parties_publiques.html"}, {"id": "pp_rattrapage", "titre": "Arrivee en cours d'etage", "texte": "Par defaut on rejoint tout de suite avec rattrapage ; « Attendre le prochain etage » existe dans la liste. Garder ce choix par defaut ?", "page": "parties_publiques.html"}, {"id": "pp_modes", "titre": "Modes en partie publique", "texte": "Ascension, Combat libre, Horde, Drapeau (un pool par mode). Ajouter un filtre par niveau de difficulte ?", "page": "parties_publiques.html"}, {"id": "pp_latence", "titre": "Latence dans la liste", "texte": "Le relais est unique : on affiche TON ping, pas un ping par partie. Suffisant ?", "page": "parties_publiques.html"}, {"id": "pp_kit", "titre": "Kit de rattrapage", "texte": "Pouvoir de depart + un par etage franchi (4 au plus). Faut-il plutot copier le niveau moyen de l'equipe ?", "page": "parties_publiques.html"}, {"id": "pf-1", "titre": "Limiteur 120 Hz", "texte": "Plafonner le rendu a 60 images/s sur ecrans 120 Hz (batterie/chaleur) : la sim reste a pas fixe ; a faire seulement apres test sur le Fold 4 (risque de clignotement du canvas).", "page": "decisions.html"}, {"id": "pf-2", "titre": "Overlay ?perf=1", "texte": "Ouvrir le jeu avec ?perf=1 pour lire fps, ms sim, ms rendu et entites sur le telephone ; m'envoyer une capture pour calibrer les seuils.", "page": "decisions.html"}, {"id": "pf-3", "titre": "Seuils des 2 niveaux d'eco", "texte": "Eco 1 sous 41 fps, eco 2 sous 28 fps (decor au quart, 80 particules, 0,6 Mpx) : garder, ou durcir/adoucir apres mesure sur appareil.", "page": "decisions.html"}, {"id": "pf-4", "titre": "Cache de textures des plans lointains", "texte": "Pre-rendre les plans lointains en texture : gain faible mesure (decor 0,2-0,9 ms natif) et memoire en plus ; je recommande de ne pas le faire.", "page": "decisions.html"}, {"id": "poses_sabre_bond", "titre": "Bond fendant : detente et portee corrigees", "texte": "Saut d'articulation 46 px -> 17 px et sabre dessine a la portee (R3 passe) : exception retiree.", "page": "poses_sabre.html"}, {"id": "poses_sabre_arc", "titre": "Arc aerien : poignet borne", "texte": "La lame suit le bras au lieu de tourner trois fois : poignet max 106 deg (limite 115), 55 deg/image (limite 70) ; a valider a l'oeil (plus de tourbillon complet).", "page": "poses_sabre.html"}, {"id": "poses_sabre_taille", "titre": "Taille aerienne : raccord d'atterrissage lisse", "texte": "Saut de 40 px -> 11 px a l'atterrissage ; la pose glisse vers la reception (tous les coups aeriens, rendu seul).", "page": "poses_sabre.html"}, {"id": "poses_sabre_dette", "titre": "KNOWN_ISSUES vide", "texte": "Les 3 entrees Sora retirees ; les 6 autres etaient perimees (0 defaut mesure sur tous les heros) : liste vide, ne plus l'elargir.", "page": "poses_sabre.html"}, {"id": "poses_sabre_garde", "titre": "Garde-fou de visee sur les autres heros", "texte": "Touche Sora (9 coups) et Bo (4 coups de baton), aucun autre heros ; pas de defaut ajoute, bout-cible +0 a +12 px pour Bo.", "page": "poses_sabre.html"}, {"id": "presence-ia-delai", "titre": "IA à la place d'un joueur en arrière-plan", "texte": "Aujourd'hui : immédiate (personne n'attend, aucun gel). Alternative : 5 s de grâce avant l'IA (le joueur qui ouvre une notification ne perd pas son héros, mais l'autre peut geler 5 s).", "page": "decisions.html"}, {"id": "presence-semble-parti", "titre": "Délai « semble parti » (absent en arrière-plan)", "texte": "Réglé à 3 min (BG_GONE_MS) : après, l'annonce passe à « parti » mais la place reste reprenable. Plus court (60 s) = plus clair, plus long (5 min) = plus tolérant.", "page": "decisions.html"}, {"id": "presence-retrait-reel", "titre": "Retirer vraiment le joueur absent ?", "texte": "Aujourd'hui seule l'étiquette change ; la place est réservée 10 min (parties auto) ou le délai du salon, puis libérée. Option : libérer la place dès « parti » pour qu'un ami puisse la prendre.", "page": "decisions.html"}, {"id": "presence-affichage", "titre": "Affichage de l'état des autres joueurs", "texte": "Pastille + « Nom : arrière-plan 2:41 / reconnexion 0:42 / parti » au-dessus du héros (ambre, rouge pulsant, gris). Option : une liste fixe en haut à droite en plus.", "page": "decisions.html"}, {"id": "presence-son", "titre": "Son d'arrivée et de départ", "texte": "Un blip de voix très discret (déjà dans le jeu) à chaque départ ou retour. Option : silence total en jeu, toast seul.", "page": "decisions.html"}, {"id": "presence-version", "titre": "Version du protocole", "texte": "Changement additif (messages pres et presence ; anciens clients les ignorent ou affichent le texte). PROTOCOL_VERSION non modifié ; à toi de décider de le passer.", "page": "decisions.html"}, {"id": "presence40-vote", "titre": "Votes pendant l'attente", "texte": "Un joueur en attente bloque un vote (recompense 15 s, dialogue 40 s) jusqu'au delai existant ; on peut faire voter l'IA des l'absence pour les ecrans de vote seulement.", "page": "decisions.html"}, {"id": "presence40-afk", "titre": "Inactif mais present", "texte": "Page visible sans touche pendant 8 s : l'IA joue tout de suite (inchange) ; veux-tu aussi 40 s ici ?", "page": "decisions.html"}, {"id": "presence40-onglet", "titre": "Lien ?salon= pendant une partie", "texte": "Ouvrir un lien d'invitation dans un 2e onglet remplace l'ancien onglet (meme jeton) : proposer de demander confirmation avant de quitter la partie en cours.", "page": "decisions.html"}, {"id": "presence40-iab", "titre": "Avis navigateur integre", "texte": "L'avis discret d'installation (12 s, une fois par session) s'affiche aussi quand le jeu marche : le garder, ou le limiter aux seuls echecs de demarrage ?", "page": "decisions.html"}, {"id": "presence40-plein", "titre": "Salon plein public", "texte": "Une partie publique pleine renvoie automatiquement vers une autre partie publique (sinon en ouvre une) ; la privee reste refusee avec Creer ma partie / Reessayer.", "page": "decisions.html"}, {"id": "qp-1", "titre": "Doublon des écrans Choix du lieu", "texte": "Les écrans « plan » et « stage » portent le même titre et listent les mêmes lieux : n'en garder qu'un (le plan) et retirer l'autre du parcours ?", "page": "decisions.html"}, {"id": "qp-2", "titre": "Reskins de lanceurs", "texte": "Une vingtaine d'ennemis « Lanceur de X » ne changent que de nom, de teinte et de projectile : les fusionner en 4 ou 5 archétypes (équilibre à re-mesurer avec tools/swarm) ou garder un lanceur par lieu ?", "page": "decisions.html"}, {"id": "qp-3", "titre": "Pavé de flèches tactile dans les menus", "texte": "Le pavé de 4 flèches + OK reste affiché à droite de tous les écrans de menu tactiles : le masquer quand le doigt navigue déjà (glisser/toucher les lignes) ?", "page": "decisions.html"}, {"id": "qr_pastille", "titre": "Une pastille de qualite par joueur", "texte": "Vert bon, orange lent, rouge tres lent, au-dessus du heros, fusionnee avec la presence (une seule pastille). Ma propre pastille n'apparait que degradee.", "page": "decisions.html"}, {"id": "qr_seuils", "titre": "Seuils de la pastille", "texte": "Bon jusqu'a 150 ms d'aller-retour, lent jusqu'a 300 ms, rouge au-dela ; une gigue de plus de 60 ms retire le vert. A valider sur reseau reel.", "page": "decisions.html"}, {"id": "qr_attente", "titre": "Seuil d'attente neutre du relais", "texte": "Mesure : le gel des autres reste <= 0,85 s avec 900 ms comme avec 1500 ms ; je garde 900 ms.", "page": "decisions.html"}, {"id": "qr_message", "titre": "Message « Karim est lent »", "texte": "Dit a partir de 0,6 s d'attente continue (1,5 s ne parlerait jamais, le relais coupe avant). Plusieurs absents : « Connexion lente ».", "page": "decisions.html"}, {"id": "qr_salon", "titre": "Pastille dans la liste du salon", "texte": "La liste du salon d'attente montre la pastille de qualite des humains ; en partie, les marqueurs au-dessus des heros ([IA] et pastille) font office de liste.", "page": "decisions.html"}, {"id": "rejeu-1", "titre": "Rapports rejouables : a deployer", "texte": "Les rapports joignent maintenant un enregistrement exact de la partie ; il faut deployer (serveur 512 Ko + page + wasm) pour recevoir les premiers rapports rejouables.", "page": "decisions.html"}, {"id": "rejeu-2", "titre": "Bug web/PC corrige (IA confuse)", "texte": "Le statut Confusion de l'IA utilisait cos/sin de la plateforme : web et PC pouvaient diverger ; corrige avec detmath (change le hash dans ce seul cas).", "page": "decisions.html"}, {"id": "rejeu-3", "titre": "Solo hors ligne non enregistre", "texte": "Seules les parties en ligne (1 a 8 places) sont enregistrees ; faut-il aussi enregistrer le solo hors ligne (config d'un Run) ?", "page": "decisions.html"}, {"id": "rejeu-4", "titre": "Tests de reference figes", "texte": "Les 3 fichiers de tools/replays echouent a toute modification de la simulation ; regenerer avec la commande du journal quand le changement est voulu.", "page": "decisions.html"}, {"id": "v2autres_rb_zui_5", "titre": "Zui #5 Ruee de l'ivrogne", "texte": "Charge d'epaule : epaule avant, jambe arriere qui pousse, le contact vient de l'epaule.", "page": "remplacements_v2_autres.html"}, {"id": "v2autres_rb_zui_31", "titre": "Zui #31 Ruade de la mule", "texte": "Plus de retournement : penche en avant, mains au sol, jambe arriere tendue.", "page": "remplacements_v2_autres.html"}, {"id": "v2autres_rb_yume_31", "titre": "Yume #31 Ruade du lit", "texte": "Plus de retournement : bras en ailes, pantoufle droit en arriere.", "page": "remplacements_v2_autres.html"}, {"id": "v2autres_rb_yume_15", "titre": "Yume #15 Coude d'oreiller", "texte": "Elle saute apres l'adversaire projete (genou ramene), puis plonge coude en avant.", "page": "remplacements_v2_autres.html"}, {"id": "v2autres_ra_kage_22", "titre": "Kage #22 Ruade de l'ombre", "texte": "Buste presque horizontal, mains vers le sol, jambe arriere tendue : on lit une ruade.", "page": "remplacements_v2_autres.html"}, {"id": "v2autres_ra_tetsu_5", "titre": "Tetsu #5 Uppercut", "texte": "Charge profonde puis detente totale : talons decolles, poing au menton, buste renverse.", "page": "remplacements_v2_autres.html"}, {"id": "rv2_nova17_nom", "titre": "Nova_17 : « Pomme rotative » ou « Paume rotative » ?", "texte": "Renomme comme demande en « Pomme rotative » ; mais le nom d'avant etait deja « Paume rotative » (dictee ?) : confirme, retour en une ligne si c'est « Paume ».", "page": "remplacements_v2_gorr_nova.html"}, {"id": "rv2_gorr5_deux", "titre": "Gorr_5 : deux uppercuts = deux bras ?", "texte": "J'ai fait monter les DEUX bras avec un saut de 16 px et une pose d'impact gelee ; si tu voulais deux coups successifs, c'est un autre changement (frames et degats).", "page": "remplacements_v2_gorr_nova.html"}, {"id": "rv2_hitstop", "titre": "Sentir plus l'impact : allonger l'arret d'impact", "texte": "Les poses sont maintenant gelees sur le bon geste pendant l'arret (10 a 13 images) ; si ce n'est pas assez, +3 images sur Gorr_3/5 et Nova_23 (non applique, equilibre).", "page": "remplacements_v2_gorr_nova.html"}, {"id": "rv2_hitbox", "titre": "Hitbox plus longue que le membre dessine", "texte": "Ces coups gardent leur portee ; le dessin avance le corps pour l'atteindre (ecart reste -0,35 a -0,65 taille) : accepter, ou raccourcir la hitbox (change l'equilibre).", "page": "remplacements_v2_gorr_nova.html"}, {"id": "rv2_kage22", "titre": "Kage_22 : meme defaut que Gorr_26", "texte": "Sa ruade jette la jambe derriere sans pivoter (meme cause) ; appliquer le meme correctif (dos tourne, pied vers l'adversaire) ?", "page": "remplacements_v2_gorr_nova.html"}, {"id": "rv2_gorr4", "titre": "Gorr_4 : ancienne version restituee", "texte": "Retour a l'ancien Coup de pied frontal ; les images de la refonte restent comme modele interne des autres coups, plus jouees.", "page": "remplacements_v2_gorr_nova.html"}, {"id": "sora_v2_sora_4", "titre": "Sora_4 : Bond fendant", "texte": "Poignet naturel : bras releve avant l'armee, plus de retournement de l'avant-bras apres l'impact (garde-fou de visee).", "page": "remplacements_v2_sora.html"}, {"id": "sora_v2_sora_10", "titre": "Sora_10 : Arc aerien (ex-Tourbillon aerien)", "texte": "Meme animation validee, titre renomme.", "page": "remplacements_v2_sora.html"}, {"id": "sora_v2_sora_12", "titre": "Sora_12 : Coupe de charge", "texte": "Retour a l'ancienne version (impact plus sensible).", "page": "remplacements_v2_sora.html"}, {"id": "sora_v2_sora_19", "titre": "Sora_19 : Fendoir retourne", "texte": "Poignet dans l'amplitude humaine (max 113 deg, avant 174).", "page": "remplacements_v2_sora.html"}, {"id": "sora_v2_sora_28", "titre": "Sora_28 : Taille aerienne (ex-Moulinet aerien)", "texte": "Refait : taille horizontale en l'air, le bras suit la lame (poignet max 34 deg).", "page": "remplacements_v2_sora.html"}, {"id": "sora_v2_sora_35", "titre": "Sora_35 : Estoc fendant", "texte": "Coup large : grand pas, jambes ecartees, bras arriere ouvert, estoc bras tendu.", "page": "remplacements_v2_sora.html"}, {"id": "replay_png_compact", "titre": "Photos de replay compactes", "texte": "Les photos PNG du replay passent d'environ 1,5 Mo a quelques dizaines de Ko (sans dependance) : on garde ce format pour le partage ?", "page": "replay.html"}, {"id": "replay_seed_pin", "titre": "Graines du jour epinglees", "texte": "Le defi du jour a la meme graine sur toutes les plateformes, verrouillee par test : on accepte de ne jamais la changer ?", "page": "tournoi.html"}, {"id": "replay_determinisme", "titre": "Rejeu et seek verifies", "texte": "Le rejeu et le saut dans le temps redonnent le meme state_hash (teste) : on peut s'en servir comme preuve pour les classements ?", "page": "replay.html"}, {"id": "responsive", "titre": "Responsive à la racine : un seul système de mise en page", "texte": "12 formats (Fold 4 plié/déplié, téléphones, tablettes, PC, ultra-large), avant / après.", "page": "decisions.html"}, {"id": "resp2_finale", "titre": "Ecrans de fin en portrait", "texte": "Cortege, generique, bilan, Yume, apres-jeu occupent maintenant toute la zone utile : valider la planche avant/apres.", "page": "responsive.html"}, {"id": "resp2_textw", "titre": "Mesure de texte commune", "texte": "view::text_w mesure la police par defaut sans accents (debordements possibles) : le corriger pour tout le jeu changerait tous les menus, a valider.", "page": "responsive.html"}, {"id": "resp2_lint", "titre": "Reste du lint", "texte": "23 appels bruts restent dans menu_bar, touch_ui (qui construisent le Frame), labo et main : a garder tels quels ?", "page": "responsive.html"}, {"id": "rld-1", "titre": "Icones des passifs", "texte": "Plusieurs passifs differents partagent la meme goutte (venin, poudre toxique, patient zero) et ressemblent a des doublons : donner une icone propre a chacun ?", "page": "decisions.html"}, {"id": "rld-2", "titre": "Niveaux des pouvoirs a statut", "texte": "Un statut au niveau 2 ou 3 ajoute seulement de la chance d'effet (plafonnee) : veux-tu un vrai bonus par niveau (duree, degats) ?", "page": "decisions.html"}, {"id": "rld-3", "titre": "Quand tout est au maximum", "texte": "Si tous les pouvoirs sont au niveau max, on propose ration, bourse ou parchemin : preferes-tu un gros bonus de PV a la place ?", "page": "decisions.html"}, {"id": "rld-4", "titre": "Amelioration prioritaire", "texte": "Les ameliorations sont tirees au hasard avec les nouveaux pouvoirs : garantir une amelioration par choix quand on en possede une ?", "page": "decisions.html"}, {"id": "rld-5", "titre": "Passifs du solo hors ligne", "texte": "Les bonus de progress.rs (vitesse, soin, vampire) ont leur propre limite : a aligner sur n/3 dans une prochaine passe.", "page": "decisions.html"}, {"id": "rlp-1", "titre": "Icones : garder le style pastille encre + motif papier ?", "texte": "81 icones propres (une par pouvoir et passif), meme charte que les menus. Alternative : des icones plus grosses et plus detaillees (planche a part).", "page": "rl_polissage.html"}, {"id": "rlp-2", "titre": "Renfort d'equipe : pastille permanente ou seulement au debut de chaque etage ?", "texte": "Aujourd'hui une petite pastille reste sous la pile de gauche du HUD (solo a 5 joueurs). Option : l'afficher 4 s a l'arrivee dans l'etage puis l'effacer.", "page": "rl_polissage.html"}, {"id": "rlp-3", "titre": "Daemons au meme portrait : pastille d'arme ou vrais portraits differents ?", "texte": "5 couples de daemons se ressemblent (Dragon / Flammes de boss...). Pastille d'arme ajoutee (rendu seul). Changer l'espece d'un daemon changerait son comportement : decision d'equilibre.", "page": "rl_polissage.html"}, {"id": "rlp-4", "titre": "Intro du boss final : bandeau seul ou courte cinematique ?", "texte": "Solo et coop disent maintenant « BOSS FINAL ! » par le canal de messages, avec la mise en scene du moteur. Une cinematique dediee (2 s, camera) serait un lot a part.", "page": "rl_polissage.html"}, {"id": "rlp-5", "titre": "Passifs : tout passer a 1 ou 3 niveaux ?", "texte": "70 passifs ont 2 niveaux et Gigantisme 2 (limite du moteur) : badge « 2/2 ». Passer a n/3 demande de rebalancer les valeurs et de monter PROTOCOL_VERSION : a decider.", "page": "rl_polissage.html"}, {"id": "rlp-6", "titre": "Regles sans retour visuel (Frenesie, Trophee...) : ajouter un signal ?", "texte": "Frenesie (+2 % par coup) et d'autres cumuls n'ont aucun signal visible. Un petit anneau ou un compteur discret les rendrait lisibles.", "page": "rl_polissage.html"}, {"id": "rlsd-1", "titre": "Bonus de petite equipe visible ?", "texte": "Solo : PV x2,8 et degats x1,75, duo 60 % de ce bonus. Faut-il l'afficher (pastille « soutien ») ou le garder cache ?", "page": "decisions.html"}, {"id": "rlsd-5", "titre": "PROTOCOL_VERSION", "texte": "Les valeurs de sim changent (vagues, PV, bonus solo) : a passer a la valeur suivante au moment de livrer (decision de l'utilisateur).", "page": "decisions.html"}, {"id": "rb-1", "titre": "Structure : 3 etages + boss de biome", "texte": "Un biome = 3 etages de vagues puis l'etage du boss (4 etages au total, 4 biomes, boss final a l'etage 16). Alternative : 4 etages de vagues puis un etage de boss a part (5 par biome, run de 20 etages, plus longue).", "page": "decisions.html"}, {"id": "rb-2", "titre": "Mini-boss : 2e etage des biomes 2 a 4", "texte": "Le biome 1 n'a pas de mini-boss (entree en douceur). Garder, ou en mettre aussi un au biome 1 (Lutteur) ?", "page": "decisions.html"}, {"id": "rb-3", "titre": "La boucle garde tous les pouvoirs", "texte": "Apres le boss final, on garde TOUS les pouvoirs et les choix repartent du debut (standard, superieur, cool). Alternative : ne garder que les passifs et remettre les actifs a zero (plus dur, plus roguelike).", "page": "decisions.html"}, {"id": "rlb_debut", "titre": "Début de run : joystick, Poing, Pied, Saut", "texte": "Rien d'autre à l'écran ; chaque bouton apparaît avec son pouvoir.", "page": "roguelite_boutons.html"}, {"id": "rlb_gains", "titre": "Garde, Spécial, Super, Saisie, Course", "texte": "Garde au 1er pouvoir, Saisie et Course au 2e, Spécial avec un daemon, Super avec un super ou une forme.", "page": "roguelite_boutons.html"}, {"id": "rlb_actif", "titre": "Pouvoir actif sur le bouton Spécial", "texte": "Glyphe d'élément et jauge dans l'icône, 4 pouvoirs au plus, Tab ou direction + Spécial pour choisir.", "page": "roguelite_boutons.html"}, {"id": "rlb_16", "titre": "16 variantes de sélection des pouvoirs", "texte": "La variante 1 (pastilles en éventail) est dans le jeu ; choisis ou refais.", "page": "roguelite_boutons.html"}, {"id": "rlc_mini_boss", "titre": "Ajouter de vrais mini-boss", "texte": "Le generateur d'etages n'a que des niveaux et des boss (etages 5 et 10) : veux-tu un mini-boss aux etages 3 et 8, qui donne lui aussi un pouvoir ?", "page": "decisions.html"}, {"id": "rlc_cout_releve", "titre": "Cout de la resurrection (vie partagee)", "texte": "Le releveur paie 30 % de ses PV max et garde au moins 1 PV (impossible s'il est trop faible) : 20 %, 30 % ou 40 % ?", "page": "decisions.html"}, {"id": "rlc_upgrades", "titre": "Ameliorations +2 niveaux", "texte": "Les 17 objets d'amelioration (Brise-glace, Bobine...) ne sortent plus comme nouveau pouvoir ; veux-tu qu'ils s'ouvrent apres le 3e pouvoir ou qu'ils disparaissent du roguelite ?", "page": "decisions.html"}, {"id": "rlc_regles", "titre": "Regles passives (Vampire, Epines...)", "texte": "Elles ne sont plus donnees en roguelite coop (seuls les vrais pouvoirs le sont) : les garder hors du mode ou les offrir en bonus a part ?", "page": "decisions.html"}, {"id": "rlc_solo", "titre": "Solo : meme regle ?", "texte": "Le roguelite solo (rl_run.rs) donne encore trois cartes au choix par etage ; l'aligner sur un pouvoir aleatoire unique comme en coop ?", "page": "decisions.html"}, {"id": "rlc_gros_boss", "titre": "Gros boss = pouvoirs cool : seulement les etages 5, 10...", "texte": "Il n'existe pas de mini-boss dans le generateur : niveau ordinaire = 3 pouvoirs standards, etage de boss (5, 10) = 3 pouvoirs cool type daemon. L'etage 10 termine la run (victoire) : le seul choix cool d'une run normale est donc a l'etage 5. Faut-il ajouter un mini-boss a l'etage 3 / 8 (palier standard) et un gros boss a l'etage 10 suivi d'etages bonus ?", "page": "roguelite_choix.html"}, {"id": "rlc_minuterie", "titre": "Minuterie 10 s, premiere carte par defaut", "texte": "Chaque joueur a 10 s (0,67 s de confirmation apres le dernier choix). Sans choix, absent ou IA = la premiere proposition (tirage personnel). Trop court sur telephone, ou assez ? Alternative : 15 s.", "page": "roguelite_choix.html"}, {"id": "rlc_definitif", "titre": "Un seul appui = choix definitif", "texte": "Pas de confirmation : toucher une carte la prend (lecture au pouce). Risque : mauvais appui. Alternative : appui + 2e appui (ancien comportement des menus), plus sur mais deux clics.", "page": "roguelite_choix.html"}, {"id": "rlc_garde", "titre": "La garde est dans le kit de depart", "texte": "Poing, Pied, Saut, GARDE visibles des l'etage 1 (avant : la garde n'arrivait qu'avec le premier pouvoir). Saisie, Course, Special, Ki, Super restent gagnes. OK ?", "page": "roguelite_choix.html"}, {"id": "rlc_catalogue", "titre": "Catalogue : 29 standards, 19 cool, sans doublon", "texte": "Standards : statuts, petits daemons (vent, glace, barriere), armes (pistolet, fouet, katana), mobilite, familier. Cool : daemons de combat (seisme, foudre, tornade, comete), invocation, eveil (transformation), ultime (super), auras, 6 armes de boss. Exclus : objets abusifs, regles passives, ameliorations +2. Valider la repartition ?", "page": "roguelite_choix.html"}, {"id": "rlc_ia", "titre": "L'IA qui remplace un joueur prend la premiere carte", "texte": "Une place laissee a l'IA (ou liberee) recoit la premiere proposition a chaque etape : un retour de joueur retrouve un heros a niveau avec l'equipe. Alternative : l'IA ne gagne rien tant que l'humain est parti.", "page": "roguelite_choix.html"}, {"id": "rls_fin", "titre": "Fin de run a l'etage 10", "texte": "Le gros boss de l'etage 10 termine la run (victoire). Preferes-tu des etages bonus (11-15) apres lui, avec un 2e gros boss a 20 et ses pouvoirs cool ?", "page": "decisions.html"}, {"id": "rls_solo_bot", "titre": "Solo : le bot meurt a l'etage 4,9 en moyenne", "texte": "Le bot n'utilise pas les pouvoirs a la main ; duo 2 victoires sur 3, 4 et 8 joueurs 3/3. Garder cette courbe ou adoucir encore le solo ?", "page": "decisions.html"}, {"id": "rls_mini_boss", "titre": "Mini-boss aux etages 3 et 8", "texte": "Lutteur (3) et Maitre Noir avec escorte (8), recompense = 3 pouvoirs standards plus forts. Garder 3 et 8, ou ajouter un mini-boss a 2 ?", "page": "decisions.html"}, {"id": "rls_soin", "titre": "Soin apres etage : 60 % / 75 %", "texte": "Apres un niveau ordinaire 60 %, apres mini-boss ou boss 75 % (avant : 25 %). Trop genereux avec la vie partagee ?", "page": "decisions.html"}, {"id": "rls_filtre", "titre": "Filtre d'options en solo", "texte": "Le tirage de pouvoir solo ignore les categories coupees dans les options (meme catalogue que la coop). Supprimer l'ecran d'options ou le garder ?", "page": "decisions.html"}, {"id": "roue_1", "titre": "Roue des pouvoirs", "texte": "Tap sur Pouvoir = pouvoir par défaut ; maintenir et glisser vers l'icône voulue, relâcher pour lancer, relâcher au centre pour annuler.", "page": "roue_pouvoirs.html"}, {"id": "roue_2", "titre": "Éventail vers l'intérieur", "texte": "La roue s'ouvre vers le haut et le centre de l'écran (jamais sous le pouce), en miroir pour les gauchers.", "page": "roue_pouvoirs.html"}, {"id": "roue_3", "titre": "Nom hors du doigt", "texte": "Le nom du pouvoir visé s'affiche au-delà de son icône, pas au centre (le pouce le cacherait).", "page": "roue_pouvoirs.html"}, {"id": "roue_4", "titre": "Clavier / manette", "texte": "Aujourd'hui : Tab change de pouvoir, direction + Spécial = geste direct. Les touches 1 à 6 sont prises par les emotes : on garde Tab, ou on ajoute le stick droit ?", "page": "roue_pouvoirs.html"}, {"id": "roue_5", "titre": "Découverte sans texte", "texte": "Trois chevrons pulsent vers l'intérieur jusqu'au premier choix à la roue, puis disparaissent pour de bon.", "page": "roue_pouvoirs.html"}, {"id": "roue_6", "titre": "Garde et Saisie", "texte": "Même grammaire « maintenir + glisser » pour la Garde (roulade) : déjà là. Faut-il une roue aussi pour Ki/Super ? Je propose non (un seul geste par bouton).", "page": "roue_pouvoirs.html"}, {"id": "rythme1", "titre": "Boss trop longs", "texte": "Serre tropicale (283 s), Cantine, Louvre, 06:58 dépassent 180 s : réduire leurs PV de 15 % ?", "page": "decisions.html"}, {"id": "rythme2", "titre": "Pic Serre tropicale", "texte": "Le boss de la Serre inflige 2664 PV, le double des autres : l'adoucir ?", "page": "decisions.html"}, {"id": "sandwich_plafond", "titre": "Plafond de 3 coups en chaine", "texte": "Un heros ne prend plus que 3 coups d'affilee sans pouvoir agir (le 3e le met a terre, protege), puis 20 images d'invulnerabilite au reveil pour esquiver ou riposter ; mesure : 14 coups d'affilee avant, 3 apres.", "page": "sandwich.html"}, {"id": "sandwich_jetons", "titre": "Jetons d'attaque par cible et par cote", "texte": "Au plus 1 / 2 / 3 ennemis frappent un meme heros (facile / normal / difficile), 2 au plus s'il est encercle, jamais deux ennemis de cotes opposes en meme temps, et plus de decisions simultanees dans la meme image.", "page": "sandwich.html"}, {"id": "sandwich_telegraphe", "titre": "Coup annonce plus longtemps quand on est encercle", "texte": "Un ennemi qui attaque un heros pris en sandwich se fige 20 images avec un « ! » orange avant de frapper ; les bosses et leurs combats restent inchanges.", "page": "sandwich.html"}, {"id": "sandwich_respiration", "titre": "Respiration apres un coup encaisse", "texte": "Quand un heros est touche, les autres ennemis proches reculent et attendent 0,7 s, et ceux qui attendent leur tour ne passent plus de l'autre cote du heros.", "page": "sandwich.html"}, {"id": "sandwich_alerte", "titre": "Alerte visuelle et sonore de sandwich", "texte": "Quand des ennemis sont des deux cotes : anneau rouge pulsant, fleches rouges sur les deux flancs, bandeau « ENCERCLE ! » et cornet d'alerte (une fois toutes les 2,5 s au plus). A valider : trop discret, trop envahissant ?", "page": "sandwich.html"}, {"id": "sandwich_difficulte", "titre": "Difficulte : trop facile ou juste ?", "texte": "Coups subis par minute -24 %, PV perdus -18 %, victoires des bots 52 % -> 56 % ; les combats de boss ne changent pas. Si c'est encore trop dur, baisser le plafond a 2 ; trop facile, remonter a 4 ou raccourcir le reveil protege.", "page": "sandwich.html"}, {"id": "snes-1", "titre": "Sons SNES : écoute", "texte": "Écoute sons_snes.html : tous les effets sont générés par le moteur avec la même chaîne console (32 kHz, BRR, lecture gaussienne). Cette identité te convient-elle, ou quelles catégories refaire ?", "page": "decisions.html"}, {"id": "snes-2", "titre": "Pluie légère par défaut", "texte": "La pluie est de nouveau active par défaut (boucle de 64 s, très basse, réglable avec « Volume des ambiances », coupée à 0 %). La garder ainsi ?", "page": "decisions.html"}, {"id": "snes-3", "titre": "Jingles", "texte": "Les quatre jingles (victoire, défaite, bilan, bonus) n'ont pas été passés dans la chaîne console (ils font partie des musiques). Les passer aussi pour une identité 100 % SNES ?", "page": "decisions.html"}, {"id": "sa1", "titre": "Sons hors ecran", "texte": "Attenuer ou couper les impacts dont la source est hors de la camera (en ligne a 8 joueurs) ?", "page": "decisions.html"}, {"id": "sa2", "titre": "Predecoder la musique suivante", "texte": "Decoder en avance la piste de niveau pendant le titre (+~60 Mo memoire telephone) pour zero attente ?", "page": "decisions.html"}, {"id": "sa3", "titre": "Mesure de latence telephone", "texte": "Valider sur un vrai iPhone/Android que le premier son suit le premier toucher (non mesurable ici).", "page": "decisions.html"}, {"id": "titre-options-hub", "titre": "Roue dentee : Options directement ?", "texte": "La roue dentee ouvre Options (Reglages, Mon combattant, Profil et extras) : 2 pressions pour Reglages, comme avant. Option : un appui ouvre Reglages et Mon combattant / Profil et extras deviennent des icones de plus.", "page": "titre_arborescence.html"}, {"id": "titre-stats", "titre": "Statistiques du titre", "texte": "Une seule ligne reste (or et niveaux X/47) ; victoires, defaites et meilleur combo sont dans Options > Profil et extras > Progression. Veux-tu les voir au titre pour un joueur avance ?", "page": "titre_arborescence.html"}, {"id": "titre-quitter", "titre": "Quitter retire hors PC natif", "texte": "L'icone Quitter n'existe plus sur le web, la PWA et le telephone (rien a quitter) ; elle reste sur PC natif, a droite de la roue dentee. Confirmer.", "page": "titre_arborescence.html"}, {"id": "titre-noms", "titre": "Noms alignes", "texte": "Sous-menus renommes pour coller aux entrees : « Personnaliser » devient MON COMBATTANT, « Plus » devient PROFIL ET EXTRAS. Confirmer ces deux noms.", "page": "titre_arborescence.html"}, {"id": "vo_salon_lobby", "titre": "Salon / lobby dans le multijoueur", "texte": "9 chaînes (lobby_hub, online_ui, online_screens, online_full*) disent encore « salon » ou « stage » : les passer à « Partie » / « Lieu » quand l'équipe multi aura fini ?", "page": "vocabulaire.html"}, {"id": "vo_roguelite_passif", "titre": "Roguelite : « Bonus » -> « Passif », « Étage » -> « Biome/Étage »", "texte": "Les écrans du roguelite (rl_*, roguelite.rs) gardent « bonus », « objets » et l'or : les faire adopter Passif / Jetons par l'équipe roguelite ?", "page": "vocabulaire.html"}, {"id": "vo_parcours_long", "titre": "Parcours « Premier jour » (31 étapes)", "texte": "Il n'est plus proposé dans les menus mais le lobby (bouton Entraînement) l'ouvre encore : supprimer ce code (~2 000 lignes) ou le garder derrière le lobby ?", "page": "vocabulaire.html"}, {"id": "vo_ok", "titre": "Boutons « OK » restants", "texte": "Trois « OK » en multi et roguelite, et le bouton tactile de validation : les passer à « Valider » (place réduite sur téléphone) ?", "page": "vocabulaire.html"}]], ["Passage des agents (intégration)", [{"id": "demarrage_pwa", "titre": "Démarrage PWA (serveur endormi, cache)", "texte": "3 correctifs : reessai propre si Render repond 503, 1re visite 2x plus légère, cache v4. À valider.", "page": "demarrage_pwa.html"}, {"id": "jouissance", "titre": "Jouissance : coups finaux, combo, victoire", "texte": "Audit du plaisir de jeu : compteur de combo qui claque, mots de palier ; propositions à valider.", "page": "jouissance.html"}, {"id": "sons2", "titre": "Sons cohérents : familles, bruit de la rue, coups", "texte": "Poing, arme, feu, glace, eau, poison, gestes : écoute chaque famille, avant / après du ronflement de la rue.", "page": "sons2.html"}, {"id": "statuts", "titre": "Test des statuts : choc entretenu corrige", "texte": "Joueur-testeur : verrou par electrisation trouve et supprime.", "page": "statuts.html"}, {"id": "coherence_ux", "titre": "Cohérence textes et UX", "texte": "10 arbitrages de vocabulaire et de navigation.", "page": "coherence_ux.html"}, {"id": "coherence_visuel", "titre": "Cohérence visuelle : 6 arbitrages", "texte": "Fonds des menus, bleu nuit des maquettes, gris, ombres, écran titre, restes de noir pur. Corrections sûres déjà faites.", "page": "coherence_visuel.html"}, {"id": "armes_objets", "titre": "Armes et objets", "texte": "Lancer rate sans explosion, tactile coop, plafond au sol.", "page": "armes_objets.html"}, {"id": "navigation_menus", "titre": "Navigation des menus (joueur-testeur)", "texte": "Clavier, manette, souris, tactile : rappels de touches corriges par famille de manette, 10 constats.", "page": "navigation_menus.html"}, {"id": "playtest_online", "titre": "Playtest en ligne (bots)", "texte": "3 defauts corriges (expulsion, AFK, fin de partie), 5 propositions.", "page": "playtest_online.html"}, {"id": "sauvegarde", "titre": "Sauvegarde : test par fuzz", "texte": "1000 profils abimes testes, 3 defauts corriges (deux onglets, stockage plein, pièces), 4 points à décider.", "page": "sauvegarde.html"}]]];
var K="afh_decisions_v1",S={};
try{S=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
var ALL=TOP.slice();G.forEach(function(g){ALL=ALL.concat(g[1])});
function count(){var n=0;ALL.forEach(function(c){if(S[c.id]&&S[c.id].v)n++});document.getElementById("count").textContent=n+" / "+ALL.length+" fiches traitées"}
var L=document.getElementById("list");
function card(c,prio){
 var id=c.id,s=S[id]||(S[id]={});
 var d=document.createElement("div");d.className="card"+(prio?" prio":"");
 d.innerHTML='<h3></h3><p></p><a class="open" target="_blank" rel="noopener"></a><div class="v"></div><textarea placeholder="Commentaire (facultatif)"></textarea>';
 d.querySelector("h3").textContent=c.titre;d.querySelector("p").textContent=c.texte;
 var a=d.querySelector("a");if(!c.page||c.page==="decisions.html"){a.style.display="none";}else{a.href=c.page;a.textContent="Ouvrir la page";}
 var v=d.querySelector(".v");
 [["ok","Valider"],["no","À refaire"],["mid","À discuter"]].forEach(function(o){
  var b=document.createElement("button");b.textContent=o[1];if(s.v===o[0])b.className="on "+o[0];
  b.onclick=function(){s.v=(s.v===o[0]?"":o[0]);v.querySelectorAll("button").forEach(function(x){x.className=""});if(s.v)b.className="on "+o[0];save();count()};
  v.appendChild(b)});
 var t=d.querySelector("textarea");t.value=s.c||"";t.oninput=function(){s.c=t.value;save()};
 L.appendChild(d)}
if(TOP.length){var h=document.createElement("h2");h.className="top";h.textContent="Top 5 à trancher d'abord";L.appendChild(h);TOP.forEach(function(c){card(c,true)})}
G.forEach(function(g){var h=document.createElement("h2");h.textContent=g[0];L.appendChild(h);g[1].forEach(function(c){card(c,false)})});
count();
var NAME={ok:"VALIDÉ",no:"À REFAIRE",mid:"À DISCUTER"};
function gen(){var o=[];ALL.forEach(function(c){var s=S[c.id]||{};if(s.v||s.c)o.push("- "+c.titre+" ("+c.id+") : "+(s.v?NAME[s.v]:"sans avis")+(s.c?" | "+s.c:""))});
 document.getElementById("out").value=o.length?"Mes décisions :\n"+o.join("\n"):"Rien de traité pour l'instant."}
document.getElementById("gen").onclick=function(){gen();document.getElementById("out").scrollIntoView()};
document.getElementById("copy").onclick=function(){gen();var t=document.getElementById("out");t.select();try{document.execCommand("copy")}catch(e){}};
</script></body></html>
