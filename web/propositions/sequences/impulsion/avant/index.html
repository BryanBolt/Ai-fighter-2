<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Séquences animées du combat</title><style>
:root{--fond:#f4f0e8;--encre:#1e1e28;--acc:#e0502a;--pan:#fffaf0}
@media (prefers-color-scheme:dark){:root{--fond:#1a1a22;--encre:#f1ece0;--pan:#262630}}
body{margin:0;padding:16px;background:var(--fond);color:var(--encre);font:16px/1.4 system-ui,sans-serif}
h1{font-size:20px}select,button{min-height:44px;font:inherit;padding:0 14px;margin:2px;border-radius:8px;border:1px solid var(--encre);background:var(--pan);color:var(--encre)}
canvas{max-width:100%;background:#000;border-radius:8px;display:block;margin:10px 0}
.info{min-height:3em}a{color:var(--acc)}
</style></head><body><h1>Séquences animées du combat (vrai rendu, 60 Hz)</h1>
<div><select id="s"></select>
<button id="p">Pause</button><button id="b">&lt; image</button><button id="f">image &gt;</button>
<select id="v"><option value="1">x1 (réel)</option><option value="0.5">x0,5</option><option value="0.25" selected>x0,25 (ralenti)</option><option value="0.1">x0,1</option></select></div>
<canvas id="c"></canvas><div class="info" id="i"></div><div id="l"></div>
<script>
const D=[{"scene": "approche_pas", "titre": "Cible juste hors de portée : bond de la fente puis Z Z Z (impulsion)", "images": 60, "tuile": [317, 190], "colonnes": 12, "touches": [4, 16, 31], "trace": [{"k": 0, "hs": 0, "f0": {"st": "Idle"}, "f1": {"st": "Idle"}}, {"k": 1, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Idle"}}, {"k": 2, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Idle"}}, {"k": 3, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Idle"}}, {"k": 4, "hs": 3, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 5, "hs": 2, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 6, "hs": 1, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 7, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 8, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 9, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 10, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 11, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 12, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 13, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 14, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 15, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 16, "hs": 6, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 17, "hs": 5, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 18, "hs": 4, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 19, "hs": 3, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 20, "hs": 2, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 21, "hs": 1, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 22, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 23, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 24, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 25, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 26, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 27, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 28, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 29, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 30, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 31, "hs": 9, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 32, "hs": 8, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 33, "hs": 7, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 34, "hs": 6, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 35, "hs": 5, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 36, "hs": 4, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 37, "hs": 3, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 38, "hs": 2, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 39, "hs": 1, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 40, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 41, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 42, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 43, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 44, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 45, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 46, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 47, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 48, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 49, "hs": 0, "f0": {"st": "Attack"}, "f1": {"st": "Hitstun"}}, {"k": 50, "hs": 0, "f0": {"st": "Idle"}, "f1": {"st": "Hitstun"}}, {"k": 51, "hs": 0, "f0": {"st": "Idle"}, "f1": {"st": "Hitstun"}}, {"k": 52, "hs": 0, "f0": {"st": "Idle"}, "f1": {"st": "Hitstun"}}, {"k": 53, "hs": 0, "f0": {"st": "Idle"}, "f1": {"st": "Hitstun"}}, {"k": 54, "hs": 0, "f0": {"st": "Idle"}, "f1": {"st": "Hitstun"}}, {"k": 55, "hs": 0, "f0": {"st": "Idle"}, "f1": {"st": "Hitstun"}}, {"k": 56, "hs": 0, "f0": {"st": "Idle"}, "f1": {"st": "Hitstun"}}, {"k": 57, "hs": 0, "f0": {"st": "Idle"}, "f1": {"st": "Hitstun"}}, {"k": 58, "hs": 0, "f0": {"st": "Idle"}, "f1": {"st": "Hitstun"}}, {"k": 59, "hs": 0, "f0": {"st": "Idle"}, "f1": {"st": "Idle"}}]}];
const s=document.getElementById('s'),c=document.getElementById('c'),x=c.getContext('2d'),inf=document.getElementById('i');
let m=null,img=new Image(),k=0,play=true,t0=0,acc=0;
D.forEach((d,j)=>{const o=document.createElement('option');o.value=j;o.textContent=d.titre;s.appendChild(o)});
function charge(j){m=D[j];k=0;img=new Image();img.onload=()=>{c.width=m.tuile[0];c.height=m.tuile[1];c.style.width=(m.tuile[0]*2)+'px';dessine()};img.src=m.scene+'_planche.webp';
document.getElementById('l').innerHTML='<a href="'+m.scene+'.webp">animation réelle</a> · <a href="'+m.scene+'_lent.webp">animation ralentie</a> · <a href="'+m.scene+'_bande.jpg">bande d\'images</a>'}
function dessine(){const col=k%m.colonnes,lig=Math.floor(k/m.colonnes);x.drawImage(img,col*m.tuile[0],lig*m.tuile[1],m.tuile[0],m.tuile[1],0,0,m.tuile[0],m.tuile[1]);
const t=m.trace&&m.trace[k];const tch=m.touches.includes(k);inf.textContent='image '+k+' / '+(m.images-1)+(tch?'  TOUCHE':'')+(t&&t.hs?'  arrêt sur image '+t.hs:'')+(t?'  état '+t.f0.st+' -> '+(t.f1?t.f1.st:''):'')}
function boucle(ts){if(play){acc+=(ts-t0)*parseFloat(document.getElementById('v').value);while(acc>=1000/60){acc-=1000/60;k=(k+1)%m.images}dessine()}t0=ts;requestAnimationFrame(boucle)}
s.onchange=()=>charge(s.value);
document.getElementById('p').onclick=e=>{play=!play;e.target.textContent=play?'Pause':'Lecture'};
document.getElementById('b').onclick=()=>{play=false;document.getElementById('p').textContent='Lecture';k=(k+m.images-1)%m.images;dessine()};
document.getElementById('f').onclick=()=>{play=false;document.getElementById('p').textContent='Lecture';k=(k+1)%m.images;dessine()};
charge(0);requestAnimationFrame(boucle);
</script></body></html>
