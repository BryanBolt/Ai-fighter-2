<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Nouveaux coups de Kaze</title>
<style>body{margin:0;font:16px system-ui,sans-serif;background:#1c1d2e;color:#fff3e0;padding:12px}h1{font-size:20px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.c{background:#2a2c44;border-radius:10px;padding:10px}.c.ok{outline:3px solid #4cd07d}.c.no{outline:3px solid #e0507a}
img{width:100%;border-radius:8px;background:#000}h2{font-size:16px;margin:6px 0 2px}.n{color:#f5c542;font-weight:700}p{margin:4px 0;font-size:14px;opacity:.9}
button{font:inherit;padding:9px 12px;border-radius:8px;border:0;margin:4px 4px 0 0;color:#fff;background:#6a3b4a}button.v{background:#2f8f5b}button.x{background:#c03a62}
textarea{width:100%;box-sizing:border-box;border-radius:6px;border:0;padding:6px;margin-top:6px;background:#15162a;color:#fff3e0}#o{white-space:pre-wrap;background:#221834;padding:10px;border-radius:8px;margin-top:12px}button,input[type=button],select{min-height:44px}</style><style id="afh-responsive">
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;min-height:100dvh;overflow-x:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body{overflow-wrap:anywhere;min-height:100dvh}
img,video,canvas,svg,iframe{max-width:100%}
img,video{height:auto}
h1{font-size:clamp(18px,4.2vw,34px)}
h2{font-size:clamp(14px,3vw,24px)}
pre,textarea,input,select{max-width:100%}
@media (max-width:480px){button,a.open,select{min-height:44px}}
</style><script src="verdicts.js"></script>
</head><body>
<h1>Plaquette : les nouveaux coups de Kaze (vrai moteur)</h1>
<p>Captures du moteur, version actuelle du jeu. Pour chaque coup : Valider ou À refaire (+ remarque), puis genere le texte et colle-le dans le chat.</p>
<div class="g" id="g"></div><button onclick="out()" style="background:#e0507a;font-weight:700;margin-top:12px">Generer mon texte</button><div id="o"></div>
<script>var C=[{"key": "n1", "name": "Fouet en trois : NOUVEAU", "n": "3 pieds", "d": "Enchainements fondus + arret d'impact court. Pic de saut de pose : 22 degres (avant 106).", "img": "nouveau_1.webp"}, {"key": "n2", "name": "Rafale du flamingo : NOUVEAU", "n": "5 pieds", "d": "Meme correction. Point faible connu : la Tornade finale (pied qui se deplie en 2 images, 74 degres).", "img": "nouveau_2.webp"}, {"key": "n3", "name": "Jab, genou, talons (deja valide)", "n": "combo", "d": "Rappel de la version validee.", "img": "nouveau_3.webp"}, {"key": "n4", "name": "Lanceur du dragon (deja valide)", "n": "combo", "d": "Rappel de la version validee.", "img": "nouveau_4.webp"}, {"key": "mv_round", "name": "Coup circulaire (coup seul)", "n": "coup 2", "d": "Capture du moteur apres nettoyage des effets et gel d'impact court.", "img": "mv_round_v2.webp"}, {"key": "mv_side", "name": "Pied brise-garde (coup seul)", "n": "coup 3", "d": "Capture du moteur apres nettoyage des effets et gel d'impact court.", "img": "mv_side_v2.webp"}, {"key": "mv_vault", "name": "Pied volant (coup seul)", "n": "coup 4", "d": "Capture du moteur apres nettoyage des effets et gel d'impact court.", "img": "mv_vault_v2.webp"}, {"key": "mv_sweep", "name": "Balayage (coup seul)", "n": "coup 6", "d": "Capture du moteur apres nettoyage des effets et gel d'impact court.", "img": "mv_sweep_v2.webp"}, {"key": "mv_axe", "name": "Coup de hache (coup seul)", "n": "coup 12", "d": "Capture du moteur apres nettoyage des effets et gel d'impact court.", "img": "mv_axe_v2.webp"}, {"key": "mv_knee", "name": "Genou volant (coup seul)", "n": "coup 11", "d": "Capture du moteur apres nettoyage des effets et gel d'impact court.", "img": "mv_knee_v2.webp"}, {"key": "mv_air", "name": "Pied aerien (coup seul)", "n": "coup 10", "d": "Capture du moteur apres nettoyage des effets et gel d'impact court.", "img": "mv_air_v2.webp"}],st={};
var g=document.getElementById('g');
C.forEach(function(c){var d=document.createElement('div');d.className='c';d.id='c_'+c.key;
d.innerHTML='<img src="'+c.img+'" alt=""><h2>'+c.name+' <span class="n">'+c.n+'</span></h2><p>'+c.d+'</p><button class="v" data-k="'+c.key+'" data-v="1">Valider</button><button class="x" data-k="'+c.key+'" data-v="-1">A refaire</button><textarea id="t_'+c.key+'" rows="2" placeholder="Remarque (jambe, rythme, trainee...)"></textarea>';g.appendChild(d);});
g.addEventListener('click',function(e){var b=e.target;if(!b.dataset||!b.dataset.k)return;var v=+b.dataset.v;st[b.dataset.k]=v;document.getElementById('c_'+b.dataset.k).className='c '+(v>0?'ok':'no');});
function out(){var L=C.map(function(c){var v=st[c.key];var t=document.getElementById('t_'+c.key).value.trim();return (v>0?'VALIDE':v<0?'A REFAIRE':'NON VU')+' : '+c.name+' ('+c.n+')'+(t?' - '+t:'');});document.getElementById('o').textContent=L.join('\n');}
</script></body></html>
