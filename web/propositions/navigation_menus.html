<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Navigation des menus - AI Fighter 2</title>
<style>
:root{--encre:#221834;--papier:#fff3e0;--accent:#d8456b}
body{margin:0;font:16px system-ui,sans-serif;background:var(--papier);color:var(--encre);padding:14px;line-height:1.35}
h1{font-size:22px;margin:0 0 4px}
.c{background:#fff;border:3px solid var(--encre);border-radius:16px;padding:10px;box-shadow:5px 5px 0 var(--accent);margin:12px 0}
.c.ok{outline:4px solid #2f8f5b}.c.no{outline:4px solid var(--accent)}
p{margin:4px 0;font-size:14px}.tag{display:inline-block;background:var(--encre);color:var(--papier);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
button{font:inherit;font-weight:700;padding:10px 14px;border-radius:999px;border:2px solid var(--encre);margin:4px 6px 0 0;cursor:pointer;background:var(--papier);color:var(--encre);min-height:44px}
button.v{background:#2f8f5b;color:#fff}button.x{background:var(--accent);color:#fff}
textarea{width:100%;box-sizing:border-box;border-radius:10px;border:2px solid var(--encre);padding:6px;margin-top:6px;background:var(--papier);color:var(--encre);font:inherit}
#o{white-space:pre-wrap;background:var(--encre);color:var(--papier);padding:12px;border-radius:12px;margin-top:14px}
.go{background:var(--accent);color:#fff}
</style><script src="verdicts.js"></script>
<style id="afh-responsive">
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;min-height:100dvh;overflow-x:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body{overflow-wrap:anywhere;min-height:100dvh}
img,video,canvas,svg,iframe{max-width:100%}
img,video{height:auto}
h1{font-size:clamp(18px,4.2vw,34px)}
h2{font-size:clamp(14px,3vw,24px)}
pre,textarea,input,select{max-width:100%}
@media (max-width:480px){button,a.open,select{min-height:44px}}
</style></head><body>
<h1>Navigation des menus (joueur-testeur)</h1>
<p>Audit clavier, manette, souris, tactile. Valider ou À refaire (+ remarque), puis genere le texte et colle-le dans le chat.</p>
<div id="g"></div>
<button class="go" onclick="out()">Generer mon texte</button><div id="o"></div>
<script>
var C=[
{k:"glyphes",n:"Rappels de touches par manette",d:"CORRIGE. « A / Entree : valider   B / Echap : retour » devient « Croix : valider   Rond : retour » (PlayStation), « B : valider   A : retour » (Switch), inchange sur Xbox. Une quarantaine de pages, un seul point de remplacement."},
{k:"sorties",n:"Aucune impasse",d:"OK. Chaque ecran a un Retour (Echap, Retour arriere, B, bouton a l'ecran). Exceptions voulues : planches de capture internes et choix obligatoires."},
{k:"stick",n:"Stick, croix, repetition",d:"OK. Axe dominant, seuil 0,6, deadzone 0,3, repetition 0,4 s puis 0,12 s."},
{k:"chat",n:"Chat clavier en ligne",d:"A DISCUTER. Taper dans le chat declenche aussi les touches d'action (J I K L Z Q S D). Propose : masquer ces touches pendant la saisie (local, sans effet sur le hash). Oui ou non ?"},
{k:"hier",n:"Hierarchie des menus",d:"Titre > Options > Plus > Studio fait 4 pas. Proposition : remonter Studio et Nemesis d'un cran. Oui ou non ?"}
];
var S={},g=document.getElementById("g");
C.forEach(function(c){var d=document.createElement("div");d.className="c";d.innerHTML='<span class="tag"></span><h3></h3><p></p><button class="v">Valider</button><button class="x">A refaire</button><textarea placeholder="Commentaire (facultatif)"></textarea>';
d.querySelector(".tag").textContent=c.k;d.querySelector("h3").textContent=c.n;d.querySelector("p").textContent=c.d;
var s=S[c.k]={};var bs=d.querySelectorAll("button");
bs[0].onclick=function(){s.v="VALIDE";d.className="c ok"};bs[1].onclick=function(){s.v="A REFAIRE";d.className="c no"};
d.querySelector("textarea").oninput=function(e){s.c=e.target.value};g.appendChild(d)});
function out(){var o=[];C.forEach(function(c){var s=S[c.k];if(s&&(s.v||s.c))o.push("- "+c.n+" : "+(s.v||"sans avis")+(s.c?" | "+s.c:""))});document.getElementById("o").textContent=o.length?"Navigation menus :\n"+o.join("\n"):"Rien de traite."}
</script></body></html>
