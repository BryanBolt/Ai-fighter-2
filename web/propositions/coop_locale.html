<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Coop locale - AI Fighter 2</title>
<style>
:root{--encre:#221834;--papier:#fff3e0;--accent:#d8456b}
body{margin:0;font:16px system-ui,sans-serif;background:var(--papier);color:var(--encre);padding:14px;line-height:1.35}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:8px 0 2px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:12px}
.c{background:#fff;border:3px solid var(--encre);border-radius:16px;padding:10px;box-shadow:5px 5px 0 var(--accent)}
.c.ok{outline:4px solid #2f8f5b}.c.no{outline:4px solid var(--accent)}
p{margin:4px 0;font-size:14px}.tag{display:inline-block;background:var(--encre);color:var(--papier);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
button{font:inherit;font-weight:700;padding:10px 14px;border-radius:999px;border:2px solid var(--encre);margin:4px 6px 0 0;cursor:pointer;background:var(--papier);color:var(--encre);min-height:44px}
button.v{background:#2f8f5b;color:#fff}button.x{background:var(--accent);color:#fff}
textarea{width:100%;box-sizing:border-box;border-radius:10px;border:2px solid var(--encre);padding:6px;margin-top:6px;background:var(--papier);color:var(--encre);font:inherit}
#o{white-space:pre-wrap;background:var(--encre);color:var(--papier);padding:12px;border-radius:12px;margin-top:14px}
.go{background:var(--accent);color:#fff;margin-top:14px}</style><script src="verdicts.js"></script>
<style id="afh-responsive">
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;min-height:100dvh;overflow-x:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body{overflow-wrap:anywhere;min-height:100dvh}
img,video,canvas,svg,iframe{max-width:100%}
img,video{height:auto}
h1{font-size:clamp(18px,4.2vw,34px)}
h2{font-size:clamp(14px,3vw,24px)}
pre,textarea,input,select{max-width:100%}
@media (max-width:480px){button,a.open,select{min-height:44px}}
</style></head><body>
<h1>Coop locale : canape a 2 a 4</h1>
<p>Livres : J2 au clavier partage et join / leave a chaud. Le reste attend ta decision. Valider ou À refaire (+ remarque), puis genere le texte et colle-le dans le chat. Hors ligne seulement : rien n'entre dans le réseau.</p>
<div class="g" id="g"></div>
<button class="go" onclick="out()">Generer mon texte</button><div id="o"></div>
<script>
var C=[
{key:"kb2",name:"Clavier partage",n:"livre",d:"J1 garde ZQSD/WASD + J K I L. J2 : fleches, point = coup, slash = lourd, virgule = saut, point-virgule = garde, apostrophe = Ki, Maj droit = super, Ctrl droit = course. Actif en combat seulement."},
{key:"join",name:"Rejoindre / quitter en plein combat",n:"livre",d:"Une touche J2 ou une 2e manette branchee fait entrer le J2 (l'allie IA devient humain, degats normaux). F2 = bascule, l'IA reprend."},
{key:"j34",name:"Joueurs 3 et 4 en local",n:"a decider",d:"Controls a N joueurs + with_players + jauges N. Manettes 3 et 4 a chaud, couleur par joueur."},
{key:"select",name:"Selection coop : un heros par joueur",n:"a decider",d:"Chaque joueur valide son heros avec sa manette ; heros differents."},
{key:"touch",name:"Tactile a 2 (Fold deplie)",n:"a decider",d:"Ecran coupe en deux : gauche = J1, droite = J2, deux jeux de commandes."},
{key:"cam",name:"Camera partagee avec zoom",n:"a decider",d:"Zoom dynamique jusqu'a un minimum, le laisse ne tire les joueurs qu'au-dela."},
{key:"hud",name:"Anneau de couleur et HUD par joueur",n:"a decider",d:"Anneau J1..J4 sous les pieds, jauge par joueur."},
{key:"pause",name:"Pause : qui + bilan par joueur",n:"a decider",d:"Etiquette 'Pause : J2', bilan degats / soins / reanimations par joueur."}
],st={};
var g=document.getElementById('g');
C.forEach(function(c){var d=document.createElement('div');d.className='c';d.id='c_'+c.key;
d.innerHTML='<h2>'+c.name+' <span class="tag">'+c.n+'</span></h2><p>'+c.d+'</p><button class="v" data-k="'+c.key+'" data-v="1">Valider</button><button class="x" data-k="'+c.key+'" data-v="-1">A refaire</button><textarea id="t_'+c.key+'" rows="2" placeholder="Remarque"></textarea>';g.appendChild(d);});
g.addEventListener('click',function(e){var b=e.target;if(!b.dataset||!b.dataset.k)return;var v=+b.dataset.v;st[b.dataset.k]=v;document.getElementById('c_'+b.dataset.k).className='c '+(v>0?'ok':'no');});
function out(){var L=C.map(function(c){var v=st[c.key];var t=document.getElementById('t_'+c.key).value.trim();return (v>0?'VALIDE':v<0?'A REFAIRE':'NON VU')+' : '+c.name+' ('+c.n+')'+(t?' - '+t:'');});document.getElementById('o').textContent=L.join('\n');}
</script></body></html>
