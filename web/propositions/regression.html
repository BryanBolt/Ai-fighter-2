<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regression visuelle</title><style>
:root{--encre:#221834;--papier:#fff3e0;--accent:#d8456b;--ok:#2f7d5b;--mid:#6b5b7e}
*{box-sizing:border-box}body{margin:0;background:var(--papier);color:var(--encre);font:15px/1.45 system-ui,Segoe UI,sans-serif}
header{background:var(--encre);color:var(--papier);padding:16px 20px;position:sticky;top:0;z-index:5}
h1{margin:0 0 6px;font-size:20px}header .s{opacity:.85;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
button,select{font:inherit;border:2px solid var(--encre);background:var(--papier);color:var(--encre);padding:6px 12px;border-radius:8px;cursor:pointer}
header button,header select{border-color:var(--papier)}
button.ac{background:var(--accent);border-color:var(--accent);color:#fff}button.on{outline:3px solid var(--accent)}
main{padding:16px 20px;display:grid;gap:18px}
.card{background:#fff;border:2px solid var(--encre);border-radius:12px;padding:12px}
.card.valid{border-color:var(--ok)}.card.redo{border-color:var(--accent)}
.card h2{margin:0 0 8px;font-size:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--encre);color:var(--papier)}.tag.a{background:var(--accent)}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
figure{margin:0}figcaption{font-size:12px;color:var(--mid);margin-bottom:2px}
img{width:100%;height:auto;max-height:46vh;object-fit:contain;background:var(--encre);border-radius:6px;display:block;cursor:zoom-in}
.act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}.act textarea{flex:1;min-width:200px;height:38px;font:inherit;padding:6px;border:2px solid var(--encre);border-radius:8px}
.big{position:fixed;inset:0;background:rgba(34,24,52,.94);display:none;z-index:9;align-items:center;justify-content:center}.big img{max-height:96vh;max-width:96vw;width:auto;cursor:zoom-out}
.vide{padding:40px;text-align:center;font-size:18px}
@media(max-width:700px){.tri{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Regression visuelle</h1><div class="s" id="sum"></div>
<div class="bar"><select id="fm"><option value="">Tous formats</option></select><select id="gr"><option value="">Tous groupes</option></select>
<button id="b_all">Ecarts</button><button id="b_new">Nouveaux</button><button id="b_ok">Verdicts</button>
<button class="ac" id="exp">Exporter les verdicts</button><span id="srv"></span></div></header>
<main id="m"></main><div class="big" id="big"><img id="bigi"></div>
<script>
const DATA=[{"key": "portrait/finale_parade", "fmt": "portrait", "id": "finale_parade", "group": "dialogues", "status": "ecart", "score": 0.5208333333333334, "blocks": 650}, {"key": "portrait/finale_epilogue", "fmt": "portrait", "id": "finale_epilogue", "group": "dialogues", "status": "nouveau", "score": 0, "blocks": 0}, {"key": "portrait/finale_dawn", "fmt": "portrait", "id": "finale_dawn", "group": "dialogues", "status": "ecart", "score": 0.9270833333333334, "blocks": 1157}, {"key": "portrait/finale_stats", "fmt": "portrait", "id": "finale_stats", "group": "dialogues", "status": "ecart", "score": 0.359775641025641, "blocks": 449}, {"key": "portrait/finale_yume", "fmt": "portrait", "id": "finale_yume", "group": "dialogues", "status": "ecart", "score": 0.49278846153846156, "blocks": 615}, {"key": "portrait/finale_postgame", "fmt": "portrait", "id": "finale_postgame", "group": "dialogues", "status": "nouveau", "score": 0, "blocks": 0}, {"key": "portrait/finale", "fmt": "portrait", "id": "finale", "group": "boss", "status": "ecart", "score": 0.014423076923076924, "blocks": 18}, {"key": "paysage/finale_epilogue", "fmt": "paysage", "id": "finale_epilogue", "group": "dialogues", "status": "nouveau", "score": 0, "blocks": 0}, {"key": "paysage/finale_dawn", "fmt": "paysage", "id": "finale_dawn", "group": "dialogues", "status": "ecart", "score": 0.4623397435897436, "blocks": 577}, {"key": "paysage/finale_postgame", "fmt": "paysage", "id": "finale_postgame", "group": "dialogues", "status": "nouveau", "score": 0, "blocks": 0}, {"key": "paysage/finale", "fmt": "paysage", "id": "finale", "group": "boss", "status": "ecart", "score": 0.030448717948717948, "blocks": 38}, {"key": "pc/finale_epilogue", "fmt": "pc", "id": "finale_epilogue", "group": "dialogues", "status": "nouveau", "score": 0, "blocks": 0}, {"key": "pc/finale_dawn", "fmt": "pc", "id": "finale_dawn", "group": "dialogues", "status": "ecart", "score": 0.5072222222222222, "blocks": 1826}, {"key": "pc/finale_postgame", "fmt": "pc", "id": "finale_postgame", "group": "dialogues", "status": "nouveau", "score": 0, "blocks": 0}, {"key": "pc/finale", "fmt": "pc", "id": "finale", "group": "boss", "status": "ecart", "score": 0.028333333333333332, "blocks": 102}, {"key": "paysage/finale_parade", "fmt": "paysage", "id": "finale_parade", "group": "dialogues", "status": "ok", "score": 0.0, "blocks": 0}, {"key": "paysage/finale_stats", "fmt": "paysage", "id": "finale_stats", "group": "dialogues", "status": "ok", "score": 0.0, "blocks": 0}, {"key": "paysage/finale_yume", "fmt": "paysage", "id": "finale_yume", "group": "dialogues", "status": "ok", "score": 0.0, "blocks": 0}, {"key": "pc/finale_parade", "fmt": "pc", "id": "finale_parade", "group": "dialogues", "status": "ok", "score": 0.0, "blocks": 0}, {"key": "pc/finale_stats", "fmt": "pc", "id": "finale_stats", "group": "dialogues", "status": "ok", "score": 0.0, "blocks": 0}, {"key": "pc/finale_yume", "fmt": "pc", "id": "finale_yume", "group": "dialogues", "status": "ok", "score": 0.0, "blocks": 0}];const BASE="../../target/captures/golden/report/";
let V={};try{V=JSON.parse(localStorage.getItem("golden_verdicts")||"{}")}catch(e){}
let mode="ecart",SERVER=false;
const save=()=>{try{localStorage.setItem("golden_verdicts",JSON.stringify(V))}catch(e){}};
const fm=document.getElementById("fm"),gr=document.getElementById("gr");
[...new Set(DATA.map(d=>d.fmt))].forEach(x=>fm.add(new Option(x,x)));[...new Set(DATA.map(d=>d.group))].forEach(x=>gr.add(new Option(x,x)));
fm.onchange=gr.onchange=render;
for(const [id,m] of [["b_all","ecart"],["b_new","nouveau"],["b_ok","verdict"]])document.getElementById(id).onclick=()=>{mode=m;render()};
fetch("/api/ping").then(r=>{if(r.ok){SERVER=true;document.getElementById("srv").textContent="serveur local actif : Valider promeut aussitot la reference";render()}}).catch(()=>{});
document.getElementById("exp").onclick=()=>{const b=new Blob([JSON.stringify(V,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="golden_verdicts.json";a.click()};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
  const ec=DATA.filter(d=>["ecart","taille","manquant"].includes(d.status)),nw=DATA.filter(d=>d.status=="nouveau"),ok=DATA.filter(d=>d.status=="ok");
  const done=Object.values(V).filter(v=>v.status).length;
  document.getElementById("sum").textContent=DATA.length+" captures : "+ok.length+" identiques, "+ec.length+" ecarts, "+nw.length+" nouvelles ; "+done+" verdicts. Genere le 2026-11-10 20:01.";
  for(const [id,m] of [["b_all","ecart"],["b_new","nouveau"],["b_ok","verdict"]])document.getElementById(id).classList.toggle("on",mode==m);
  let L=mode=="ecart"?ec:mode=="nouveau"?nw:DATA.filter(d=>V[d.key]&&V[d.key].status);
  if(fm.value)L=L.filter(d=>d.fmt==fm.value);if(gr.value)L=L.filter(d=>d.group==gr.value);
  L=L.slice().sort((a,b)=>b.score-a.score);
  const m=document.getElementById("m");
  if(!L.length){m.innerHTML='<div class="vide">'+(mode=="ecart"?"Aucun ecart. Rien n'a bouge.":"Rien a afficher.")+'</div>';return}
  m.innerHTML=L.map(d=>{const v=V[d.key]||{};const p=BASE+d.fmt+"/"+d.id;
   const imgs=d.status=="nouveau"?'<figure><figcaption>Nouvelle capture (sans reference)</figcaption><img src="'+p+'_ap.webp" onerror="this.alt=\'(lancer golden_diff.py)\'"></figure>':
     '<figure><figcaption>Avant (reference)</figcaption><img src="'+p+'_av.webp"></figure><figure><figcaption>Apres</figcaption><img src="'+p+'_ap.webp"></figure><figure><figcaption>Ecart ('+d.blocks+' blocs)</figcaption><img src="'+p+'_df.webp"></figure>';
   return '<div class="card '+(v.status||"")+'" data-k="'+d.key+'"><h2>'+esc(d.id)+' <span class="tag">'+d.fmt+'</span><span class="tag">'+d.group+'</span><span class="tag a">'+d.status+(d.score?" "+(d.score*100).toFixed(1)+" %":"")+'</span></h2><div class="tri">'+imgs+'</div><div class="act"><button class="ac" data-a="valid">Valider (changement voulu)</button><button data-a="redo">A refaire</button><textarea placeholder="Commentaire">'+esc(v.comment||"")+'</textarea></div></div>'}).join("");
  m.querySelectorAll(".card").forEach(c=>{const k=c.dataset.k;
   c.querySelectorAll("button").forEach(b=>b.onclick=async()=>{V[k]=V[k]||{};V[k].status=b.dataset.a;V[k].comment=c.querySelector("textarea").value;save();
     if(SERVER&&b.dataset.a=="valid"){try{await fetch("/api/promote",{method:"POST",body:JSON.stringify({key:k})})}catch(e){}}render()});
   c.querySelector("textarea").onchange=e=>{V[k]=V[k]||{};V[k].comment=e.target.value;save()};
   c.querySelectorAll("img").forEach(i=>i.onclick=()=>{document.getElementById("bigi").src=i.src;document.getElementById("big").style.display="flex"})});
}
document.getElementById("big").onclick=()=>document.getElementById("big").style.display="none";
render();
</script></body></html>
