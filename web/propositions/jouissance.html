<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Jouissance : propositions</title>
<style>:root{--ink:#221834;--paper:#fff3e0;--acc:#d8456b}
body{margin:0;font:16px system-ui,sans-serif;background:var(--ink);color:var(--paper);padding:12px}h1{font-size:22px}.c{background:#2f2347;border-radius:10px;padding:10px;margin:10px 0}.c.ok{outline:3px solid #7bd88f}.c.no{outline:3px solid var(--acc)}
button{font:inherit;min-height:44px;padding:9px 12px;border-radius:8px;border:0;margin:4px 4px 0 0;color:#fff;background:#2f8f5b;cursor:pointer}button.x{background:var(--acc)}textarea{width:100%;box-sizing:border-box;border-radius:6px;border:0;padding:6px;margin-top:6px;background:#1a1228;color:var(--paper)}</style><script src="verdicts.js"></script>
<style id="afh-responsive">
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;min-height:100dvh;overflow-x:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body{overflow-wrap:anywhere;min-height:100dvh}
img,video,canvas,svg,iframe{max-width:100%}
img,video{height:auto}
h1{font-size:clamp(18px,4.2vw,34px)}
h2{font-size:clamp(14px,3vw,24px)}
pre,textarea,input,select{max-width:100%}
@media (max-width:480px){button,a.open,select{min-height:44px}}
</style></head><body>
<h1>Jouissance : coups finaux, combo, victoire</h1>
<p>Déjà intégré (rendu seul) : le compteur de coups claque à chaque coup et affiche un mot de palier (ENCHAÎNEMENT, SUPERBE, DÉVASTATEUR, LÉGENDAIRE).</p>
<div id="g"></div>
<script>
var P=[["Compteur qui claque + mots de palier","Intégré. Valider ou à refaire ?"],["Bilan de fin d'enchaînement","Meilleur combo et dégâts totaux au CLEAR_BEAT."],["Son de palier de combo (10/20/35)","À confier à l'agent des sons."],["Chiffre d'or flottant sur les KO","Avec aimant vers le HUD."]];
var g=document.getElementById("g");P.forEach(function(p){var d=document.createElement("div");d.className="c";d.innerHTML="<b>"+p[0]+"</b><p>"+p[1]+"</p><button>Valider</button><button class=x>À refaire</button><textarea placeholder=Commentaire></textarea>";var b=d.querySelectorAll("button");b[0].onclick=function(){d.className="c ok"};b[1].onclick=function(){d.className="c no"};g.appendChild(d)});
</script></body></html>
