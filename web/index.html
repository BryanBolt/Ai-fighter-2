<style>
  /* Jeu plein ecran : papier clair, encre sombre, accent rouge sceau. Un seul look, voulu. */
  :root { --paper: #fff3e0; --ink: #221834; --seal: #d8456b; color-scheme: light; }
  html, body { margin: 0; height: 100%; height: 100dvh; width: 100%; position: fixed; inset: 0; overflow: hidden; background: var(--paper); color: var(--ink); touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas#glcanvas { contain: strict; display: block; position: absolute; left: 0; top: 0; width: 100%; height: 100%; height: 100dvh; outline: none; touch-action: none; }
  [hidden] { display: none !important; }
  #loading { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--paper); color: var(--ink); font: 600 20px/1.4 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; text-align: center; padding: 0 16px; }
  #loading i { display: block; width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--seal); margin-bottom: 18px; opacity: .85; }
  #loading small { font-weight: 400; font-size: 14px; opacity: .8; margin-top: 8px; letter-spacing: 0; }
  #fs { position: absolute; left: max(4px, env(safe-area-inset-left)); top: 50%; transform: translateY(-50%); z-index: 3;
}
  /* Telephone en portrait : le bouton plein ecran a un emplacement FIXE (coin haut gauche, centre dans la bande de l'encoche) : jamais sur les lignes d'un menu, ni sur le HUD, ni sur les commandes en bas. */
  @media (orientation: portrait) and (max-width: 820px) { #fs { opacity: .3; top: max(calc(env(safe-area-inset-top, 0px) / 2), 22px); }
}
  /* Cible tactile >= 44 px sans agrandir le bouton visible (zone invisible autour) ; contraste releve (opacite .35 -> .55). */
  #fs::after { content: ""; position: absolute; inset: -6px; }
  #fs:focus-visible { outline: 3px solid var(--seal); outline-offset: 2px; opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #loading { transition: none !important; } }
  #fs { width: 34px; height: 34px; opacity: .55;font: 600 16px monospace; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 6px; padding: 0; }
/* Chargement : charte Encre / Papier / Accent, rien a lire (marque, mot trace, jauge, pictogrammes). Genere par tools/titre_assets.py */
  #loading { background: #221834; color: #fff3e0; gap: 0; }
  #loading .stage { position: relative; display: flex; flex-direction: column; align-items: center; width: min(86vw, 520px); }
  #loading .mk { width: min(34vw, 150px, 24vh); height: auto; overflow: visible; animation: ldHop 1.1s cubic-bezier(.3,0,.4,1) infinite; transform-origin: 50% 90%; }
  #loading .mk .pu { animation: ldBlink 3.6s infinite; transform-box: fill-box; transform-origin: center; }
  #loading .sh { width: min(24vw, 100px); height: 8px; border-radius: 50%; background: #0000004d; margin: 6px 0 14px; animation: ldShadow 1.1s cubic-bezier(.3,0,.4,1) infinite; }
  #loading .wm { width: min(60%, 200px); height: auto; overflow: visible; }
  #loading .sub { margin-top: 8px; font: 600 clamp(12px, 3.4vw, 16px)/1.2 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .18em; color: #fff3e0; opacity: .85; text-align: center; }
  #loading .wm .l { animation: ldDrop .5s cubic-bezier(.2,1.4,.4,1) both; animation-delay: calc(var(--i) * .06s + .1s); transform-box: fill-box; transform-origin: center; }
  #loading .wm .two { animation-delay: .85s; }
  #loading .rail { width: 100%; height: 10px; border-radius: 99px; background: #fff3e026; margin-top: 12px; overflow: hidden; }
  #loading .rail b { display: block; height: 100%; width: 4%; border-radius: 99px; background: #ffd27a; transition: width .25s ease-out; }
  #loading .tips { position: relative; width: 84px; height: 100px; margin-top: 18px; }
  #loading .tips svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; stroke: #fff3e0; stroke-width: 10; stroke-linecap: round; animation: ldTip 3.6s infinite; }
  #loading .tips svg:nth-child(2) { animation-delay: 1.2s; }
  #loading .tips svg:nth-child(3) { animation-delay: 2.4s; }
  @keyframes ldHop { 0%, 100% { transform: translateY(0) scale(1.06, .92); } 45% { transform: translateY(-26px) scale(.96, 1.06); } 90% { transform: translateY(0) scale(1.06, .92); } }
  @keyframes ldShadow { 0%, 100% { transform: scaleX(1); opacity: .9; } 45% { transform: scaleX(.6); opacity: .5; } }
  @keyframes ldBlink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  @keyframes ldDrop { from { transform: translateY(-34px) scale(1.5); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes ldTip { 0%, 30%, 100% { opacity: 0; transform: translateY(8px); } 6%, 26% { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #loading .mk, #loading .sh, #loading .wm .l, #loading .mk .pu { animation: none; } #loading .tips svg { animation: none; } #loading .tips svg:first-child { opacity: 1; } #loading .rail b { transition: none; } }

  /* Ecran d'attente vivant : pluie neon, etapes, secondes ecoulees, astuces, echec avec « Reessayer ». Injecte par le script #afh-boot. */
  #loading .stage { z-index: 1; }
  #loading { justify-content: flex-start; padding-top: calc(max(10px, 2.5vh) + var(--upd, 0px)); }
  #ld-scene { display: block; width: 100vw; max-width: none; height: clamp(120px, 40dvh, 440px); margin: 8px 0 0; border-radius: 0; pointer-events: none; }
  @media (orientation: landscape) { #ld-scene { height: 54dvh; } #loading .wm { width: min(34%, 150px); } #loading .sub { margin-top: 4px; } }
  @media (orientation: landscape) and (max-height: 520px) { #ld-scene { height: 43dvh; margin-top: 4px; } #loading .wm { width: min(26%, 118px); } #loading .rail { margin-top: 8px; } #ld-info { gap: 3px; bottom: max(6px, env(safe-area-inset-bottom)); } }
  #ld-rain { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  #ld-info { position: absolute; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 16px; font: 600 14px/1.4 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0; color: #fff3e0; }
  #ld-steps { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #ld-steps span { padding: 3px 10px; border: 1px solid #fff3e04d; border-radius: 99px; font-size: 12px; opacity: .5; }
  #ld-steps span.on { opacity: 1; border-color: #ffd27a; color: #ffd27a; animation: ldPulse 1.2s ease-in-out infinite; }
  #ld-steps span.ok { opacity: .9; border-color: #6fe3a1; color: #6fe3a1; }
  #ld-steps span.ko { opacity: 1; border-color: #d8456b; color: #d8456b; }
  #ld-msg { position: static !important; font-size: 13px; opacity: .85; min-height: 1.4em; }
  #ld-clock { font-size: 12px; opacity: .7; }
  #ld-calm { min-height: 1.4em; color: #ffd27a; font-size: 13px; text-align: center; }
  #ld-tip { max-width: min(92vw, 520px); min-height: 2.8em; font-weight: 400; font-size: 13px; opacity: .9; text-align: center; transition: opacity .4s; }
  #ld-fail { display: none; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  #ld-fail.on { display: flex; }
  #ld-fail b { color: #ff8aa6; }
  #ld-fail button { min-height: 48px; min-width: 180px; font: 600 17px ui-monospace, Menlo, Consolas, monospace; border: 2px solid #d8456b; background: #d8456b; color: #fff; border-radius: 8px; }
  @keyframes ldPulse { 50% { opacity: .55; } }
  @media (max-height: 520px) { #ld-tip { display: none; } }
  @media (prefers-reduced-motion: reduce) { #ld-steps span.on { animation: none; } }
</style>

<div id="loading" role="status" aria-label="Chargement"><div class="stage"><svg class="wm" viewBox="-0.8 -0.8 32.20 7.60" role="img" aria-label="InkRise"><g fill="none" stroke="#fff3e0" stroke-width="0.62" stroke-linecap="round" stroke-linejoin="round"><g class="l" style="--i:0"><path d="M0.00 0.00 L0.00 6.00"/></g><g class="l" style="--i:1"><path d="M1.70 6.00 L1.70 0.00 L5.70 6.00 L5.70 0.00"/></g><g class="l" style="--i:2"><path d="M7.40 0.00 L7.40 6.00"/><path d="M11.40 0.00 L7.40 3.00 L11.40 6.00"/></g><g stroke="#d8456b"><g class="l two" style="--i:3"><path d="M13.10 6.00 L13.10 0.00 L16.10 0.00 L17.10 1.00 L17.10 2.00 L16.10 3.00 L13.10 3.00"/><path d="M15.10 3.00 L17.10 6.00"/></g><g class="l two" style="--i:4"><path d="M18.80 0.00 L18.80 6.00"/></g><g class="l two" style="--i:5"><path d="M24.50 0.00 L20.50 0.00 L20.50 3.00 L24.50 3.00 L24.50 6.00 L20.50 6.00"/></g><g class="l two" style="--i:6"><path d="M30.20 0.00 L26.20 0.00 L26.20 6.00 L30.20 6.00"/><path d="M26.20 3.00 L29.20 3.00"/></g></g></g></svg><div class="sub">the Stickman Ascension</div><canvas id="ld-scene" role="img" aria-label="Extrait de combat du jeu devant une haute tour"></canvas><div class="rail" role="progressbar" aria-valuemin="0" aria-valuemax="100"><b id="ld-bar"></b></div></div></div>
<script id="afh-boot">
// Attente vivante, des le premier octet de la page (avant le wasm) : reveil du serveur gratuit en parallele du telechargement,
// etapes lisibles, secondes ecoulees, message rassurant apres 15 s, astuces, pluie legere, et un vrai echec avec « Reessayer ».
(function () {
  var W = window, D = document, t0 = Date.now();
  var wk = W.afhWake = { st: 0, tries: 0 };
  // 1) Reveil du relais : /api/status repete jusqu'a une reponse, sans jamais bloquer le chargement du wasm.
  function ping() {
    if (wk.st === 2) return;
    if (Date.now() - t0 > 275000) { wk.st = 3; return; } // meme budget que le telechargement (4 min 30)
    if (navigator.onLine === false) { setTimeout(ping, 2000); return; }
    wk.tries++; wk.st = 1;
    var ctl = W.AbortController ? new AbortController() : null, to = setTimeout(function () { try { if (ctl) ctl.abort(); } catch (e) {} }, 20000);
    fetch("/api/status", { cache: "no-store", signal: ctl ? ctl.signal : undefined }).then(function (r) { clearTimeout(to); if (r && r.ok) wk.st = 2; else setTimeout(ping, Math.min(3000 + wk.tries * 1000, 10000)); }, function () { clearTimeout(to); setTimeout(ping, Math.min(3000 + wk.tries * 1000, 10000)); });
  }
  try { if (location.protocol.indexOf("http") === 0 && W.fetch) { ping(); try { fetch("/health", { mode: "no-cors", cache: "no-store" }).catch(function () {}); } catch (e) {} } else wk.st = 3; } catch (e) { wk.st = 3; }

  var l = D.getElementById("loading"); if (!l) return;
  // 2) Pluie neon (canvas leger, arretee quand le jeu est pret ou la page masquee).
  var cv = D.createElement("canvas"); cv.id = "ld-rain"; l.insertBefore(cv, l.firstChild);
  var cx = cv.getContext && cv.getContext("2d"), drops = [], calm = W.matchMedia && W.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size() { cv.width = Math.max(1, Math.round(l.clientWidth / 2)); cv.height = Math.max(1, Math.round(l.clientHeight / 2)); }
  size(); W.addEventListener("resize", size);
  for (var i = 0; i < 70; i++) drops.push({ x: Math.random(), y: Math.random(), v: .6 + Math.random() * .9, c: i % 5 ? "#8fd0ff" : (i % 2 ? "#d8456b" : "#ffd27a") });
  function rain() {
    if (!cx || l.hidden || l.style.opacity === "0") return;
    if (!D.hidden) {
      cx.clearRect(0, 0, cv.width, cv.height); cx.lineWidth = 1; cx.globalAlpha = .45;
      for (var i = 0; i < drops.length; i++) { var d = drops[i]; d.y += d.v * .012; d.x -= d.v * .002; if (d.y > 1.05) { d.y = -.05; d.x = Math.random() * 1.1; } cx.strokeStyle = d.c; cx.beginPath(); cx.moveTo(d.x * cv.width, d.y * cv.height); cx.lineTo(d.x * cv.width - 2, d.y * cv.height + 8 + d.v * 6); cx.stroke(); }
    }
    if (!calm) requestAnimationFrame(rain);
  }
  if (calm) { rain(); } else requestAnimationFrame(rain);
  // 3) Bloc d'information.
  var info = D.createElement("div"); info.id = "ld-info";
  info.innerHTML = '<div id="ld-steps" aria-hidden="true"><span id="ld-s1">Chargement du jeu</span><span id="ld-s2">Réveil du serveur</span><span id="ld-s3">Connexion</span></div>' +
    '<div id="ld-msg" aria-live="polite"></div><div id="ld-clock"></div><div id="ld-calm"></div><div id="ld-tip"></div>' +
    '<div id="ld-fail" role="alert"><b id="ld-failmsg"></b><button id="ld-retry" type="button">Réessayer</button></div>';
  l.appendChild(info);
  var $ = function (id) { return D.getElementById(id); };
  var TIPS = [
    "Astuce : la direction compte. Tiens ↑ ou ↓ en frappant pour changer l'angle de l'attaque.",
    "Astuce : esquive au bon moment, une roulade te rend intouchable un court instant.",
    "Astuce : chaque arme a sa portée. Ramasse-la, puis garde ta distance pour frapper en premier.",
    "Astuce : enchaîne poing, pied, puis recule avant la riposte : ne reste jamais collé à l'adversaire."
  ], ti = Math.floor(Math.random() * TIPS.length), failed = false;
  function tip() { var e = $("ld-tip"); if (!e) return; e.style.opacity = 0; setTimeout(function () { e.textContent = TIPS[ti++ % TIPS.length]; e.style.opacity = .9; }, 350); }
  $("ld-tip").textContent = TIPS[ti++ % TIPS.length]; setInterval(function () { if (!failed) tip(); }, 6000);
  function fail(text) {
    if (failed) return; failed = true;
    $("ld-failmsg").textContent = text; $("ld-fail").className = "on"; $("ld-calm").textContent = ""; $("ld-tip").style.display = "none"; $("ld-clock").textContent = "";
    var s = $("ld-s1"); if (s && !(W.afhLoad && W.afhLoad.done)) s.className = "ko";
    try { var b = l.querySelector(".rail b"); if (b) b.style.background = "#d8456b"; } catch (e) {}
  }
  W.afhBootFail = fail;
  $("ld-retry").addEventListener("click", function () { try { sessionStorage.removeItem("afh_load_tries"); sessionStorage.removeItem("afh_resume"); sessionStorage.removeItem("afh_rl"); sessionStorage.removeItem("afh_load_reload"); } catch (e) {} location.reload(); });
  // 4) Horloge : une fois par seconde (etapes, secondes, message rassurant, echec reel).
  function tick() {
    if (l.hidden || l.style.opacity === "0" || failed) return;
    var L = W.afhLoad || {}, sec = Math.floor((Date.now() - t0) / 1000), done = !!L.done;
    var s1 = $("ld-s1"), s2 = $("ld-s2"), s3 = $("ld-s3");
    s1.className = done ? "ok" : "on";
    s2.className = wk.st === 2 ? "ok" : (wk.st === 3 && L.failed ? "ko" : "on");
    s3.className = done && wk.st === 2 ? "on" : "";
    s3.textContent = done ? "Démarrage" : "Connexion";
    $("ld-clock").textContent = "Temps écoulé " + Math.floor(sec / 60) + ":" + ("0" + (sec % 60)).slice(-2) + (L.attempt > 1 ? " · essai " + L.attempt : "");
    var m = "";
    if (sec >= 15 && (wk.st === 1 || !done)) m = "Le serveur se réveille, ça peut prendre une à deux minutes. Pas de panique, ça avance.";
    if (sec >= 40 && !done && !L.bytes) m = "Toujours en route… la première visite est la plus longue, la suite sera instantanée.";
    if (sec >= 120 && !done && !L.bytes) m = "Le serveur met du temps à se réveiller. On continue d'essayer, merci de patienter.";
    $("ld-calm").textContent = m;
    if (L.offline || navigator.onLine === false) $("ld-msg").textContent = "Pas de connexion : le chargement reprendra tout seul dès que le réseau revient.";
    else if (!L.bytes && !done && sec > 3) $("ld-msg").textContent = wk.st === 2 ? "Le serveur répond, le jeu arrive…" : "Réveil du serveur… (essai " + Math.max(1, wk.tries) + ")";
    // Echec seulement quand le telechargement patient a épuisé son budget (voir wasmFetch) : jamais pendant un simple réveil du serveur.
    if (L.failed) fail(L.failMsg || "Le chargement n'a pas abouti.");
  }
  setInterval(tick, 1000); tick();
})();
</script>

<script>
// Notifications push d'invitation : tout est optionnel, la permission n'est demandee que sur un clic.
(function () {
  var LS = "afh_circle", EP = "afh_push_ep";
  function get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  var $ = function (id) { return document.getElementById(id); };
  var msg = function (t) { $("pfm").textContent = t; };
  var ok = ("serviceWorker" in navigator) && ("PushManager" in window) && ("Notification" in window) && location.protocol.indexOf("http") === 0;
  if (!ok) return;
  fetch("/push/key").then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
    if (!j || !j.key) return;
    window.afhPushKey = j.key; $("pf").hidden = false; $("pfc").value = get(LS);
  }).catch(function () {});
  function b64(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); var r = atob(s + "===".slice((s.length + 3) % 4)); var a = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a; }
  $("pf").onclick = function () { $("pfp").hidden = false; };
  $("pfx").onclick = function () { $("pfp").hidden = true; };
  $("pfn").onclick = function () { var A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", c = ""; var r = new Uint8Array(5); crypto.getRandomValues(r); for (var i = 0; i < 5; i++) c += A[r[i] % A.length]; $("pfc").value = c; };
  $("pfa").onclick = function () {
    var c = $("pfc").value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (c.length < 5) { msg("Code de 5 caracteres minimum."); return; }
    msg("Activation...");
    Notification.requestPermission().then(function (p) {
      if (p !== "granted") { msg("Notifications refusees par le navigateur."); throw 0; }
      return navigator.serviceWorker.ready;
    }).then(function (reg) {
      return reg.pushManager.getSubscription().then(function (s) { return s || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(window.afhPushKey) }); });
    }).then(function (s) {
      var name = get("afh_name") || "";
      return fetch("/push/subscribe", { method: "POST", body: JSON.stringify({ circle: c, subscription: s.toJSON(), name: name }) }).then(function (r) {
        if (!r.ok) throw new Error("serveur");
        set(LS, c); set(EP, s.endpoint); msg("C'est fait : partage le code " + c + " a tes amis.");
      });
    }).catch(function (e) { if (e !== 0) msg("Impossible d'activer (reessaie dans un instant)."); });
  };
  // Appele par le jeu quand il copie le lien d'invitation : previent le cercle (le serveur limite a 1 fois / 30 s).
  window.afhPushInvite = function (url) {
    var c = get(LS); if (!c) return;
    try { var m = /[?&]salon=([A-Za-z0-9]+)/.exec(url); if (!m) return;
      fetch("/push/invite", { method: "POST", body: JSON.stringify({ circle: c, code: m[1], endpoint: get(EP) }) }).catch(function () {}); } catch (e) {}
  };
})();
</script>
<script id="afh-guard">
// Garde-fous de la page (robustesse telephone) : doigts fantomes, touches collees, son et pause quand la page est
// masquee, ecran qui reste allume, rotation, erreurs fatales visibles. Tout est defensif : aucune exception ne sort.
