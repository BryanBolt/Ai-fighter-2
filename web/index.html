<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preload" href="ai_fighter_2.wasm" as="fetch" type="application/wasm" crossorigin>
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#221834">

<title>AI Fighter 2</title>
<style>
  /* Jeu plein ecran : papier clair, encre sombre, accent rouge sceau. Un seul look, voulu. */
  :root { --paper: #f7f6f4; --ink: #1a1a22; --seal: #d6423a; color-scheme: light; }
  html, body { margin: 0; height: 100%; height: 100dvh; width: 100%; position: fixed; inset: 0; overflow: hidden; background: var(--paper); color: var(--ink); touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas#glcanvas { contain: strict; display: block; position: absolute; left: 0; top: 0; width: 100%; height: 100%; height: 100dvh; outline: none; touch-action: none; }
  [hidden] { display: none !important; }
  #loading { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--paper); color: var(--ink); font: 600 20px/1.4 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; text-align: center; padding: 0 16px; }
  #loading i { display: block; width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--seal); margin-bottom: 18px; opacity: .85; }
  #loading small { font-weight: 400; font-size: 14px; opacity: .8; margin-top: 8px; letter-spacing: 0; }
  #fs { position: absolute; right: max(6px, env(safe-area-inset-right)); top: max(6px, env(safe-area-inset-top)); z-index: 3;
}
  /* Telephone en portrait : le bouton plein ecran quitte le HUD (barre de vie adverse) et se pose en bas, entre le stick et les boutons. */
  @media (orientation: portrait) and (max-width: 820px) { #fs { top: auto; right: auto; left: max(6px, env(safe-area-inset-left)); bottom: max(6px, env(safe-area-inset-bottom)); transform: none; opacity: .25; }
}
  /* Cible tactile >= 44 px sans agrandir le bouton visible (zone invisible autour) ; contraste releve (opacite .35 -> .55). */
  #fs::after { content: ""; position: absolute; inset: -6px; }
  #fs:focus-visible { outline: 3px solid var(--seal); outline-offset: 2px; opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #loading { transition: none !important; } }
  #fs { width: 34px; height: 34px; opacity: .55;font: 600 16px monospace; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 6px; padding: 0; }
</style>
</head>
<body>

<canvas id="glcanvas" tabindex="1"></canvas>
<div id="loading"><i></i>AI FIGHTER 2<small>chargement, quelques secondes...</small></div>
<button id="fs" title="Plein ecran" aria-label="Plein ecran">[ ]</button>
<button id="pf" title="Prevenir mes amis" aria-label="Prevenir mes amis" hidden>Amis</button>
<div id="pfp" hidden>
  <b>Prevenir mes amis</b>
  <p>Un code d'amis commun, puis chaque ami active les notifications : quand tu cliques sur Inviter, il recoit un message.</p>
  <label>Code d'amis <input id="pfc" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="ex. K7M2Q"></label>
  <div><button id="pfn" type="button">Nouveau code</button> <button id="pfa" type="button">Activer</button> <button id="pfx" type="button">Fermer</button></div>
  <small id="pfm"></small>
</div>
<style>
  #pf { position: absolute; left: max(6px, env(safe-area-inset-left)); top: max(6px, env(safe-area-inset-top)); z-index: 3; opacity: .3; font: 600 12px monospace; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 6px; padding: 6px 8px; }
  #pf:hover, #pf:focus { opacity: .9; }
  #pfp { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5; width: min(320px, 90vw); box-sizing: border-box; padding: 14px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 8px; font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  #pfp[hidden], #pf[hidden] { display: none; }
  #pfp p, #pfp small { display: block; margin: 8px 0; font-size: 12px; opacity: .8; }
  #pfp input { width: 100%; box-sizing: border-box; font: inherit; padding: 6px; margin: 4px 0 8px; text-transform: uppercase; }
  #pfp button { font: inherit; padding: 8px 10px; margin: 2px 2px 0 0; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 6px; }
</style>
<script>
// Notifications push d'invitation : tout est optionnel, la permission n'est demandee que sur un clic.
(function () {
  var LS = "afh_circle", EP = "afh_push_ep";
  function get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  var $ = function (id) { return document.getElementById(id); };
  var msg = function (t) { $("pfm").textContent = t; };
  var ok = ("serviceWorker" in navigator) && ("PushManager" in window) && ("Notification" in window) && location.protocol.indexOf("http") === 0;
  if (!ok) return;
  fetch("/push/key").then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
    if (!j || !j.key) return;
    window.afhPushKey = j.key; $("pf").hidden = false; $("pfc").value = get(LS);
  }).catch(function () {});
  function b64(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); var r = atob(s + "===".slice((s.length + 3) % 4)); var a = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a; }
  $("pf").onclick = function () { $("pfp").hidden = false; };
  $("pfx").onclick = function () { $("pfp").hidden = true; };
  $("pfn").onclick = function () { var A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", c = ""; var r = new Uint8Array(5); crypto.getRandomValues(r); for (var i = 0; i < 5; i++) c += A[r[i] % A.length]; $("pfc").value = c; };
  $("pfa").onclick = function () {
    var c = $("pfc").value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (c.length < 5) { msg("Code de 5 caracteres minimum."); return; }
    msg("Activation...");
    Notification.requestPermission().then(function (p) {
      if (p !== "granted") { msg("Notifications refusees par le navigateur."); throw 0; }
      return navigator.serviceWorker.ready;
    }).then(function (reg) {
      return reg.pushManager.getSubscription().then(function (s) { return s || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(window.afhPushKey) }); });
    }).then(function (s) {
      var name = get("afh_name") || "";
      return fetch("/push/subscribe", { method: "POST", body: JSON.stringify({ circle: c, subscription: s.toJSON(), name: name }) }).then(function (r) {
        if (!r.ok) throw new Error("serveur");
        set(LS, c); set(EP, s.endpoint); msg("C'est fait : partage le code " + c + " a tes amis.");
      });
    }).catch(function (e) { if (e !== 0) msg("Impossible d'activer (reessaie dans un instant)."); });
  };
  // Appele par le jeu quand il copie le lien d'invitation : previent le cercle (le serveur limite a 1 fois / 30 s).
  window.afhPushInvite = function (url) {
    var c = get(LS); if (!c) return;
    try { var m = /[?&]salon=([A-Za-z0-9]+)/.exec(url); if (!m) return;
      fetch("/push/invite", { method: "POST", body: JSON.stringify({ circle: c, code: m[1], endpoint: get(EP) }) }).catch(function () {}); } catch (e) {}
  };
})();
</script>
<script id="afh-guard">
// Garde-fous de la page (robustesse telephone) : doigts fantomes, touches collees, son et pause quand la page est
// masquee, ecran qui reste allume, rotation, erreurs fatales visibles. Tout est defensif : aucune exception ne sort.
(function () {
  var W = window, D = document;
  var G = W.afhGuard = { hiddenFlag: false, sleeping: false };

  // ---- Son : on garde les AudioContext crees par le jeu pour les suspendre quand la page est masquee ou perd le focus
  // (un onglet masque continue sinon de jouer la musique ; au retour, le son est repris tout seul).
  var AC = W.AudioContext || W.webkitAudioContext, ctxs = [];
  G.ctxs = ctxs;
  if (AC) {
    try {
      var Wrapped = function (o) { var c = new AC(o); ctxs.push(c); return c; };
      Wrapped.prototype = AC.prototype;
      W.AudioContext = Wrapped;
      if (W.webkitAudioContext) W.webkitAudioContext = Wrapped;
    } catch (e) {}
  }
  function eachCtx(fn) { for (var i = 0; i < ctxs.length; i++) { try { fn(ctxs[i]); } catch (e) {} } }
  function sleep() { G.sleeping = true; G.hiddenFlag = true; eachCtx(function (c) { if (c.state === "running") { c.afhSlept = true; var p = c.suspend(); if (p && p.catch) p.catch(function () {}); } }); }
  function wake() {
    if (D.hidden) return;
    G.sleeping = false;
    // Seuls les contextes que NOUS avons suspendus (ou que le systeme a « interrompus ») sont relances : un contexte jamais demarre
    // (l'auxiliaire de deblocage du bundle) attend son premier geste et un resume() sans geste n'est que du bruit dans la console.
    eachCtx(function (c) { if ((c.afhSlept || c.state === "interrupted") && c.state !== "running" && c.state !== "closed") { c.afhSlept = false; var p = c.resume(); if (p && p.catch) p.catch(function () {}); } });
    keepAwake();
  }
  // Safari/Android : le contexte peut passer en « interrupted » (appel, notification) sans evenement de page : un geste le relance.
  ["touchend", "mousedown", "keydown"].forEach(function (n) { W.addEventListener(n, function () { if (!G.sleeping) wake(); }, { capture: true, passive: true }); });
  // « Le jeu se met en pause tout seul » : le jeu lit ce drapeau (afh_focus_lost) une fois par image.
  G.takeHidden = function () { var v = G.hiddenFlag; G.hiddenFlag = false; return v ? 1 : 0; };

  // ---- Ecran allume pendant le jeu (Wake Lock), reprise apres retour au premier plan.
  var lock = null;
  function keepAwake() {
    try {
      if (!navigator.wakeLock || D.hidden || lock) return;
      navigator.wakeLock.request("screen").then(function (l) { lock = l; l.addEventListener("release", function () { lock = null; }); }).catch(function () { lock = null; });
    } catch (e) {}
  }
  ["touchstart", "mousedown", "keydown"].forEach(function (n) { W.addEventListener(n, keepAwake, { capture: true, passive: true, once: false }); });

  // ---- Touches clavier maintenues quand la fenetre perd le focus : le navigateur n'envoie plus le keyup.
  var held = {};
  W.addEventListener("keydown", function (e) { held[e.code] = 1; }, true);
  W.addEventListener("keyup", function (e) { delete held[e.code]; }, true);
  function releaseKeys() {
    var codes = Object.keys(held); held = {};
    var c = D.getElementById("glcanvas");
    if (!c || !c.onkeyup) return;
    codes.forEach(function (code) { try { c.onkeyup({ code: code, ctrlKey: false, shiftKey: false, altKey: false }); } catch (e) {} });
  }

  // ---- Doigts « fantomes » : quand le systeme avale un touchend (geste de bord Android, sortie du plein ecran, rotation,
  // notification, doigt qui quitte la fenetre), le jeu croit le doigt toujours pose : le bouton reste « enfonce », le stick
  // reste vole. On suit les doigts reels et on envoie un touchend synthetique a ceux qui ont disparu ; un touchstart qui
  // reutilise un identifiant encore « vivant » ferme d'abord l'ancien ; quand le dernier doigt se leve, tout est ferme.
  var live = {};
  function flush(only) {
    var c = D.getElementById("glcanvas");
    var ids = only || Object.keys(live);
    ids.forEach(function (k) {
      var p = live[k]; delete live[k];
      if (!c || !p || typeof Touch === "undefined" || typeof TouchEvent === "undefined") return;
      try {
        var t = new Touch({ identifier: +k, target: c, clientX: p.x, clientY: p.y });
        c.dispatchEvent(new TouchEvent("touchend", { bubbles: true, cancelable: true, changedTouches: [t], touches: [], targetTouches: [] }));
      } catch (e) {}
    });
  }
  G.flushTouches = flush;
  G.liveTouches = function () { return Object.keys(live).length; };
  function onTouch(e) {
    try {
      var present = {}, changed = {}, i, t;
      for (i = 0; i < e.touches.length; i++) present[e.touches[i].identifier] = 1;
      for (i = 0; i < e.changedTouches.length; i++) changed[e.changedTouches[i].identifier] = 1;
      var ending = e.type === "touchend" || e.type === "touchcancel";
      if (e.type === "touchstart") {
        for (i = 0; i < e.changedTouches.length; i++) { t = e.changedTouches[i]; if (live[t.identifier]) flush([String(t.identifier)]); }
      }
      Object.keys(live).forEach(function (k) { if (!present[k] && !changed[k]) flush([k]); });
      for (i = 0; i < e.touches.length; i++) { t = e.touches[i]; live[t.identifier] = { x: t.clientX, y: t.clientY }; }
      if (ending) {
        for (i = 0; i < e.changedTouches.length; i++) delete live[e.changedTouches[i].identifier];
        if (e.touches.length === 0) flush();
      }
    } catch (err) {}
  }
  ["touchstart", "touchmove", "touchend", "touchcancel"].forEach(function (n) { W.addEventListener(n, onTouch, { capture: true, passive: true }); });

  // ---- Perte de focus / page masquee / rotation : relacher touches et doigts ; masquee ou sans focus : son coupe + pause du jeu.
  function lose() { releaseKeys(); flush(); sleep(); }
  W.addEventListener("blur", lose);
  W.addEventListener("pagehide", lose);
  W.addEventListener("focus", function () { if (!D.hidden) wake(); });
  W.addEventListener("pageshow", function () { if (!D.hidden) wake(); });
  D.addEventListener("visibilitychange", function () { if (D.hidden) lose(); else wake(); });
  // Rotation / plein ecran / barre d'adresse : certains navigateurs envoient le resize AVANT la fin de la rotation.
  function again() { try { W.dispatchEvent(new Event("resize")); } catch (e) {} }
  function settle() { flush(); setTimeout(again, 120); setTimeout(again, 500); }
  W.addEventListener("orientationchange", settle);
  D.addEventListener("fullscreenchange", settle);
  try { if (W.visualViewport) W.visualViewport.addEventListener("resize", function () { setTimeout(again, 60); }); } catch (e) {}
  // Geste « retour » d'Android (balayage depuis le bord) et bouton retour du navigateur : sans cela ils QUITTENT la page en pleine
  // partie. On garde une entree d'historique de rechange et le geste devient la touche Echap du jeu (pause en combat, retour
  // dans les menus).
  function pressEscape() {
    var c = D.getElementById("glcanvas");
    if (!c || !c.onkeydown) return;
    var ev = { code: "Escape", ctrlKey: false, shiftKey: false, altKey: false, repeat: false, preventDefault: function () {} };
    try { c.onkeydown(ev); } catch (e) {}
    setTimeout(function () { try { if (c.onkeyup) c.onkeyup(ev); } catch (e) {} }, 80);
  }
  G.pressEscape = pressEscape;
  try {
    if (W.history && W.history.pushState) {
      W.history.pushState({ afh: 1 }, "", W.location.href);
      W.addEventListener("popstate", function () {
        try { W.history.pushState({ afh: 1 }, "", W.location.href); } catch (e) {}
        flush();
        pressEscape();
      });
    }
  } catch (e) {}
  // Menu contextuel / appui long / double-tap / zoom : jamais dans le jeu.
  D.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  D.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  D.addEventListener("dblclick", function (e) { e.preventDefault(); });
  D.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

  // ---- Erreur fatale du jeu (panique wasm, WebGL perdu, wasm introuvable) : message clair et bouton « Recharger » au lieu
  // d'un ecran fige.
  var shown = false;
  function fatal(msg) {
    if (shown) return; shown = true;
    try {
      var l = D.getElementById("loading");
      if (!l) { l = D.createElement("div"); l.id = "loading"; D.body.appendChild(l); }
      l.hidden = false; l.style.opacity = "1"; l.style.pointerEvents = "auto";
      l.innerHTML = "";
      var t = D.createElement("div"); t.textContent = "Le jeu s'est arrete"; l.appendChild(t);
      var s = D.createElement("small"); s.textContent = msg; l.appendChild(s);
      var b = D.createElement("button"); b.textContent = "Recharger"; b.setAttribute("style", "margin-top:18px;min-height:48px;min-width:160px;font:600 18px monospace;border:2px solid #1a1a22;background:#f7f6f4;color:#1a1a22;border-radius:8px");
      b.addEventListener("click", function () { try { location.reload(); } catch (e) {} });
      l.appendChild(b);
    } catch (e) {}
  }
  G.fatal = fatal;
  function isFatal(m) { return /unreachable|RuntimeError|out of memory|memory access|WASM failed|WebAssembly|CompileError|LinkError|context lost/i.test(String(m || "")); }
  W.addEventListener("error", function (e) { if (isFatal(e && (e.message || (e.error && e.error.message)))) fatal("Une erreur est survenue (" + String((e && e.message) || "inconnue").slice(0, 80) + ")."); });
  W.addEventListener("unhandledrejection", function (e) { var r = e && e.reason; if (isFatal(r && (r.message || r))) fatal("Chargement impossible (" + String((r && r.message) || r).slice(0, 80) + "). Verifie ta connexion."); });
  D.addEventListener("webglcontextlost", function (e) { try { e.preventDefault(); } catch (x) {} fatal("L'affichage a ete interrompu par le systeme."); }, true);
  // Chargement anormalement long (reseau coupe a mi-chemin) : on le dit au lieu d'attendre indefiniment.
  setTimeout(function () {
    var l = D.getElementById("loading");
    if (l && !l.hidden && l.style.opacity !== "0" && !shown) { var s = l.querySelector("small"); if (s) s.textContent = "chargement long... verifie ta connexion, ou recharge la page"; }
  }, 25000);
})();
</script>

<script>
// Service worker : jamais servi depuis le cache HTTP (updateViaCache none) et verifie a chaque retour au premier plan,
// pour qu'un testeur qui rouvre l'appli installee ait TOUJOURS la derniere version.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function (reg) {
      document.addEventListener("visibilitychange", function () { if (!document.hidden) { try { reg.update().catch(function () {}); } catch (e) {} } });
    }).catch(function () {});
  });
}

<script>
// Sauvegarde dans le stockage local du navigateur (appelee par le jeu) et fin du chargement.
miniquad_add_plugin({
  name: "afh_storage", version: 1,
  register_plugin: function (importObject) {
    // Vibration du telephone (retour haptique des coups) : navigator.vibrate, Android / Chrome.
    // 1 une fois quand la page vient d'etre masquee ou a perdu le focus (le jeu se met alors en pause) ; 0 sinon.
    importObject.env.afh_focus_lost = function () { try { return window.afhGuard ? window.afhGuard.takeHidden() : 0; } catch (e) { return 0; } };
    // Preference systeme « reduire les animations » (reglage d'accessibilite) : 1 si activee.
    importObject.env.afh_reduced_motion = function () { try { return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 1 : 0; } catch (e) { return 0; } };
    importObject.env.afh_vibrate =function (ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };
    importObject.env.afh_ready = function () { var l = document.getElementById("loading"); if (!l) return; l.style.transition = "opacity .25s"; l.style.opacity = "0"; l.style.pointerEvents = "none"; setTimeout(function () { l.hidden = true; }, 300); };
    // Zones sures (encoche, barre de gestes) : lues via une sonde CSS env(safe-area-inset-*), en centiemes de point.

    probe.style.cssText = "position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)";

    };

    // getGamepads() alloue un tableau d'objets a chaque appel et le jeu l'appelle ~8 fois par image : liste gardee pour la meme image (~8 ms).

        var g = padList[i]; return g && g.connected ? g : null;
      } catch (e) { return null; }
    }
    importObject.env.afh_pad_connected = function (i) { return pad(i) ? 1 : 0; };
    importObject.env.afh_pad_buttons = function (i) {
      var g = pad(i); if (!g) return 0;
      var bits = 0;
      for (var b = 0; b < Math.min(g.buttons.length, 17); b++) { if (g.buttons[b].pressed || g.buttons[b].value > 0.5) bits |= (1 << b); }
      return bits >>> 0;
    };
    importObject.env.afh_pad_axis = function (i, a) { var g = pad(i); return g && g.axes.length > a ? Math.round(g.axes[a] * 1000) : 0; };
    // Jeu en ligne : WebSocket vers le serveur de relais (les messages recus sont mis en file pour le jeu).
    var ws = null, wsq = [], wsState = 2;
    importObject.env.afh_ws_open = function (p, l) {
      // L'ancienne socket est detachee AVANT d'etre fermee : son « close » tardif ne doit pas marquer la nouvelle comme coupee.
      try { if (ws) { ws.onopen = ws.onclose = ws.onerror = ws.onmessage = null; ws.close(); } } catch (e) {}
      wsq = []; wsState = 0;
      try {

        ws = me;
        me.onopen = function () { if (ws === me) wsState = 1; };
        me.onclose = function () { if (ws === me) wsState = 2; };
        me.onerror = function () { if (ws === me) wsState = 2; };
        me.onmessage = function (e) { if (ws === me && typeof e.data === "string" && wsq.length < 2000) wsq.push(e.data); };
      } catch (e) { wsState = 2; }
    };
    importObject.env.afh_ws_send = function (p, l) { try { if (ws && ws.readyState === 1) ws.send(UTF8ToString(p, l)); } catch (e) {} };
    importObject.env.afh_ws_state = function () { return wsState; };
    importObject.env.afh_ws_close = function () { try { if (ws) ws.close(); } catch (e) {} wsState = 2; };
    importObject.env.afh_ws_recv = function (dst, cap) {
      if (!wsq.length) return 0;
      var b = new TextEncoder().encode(wsq[0]);
      if (b.length > cap) { wsq.shift(); return 0; }
      wsq.shift();
      new Uint8Array(wasm_memory.buffer, dst, b.length).set(b);
      return b.length;
    };
    // kind 0 : adresse WebSocket du serveur qui sert la page ; kind 1 : code de salon du lien d'invitation (?salon=CODE).
    importObject.env.afh_ws_page = function (kind, dst, cap) {
      var s = "";
      try {
        if (kind === 0 && location.protocol.indexOf("http") === 0) s = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/";
        if (kind === 1) s = new URLSearchParams(location.search).get("salon") || "";
        if (kind === 3 && new URLSearchParams(location.search).get("labo")) s = "1";
        if (kind === 4) s = window.afhNfcCode || "";
        if (kind === 2 && location.protocol.indexOf("http") === 0) s = location.origin + location.pathname.replace(/index\.html$/, "");
      } catch (e) {}
      var b = new TextEncoder().encode(s);
      if (!b.length || b.length > cap) return 0;
      new Uint8Array(wasm_memory.buffer, dst, b.length).set(b);
      return b.length;
    };
    // Invitation : copie le lien dans le presse-papiers ; sur telephone, ouvre aussi la feuille de partage.
    importObject.env.afh_share = function (p, l) {
      var url = UTF8ToString(p, l);
      var done = 0;
      try { if (window.afhPushInvite) window.afhPushInvite(url); } catch (e) {}
      function legacy() {
        try { var t = document.createElement("textarea"); t.value = url; t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select(); done = document.execCommand("copy") ? 1 : 0; document.body.removeChild(t); } catch (e) {}
      }
      try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(url).catch(legacy); done = 1; } else legacy(); } catch (e) { legacy(); }
      try { if (navigator.share && navigator.maxTouchPoints > 0) navigator.share({ title: "AI Fighter 2", text: "Viens jouer avec moi !", url: url }).catch(function () {}); } catch (e) {}

    };
    // Invitation (v2) : flags 1 = copier le lien, 2 = feuille de partage native (navigator.share : WhatsApp, SMS, Messenger, Telegram...), 4 = prevenir le cercle d'amis (push).
    importObject.env.afh_share2 = function (p, l, tp, tl, flags) {
      var url = UTF8ToString(p, l), text = UTF8ToString(tp, tl), shared = 0;
      if (flags & 4) { try { if (window.afhPushInvite) window.afhPushInvite(url); } catch (e) {} }
      if (flags & 1) {
        var legacy = function () { try { var t = document.createElement("textarea"); t.value = url; t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select(); document.execCommand("copy"); document.body.removeChild(t); } catch (e) {} };
        try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).catch(legacy); else legacy(); } catch (e) { legacy(); }
      }
      if (flags & 2) { try { if (navigator.share) { navigator.share({ title: "AI Fighter 2", text: text, url: url }).catch(function () {}); shared = 1; } } catch (e) {} }
      return shared;
    };
    // Capacites et NFC. kind 0 : bits (1 = Web NFC, 2 = cercle d'amis actif, 4 = navigator.share) ; 1 : ecrire un lien sur une etiquette NFC ; 2 : lire une etiquette (code de salon) ; 3 : vider le code lu.
    // Web NFC : Android Chrome seulement, page en https ; il lit / ecrit des ETIQUETTES (pas de telephone a telephone).
    window.afhNfcCode = "";
    importObject.env.afh_lobby = function (kind, p, l) {
      try {
        if (kind === 0) {
          var circle = ""; try { circle = localStorage.getItem("afh_circle") || ""; } catch (e) {}
          return (("NDEFReader" in window && window.isSecureContext) ? 1 : 0) | ((window.afhPushKey && circle) ? 2 : 0) | (navigator.share ? 4 : 0);
        }
        if (kind === 1 && "NDEFReader" in window) {
          var url = UTF8ToString(p, l);
          new NDEFReader().write({ records: [{ recordType: "url", data: url }] }).catch(function () {});
        }
        if (kind === 2 && "NDEFReader" in window) {
          var rd = new NDEFReader();
          rd.scan().then(function () {
            rd.onreading = function (ev) {
              for (var i = 0; i < ev.message.records.length; i++) {
                var r = ev.message.records[i];
                if (r.recordType === "url" || r.recordType === "text") {
                  var t = new TextDecoder().decode(r.data), m = /[?&]salon=([A-Za-z0-9]+)/.exec(t);

            };
          }).catch(function () {});
        }
        if (kind === 3) window.afhNfcCode = "";
      } catch (e) {}
      return 0;
    };
    // Mode photo : le jeu fournit un PNG, la page le propose en telechargement.
    importObject.env.afh_download = function (np, nl, dp, dl) {
      try {
        var name = UTF8ToString(np, nl);
        var blob = new Blob([new Uint8Array(wasm_memory.buffer, dp, dl).slice()], { type: "image/png" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = name; a.style.display = "none";
        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 2000);
      } catch (e) {}
    };
    importObject.env.afh_storage_set =function (kp, kl, vp, vl) {
      try { localStorage.setItem(UTF8ToString(kp, kl), UTF8ToString(vp, vl)); return 1; } catch (e) { return 0; }
    };
    // len puis read : les octets mesures sont ceux qui sont copies (un autre onglet peut modifier la sauvegarde entre les deux
    // appels ; le jeu a alloue exactement `len` octets, en copier plus ecrirait hors de son tampon).
    var stoKey = null, stoBytes = null;
    importObject.env.afh_storage_len = function (kp, kl) {
      try {
        var k = UTF8ToString(kp, kl), v = localStorage.getItem(k);
        if (v === null) { stoKey = null; stoBytes = null; return -1; }
        stoKey = k; stoBytes = new TextEncoder().encode(v);
        return stoBytes.length;
      } catch (e) { stoKey = null; stoBytes = null; return -1; }
    };
    importObject.env.afh_storage_read = function (kp, kl, dst) {
      try {
        var k = UTF8ToString(kp, kl), b = stoBytes;
        if (!b || stoKey !== k) { var v = localStorage.getItem(k); if (v === null) return; b = new TextEncoder().encode(v); }
        stoBytes = null; stoKey = null;
        new Uint8Array(wasm_memory.buffer, dst, b.length).set(b);
      } catch (e) {}
    };
  }
});
