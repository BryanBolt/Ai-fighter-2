<style>
  /* Jeu plein ecran : papier clair, encre sombre, accent rouge sceau. Un seul look, voulu. */
  :root { --paper: #fff3e0; --ink: #221834; --seal: #d8456b; color-scheme: light; }
  html, body { margin: 0; height: 100%; height: 100dvh; width: 100%; position: fixed; inset: 0; overflow: hidden; background: var(--paper); color: var(--ink); touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas#glcanvas { contain: strict; display: block; position: absolute; left: 0; top: 0; width: 100%; height: 100%; height: 100dvh; outline: none; touch-action: none; }
  [hidden] { display: none !important; }
  #loading { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--paper); color: var(--ink); font: 600 20px/1.4 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; text-align: center; padding: 0 16px; }
  #loading i { display: block; width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--seal); margin-bottom: 18px; opacity: .85; }
  #loading small { font-weight: 400; font-size: 14px; opacity: .8; margin-top: 8px; letter-spacing: 0; }
  #fs { position: absolute; right: max(6px, env(safe-area-inset-right)); top: max(6px, env(safe-area-inset-top)); z-index: 3;
}
  /* Telephone en portrait : le bouton plein ecran quitte le HUD (barre de vie adverse) et se pose en bas, entre le stick et les boutons. */
  @media (orientation: portrait) and (max-width: 820px) { #fs { top: auto; right: auto; left: max(6px, env(safe-area-inset-left)); bottom: max(6px, env(safe-area-inset-bottom)); transform: none; opacity: .25; }
}
  /* Cible tactile >= 44 px sans agrandir le bouton visible (zone invisible autour) ; contraste releve (opacite .35 -> .55). */
  #fs::after { content: ""; position: absolute; inset: -6px; }
  #fs:focus-visible { outline: 3px solid var(--seal); outline-offset: 2px; opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #loading { transition: none !important; } }
  #fs { width: 34px; height: 34px; opacity: .55;font: 600 16px monospace; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 6px; padding: 0; }
/* Chargement : charte Encre / Papier / Accent, rien a lire (marque, mot trace, jauge, pictogrammes). Genere par tools/titre_assets.py */
  #loading { background: #221834; color: #fff3e0; gap: 0; }
  #loading .stage { position: relative; display: flex; flex-direction: column; align-items: center; width: min(86vw, 520px); }
  #loading .mk { width: min(34vw, 150px, 24vh); height: auto; overflow: visible; animation: ldHop 1.1s cubic-bezier(.3,0,.4,1) infinite; transform-origin: 50% 90%; }
  #loading .mk .pu { animation: ldBlink 3.6s infinite; transform-box: fill-box; transform-origin: center; }
  #loading .sh { width: min(24vw, 100px); height: 8px; border-radius: 50%; background: #0000004d; margin: 6px 0 14px; animation: ldShadow 1.1s cubic-bezier(.3,0,.4,1) infinite; }
  #loading .wm { width: 100%; height: auto; overflow: visible; }
  #loading .wm .l { animation: ldDrop .5s cubic-bezier(.2,1.4,.4,1) both; animation-delay: calc(var(--i) * .06s + .1s); transform-box: fill-box; transform-origin: center; }
  #loading .wm .two { animation-delay: .85s; }
  #loading .rail { width: 100%; height: 10px; border-radius: 99px; background: #fff3e026; margin-top: 22px; overflow: hidden; }
  #loading .rail b { display: block; height: 100%; width: 4%; border-radius: 99px; background: #ffd27a; transition: width .25s ease-out; }
  #loading .tips { position: relative; width: 84px; height: 100px; margin-top: 18px; }
  #loading .tips svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; stroke: #fff3e0; stroke-width: 10; stroke-linecap: round; animation: ldTip 3.6s infinite; }
  #loading .tips svg:nth-child(2) { animation-delay: 1.2s; }
  #loading .tips svg:nth-child(3) { animation-delay: 2.4s; }
  @keyframes ldHop { 0%, 100% { transform: translateY(0) scale(1.06, .92); } 45% { transform: translateY(-26px) scale(.96, 1.06); } 90% { transform: translateY(0) scale(1.06, .92); } }
  @keyframes ldShadow { 0%, 100% { transform: scaleX(1); opacity: .9; } 45% { transform: scaleX(.6); opacity: .5; } }
  @keyframes ldBlink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  @keyframes ldDrop { from { transform: translateY(-34px) scale(1.5); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes ldTip { 0%, 30%, 100% { opacity: 0; transform: translateY(8px); } 6%, 26% { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #loading .mk, #loading .sh, #loading .wm .l, #loading .mk .pu { animation: none; } #loading .tips svg { animation: none; } #loading .tips svg:first-child { opacity: 1; } #loading .rail b { transition: none; } }

<script>
// Notifications push d'invitation : tout est optionnel, la permission n'est demandee que sur un clic.
(function () {
  var LS = "afh_circle", EP = "afh_push_ep";
  function get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  var $ = function (id) { return document.getElementById(id); };
  var msg = function (t) { $("pfm").textContent = t; };
  var ok = ("serviceWorker" in navigator) && ("PushManager" in window) && ("Notification" in window) && location.protocol.indexOf("http") === 0;
  if (!ok) return;
  fetch("/push/key").then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
    if (!j || !j.key) return;
    window.afhPushKey = j.key; $("pf").hidden = false; $("pfc").value = get(LS);
  }).catch(function () {});
  function b64(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); var r = atob(s + "===".slice((s.length + 3) % 4)); var a = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a; }
  $("pf").onclick = function () { $("pfp").hidden = false; };
  $("pfx").onclick = function () { $("pfp").hidden = true; };
  $("pfn").onclick = function () { var A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", c = ""; var r = new Uint8Array(5); crypto.getRandomValues(r); for (var i = 0; i < 5; i++) c += A[r[i] % A.length]; $("pfc").value = c; };
  $("pfa").onclick = function () {
    var c = $("pfc").value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (c.length < 5) { msg("Code de 5 caracteres minimum."); return; }
    msg("Activation...");
    Notification.requestPermission().then(function (p) {
      if (p !== "granted") { msg("Notifications refusees par le navigateur."); throw 0; }
      return navigator.serviceWorker.ready;
    }).then(function (reg) {
      return reg.pushManager.getSubscription().then(function (s) { return s || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(window.afhPushKey) }); });
    }).then(function (s) {
      var name = get("afh_name") || "";
      return fetch("/push/subscribe", { method: "POST", body: JSON.stringify({ circle: c, subscription: s.toJSON(), name: name }) }).then(function (r) {
        if (!r.ok) throw new Error("serveur");
        set(LS, c); set(EP, s.endpoint); msg("C'est fait : partage le code " + c + " a tes amis.");
      });
    }).catch(function (e) { if (e !== 0) msg("Impossible d'activer (reessaie dans un instant)."); });
  };
  // Appele par le jeu quand il copie le lien d'invitation : previent le cercle (le serveur limite a 1 fois / 30 s).
  window.afhPushInvite = function (url) {
    var c = get(LS); if (!c) return;
    try { var m = /[?&]salon=([A-Za-z0-9]+)/.exec(url); if (!m) return;
      fetch("/push/invite", { method: "POST", body: JSON.stringify({ circle: c, code: m[1], endpoint: get(EP) }) }).catch(function () {}); } catch (e) {}
  };
})();
</script>
<script id="afh-guard">
// Garde-fous de la page (robustesse telephone) : doigts fantomes, touches collees, son et pause quand la page est
// masquee, ecran qui reste allume, rotation, erreurs fatales visibles. Tout est defensif : aucune exception ne sort.
(function () {
  var W = window, D = document;
  var G = W.afhGuard = { hiddenFlag: false, sleeping: false };

  // ---- Son : on garde les AudioContext crees par le jeu pour les suspendre quand la page est masquee ou perd le focus
  // (un onglet masque continue sinon de jouer la musique ; au retour, le son est repris tout seul).
  var AC = W.AudioContext || W.webkitAudioContext, ctxs = [];
  G.ctxs = ctxs;
  if (AC) {
    try {
      var Wrapped = function (o) { var c = new AC(o); ctxs.push(c); return c; };
      Wrapped.prototype = AC.prototype;
      W.AudioContext = Wrapped;
      if (W.webkitAudioContext) W.webkitAudioContext = Wrapped;
    } catch (e) {}
  }
  function eachCtx(fn) { for (var i = 0; i < ctxs.length; i++) { try { fn(ctxs[i]); } catch (e) {} } }
  function sleep() { G.sleeping = true; G.hiddenFlag = true; eachCtx(function (c) { if (c.state === "running") { c.afhSlept = true; var p = c.suspend(); if (p && p.catch) p.catch(function () {}); } }); }
  function wake() {
    if (D.hidden) return;
    G.sleeping = false;
    // Seuls les contextes que NOUS avons suspendus (ou que le systeme a « interrompus ») sont relances : un contexte jamais demarre
    // (l'auxiliaire de deblocage du bundle) attend son premier geste et un resume() sans geste n'est que du bruit dans la console.
    eachCtx(function (c) { if ((c.afhSlept || c.state === "interrupted") && c.state !== "running" && c.state !== "closed") { c.afhSlept = false; var p = c.resume(); if (p && p.catch) p.catch(function () {}); } });
    keepAwake();
  }
  // Safari/Android : le contexte peut passer en « interrupted » (appel, notification) sans evenement de page : un geste le relance.
  ["touchend", "mousedown", "keydown"].forEach(function (n) { W.addEventListener(n, function () { if (!G.sleeping) wake(); }, { capture: true, passive: true }); });
  // « Le jeu se met en pause tout seul » : le jeu lit ce drapeau (afh_focus_lost) une fois par image.
  G.takeHidden = function () { var v = G.hiddenFlag; G.hiddenFlag = false; return v ? 1 : 0; };

  // ---- Ecran allume pendant le jeu (Wake Lock), reprise apres retour au premier plan.
  var lock = null;
  function keepAwake() {
    try {
      if (!navigator.wakeLock || D.hidden || lock) return;
      navigator.wakeLock.request("screen").then(function (l) { lock = l; l.addEventListener("release", function () { lock = null; }); }).catch(function () { lock = null; });
    } catch (e) {}
  }
  ["touchstart", "mousedown", "keydown"].forEach(function (n) { W.addEventListener(n, keepAwake, { capture: true, passive: true, once: false }); });

  // ---- Touches clavier maintenues quand la fenetre perd le focus : le navigateur n'envoie plus le keyup.
  var held = {};
  W.addEventListener("keydown", function (e) { held[e.code] = 1; }, true);
  W.addEventListener("keyup", function (e) { delete held[e.code]; }, true);
  function releaseKeys() {
    var codes = Object.keys(held); held = {};
    var c = D.getElementById("glcanvas");
    if (!c || !c.onkeyup) return;
    codes.forEach(function (code) { try { c.onkeyup({ code: code, ctrlKey: false, shiftKey: false, altKey: false }); } catch (e) {} });
  }

  // ---- Doigts « fantomes » : quand le systeme avale un touchend (geste de bord Android, sortie du plein ecran, rotation,
  // notification, doigt qui quitte la fenetre), le jeu croit le doigt toujours pose : le bouton reste « enfonce », le stick
  // reste vole. On suit les doigts reels et on envoie un touchend synthetique a ceux qui ont disparu ; un touchstart qui
  // reutilise un identifiant encore « vivant » ferme d'abord l'ancien ; quand le dernier doigt se leve, tout est ferme.
  var live = {};
  function flush(only) {
    var c = D.getElementById("glcanvas");
    var ids = only || Object.keys(live);
    ids.forEach(function (k) {
      var p = live[k]; delete live[k];
      if (!c || !p || typeof Touch === "undefined" || typeof TouchEvent === "undefined") return;
      try {
        var t = new Touch({ identifier: +k, target: c, clientX: p.x, clientY: p.y });
        c.dispatchEvent(new TouchEvent("touchend", { bubbles: true, cancelable: true, changedTouches: [t], touches: [], targetTouches: [] }));
      } catch (e) {}
    });
  }
  G.flushTouches = flush;
  G.liveTouches = function () { return Object.keys(live).length; };
  function onTouch(e) {
    try {
      var present = {}, changed = {}, i, t;
      for (i = 0; i < e.touches.length; i++) present[e.touches[i].identifier] = 1;
      for (i = 0; i < e.changedTouches.length; i++) changed[e.changedTouches[i].identifier] = 1;
      var ending = e.type === "touchend" || e.type === "touchcancel";
      if (e.type === "touchstart") {
        for (i = 0; i < e.changedTouches.length; i++) { t = e.changedTouches[i]; if (live[t.identifier]) flush([String(t.identifier)]); }
      }
      Object.keys(live).forEach(function (k) { if (!present[k] && !changed[k]) flush([k]); });
      for (i = 0; i < e.touches.length; i++) { t = e.touches[i]; live[t.identifier] = { x: t.clientX, y: t.clientY }; }
      if (ending) {
        for (i = 0; i < e.changedTouches.length; i++) delete live[e.changedTouches[i].identifier];
        if (e.touches.length === 0) flush();
      }
    } catch (err) {}
  }
  ["touchstart", "touchmove", "touchend", "touchcancel"].forEach(function (n) { W.addEventListener(n, onTouch, { capture: true, passive: true }); });

  // ---- Perte de focus / page masquee / rotation : relacher touches et doigts ; masquee ou sans focus : son coupe + pause du jeu.
  function lose() { releaseKeys(); flush(); sleep(); }
  W.addEventListener("blur", lose);
  W.addEventListener("pagehide", lose);
  W.addEventListener("focus", function () { if (!D.hidden) wake(); });
  W.addEventListener("pageshow", function () { if (!D.hidden) wake(); });
  D.addEventListener("visibilitychange", function () { if (D.hidden) lose(); else wake(); });
  // Rotation / plein ecran / barre d'adresse : certains navigateurs envoient le resize AVANT la fin de la rotation.
  function again() { try { W.dispatchEvent(new Event("resize")); } catch (e) {} }
  function settle() { flush(); setTimeout(again, 120); setTimeout(again, 500); }
  W.addEventListener("orientationchange", settle);
  D.addEventListener("fullscreenchange", settle);
  try { if (W.visualViewport) W.visualViewport.addEventListener("resize", function () { setTimeout(again, 60); }); } catch (e) {}
  // Geste « retour » d'Android (balayage depuis le bord) et bouton retour du navigateur : sans cela ils QUITTENT la page en pleine
  // partie. On garde une entree d'historique de rechange et le geste devient la touche Echap du jeu (pause en combat, retour
  // dans les menus).
  function pressEscape() {
    var c = D.getElementById("glcanvas");
    if (!c || !c.onkeydown) return;
    var ev = { code: "Escape", ctrlKey: false, shiftKey: false, altKey: false, repeat: false, preventDefault: function () {} };
    try { c.onkeydown(ev); } catch (e) {}
    setTimeout(function () { try { if (c.onkeyup) c.onkeyup(ev); } catch (e) {} }, 80);
  }
  G.pressEscape = pressEscape;
  try {
    if (W.history && W.history.pushState) {
