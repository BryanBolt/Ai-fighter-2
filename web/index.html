<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preload" href="ai_fighter_2.wasm" as="fetch" type="application/wasm" crossorigin>
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#221834">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>AI Fighter 2</title>
<style>
  /* Jeu plein ecran : papier clair, encre sombre, accent rouge sceau. Un seul look, voulu. */
  :root { --paper: #f7f6f4; --ink: #1a1a22; --seal: #d6423a; color-scheme: light; }
  html, body { margin: 0; height: 100%; height: 100dvh; width: 100%; position: fixed; inset: 0; overflow: hidden; background: var(--paper); color: var(--ink); touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas#glcanvas { contain: strict; display: block; position: absolute; left: 0; top: 0; width: 100%; height: 100%; height: 100dvh; outline: none; touch-action: none; }
  [hidden] { display: none !important; }
  #loading { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--paper); color: var(--ink); font: 600 20px/1.4 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; text-align: center; padding: 0 16px; }
  #loading i { display: block; width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--seal); margin-bottom: 18px; opacity: .85; }
  #loading small { font-weight: 400; font-size: 13px; opacity: .65; margin-top: 8px; letter-spacing: 0; }
  #fs { position: absolute; right: max(6px, env(safe-area-inset-right)); top: max(6px, env(safe-area-inset-top)); z-index: 3;
}
  /* Telephone en portrait : le bouton plein ecran quitte le HUD (barre de vie adverse) et se pose en bas, entre le stick et les boutons. */
  @media (orientation: portrait) and (max-width: 820px) { #fs { top: auto; right: auto; left: max(6px, env(safe-area-inset-left)); bottom: max(6px, env(safe-area-inset-bottom)); transform: none; opacity: .25; }
}
  #fs { width: 34px; height: 34px; opacity: .35; font: 600 16px monospace; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 6px; padding: 0; }
</style>
</head>
<body>

<canvas id="glcanvas" tabindex="1"></canvas>
<div id="loading"><i></i>AI FIGHTER 2<small>chargement, quelques secondes...</small></div>
<button id="fs" title="Plein ecran" aria-label="Plein ecran">[ ]</button>
<button id="pf" title="Prevenir mes amis" aria-label="Prevenir mes amis" hidden>Amis</button>
<div id="pfp" hidden>
  <b>Prevenir mes amis</b>
  <p>Un code d'amis commun, puis chaque ami active les notifications : quand tu cliques sur Inviter, il recoit un message.</p>
  <label>Code d'amis <input id="pfc" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="ex. K7M2Q"></label>
  <div><button id="pfn" type="button">Nouveau code</button> <button id="pfa" type="button">Activer</button> <button id="pfx" type="button">Fermer</button></div>
  <small id="pfm"></small>
</div>
<style>
  #pf { position: absolute; left: max(6px, env(safe-area-inset-left)); top: max(6px, env(safe-area-inset-top)); z-index: 3; opacity: .3; font: 600 12px monospace; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 6px; padding: 6px 8px; }
  #pf:hover, #pf:focus { opacity: .9; }
  #pfp { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5; width: min(320px, 90vw); box-sizing: border-box; padding: 14px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 8px; font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  #pfp[hidden], #pf[hidden] { display: none; }
  #pfp p, #pfp small { display: block; margin: 8px 0; font-size: 12px; opacity: .8; }
  #pfp input { width: 100%; box-sizing: border-box; font: inherit; padding: 6px; margin: 4px 0 8px; text-transform: uppercase; }
  #pfp button { font: inherit; padding: 8px 10px; margin: 2px 2px 0 0; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 6px; }
</style>
<script>
// Notifications push d'invitation : tout est optionnel, la permission n'est demandee que sur un clic.
(function () {
  var LS = "afh_circle", EP = "afh_push_ep";
  function get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  var $ = function (id) { return document.getElementById(id); };
  var msg = function (t) { $("pfm").textContent = t; };
  var ok = ("serviceWorker" in navigator) && ("PushManager" in window) && ("Notification" in window) && location.protocol.indexOf("http") === 0;
  if (!ok) return;
  fetch("/push/key").then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
    if (!j || !j.key) return;
    window.afhPushKey = j.key; $("pf").hidden = false; $("pfc").value = get(LS);
  }).catch(function () {});
  function b64(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); var r = atob(s + "===".slice((s.length + 3) % 4)); var a = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a; }
  $("pf").onclick = function () { $("pfp").hidden = false; };
  $("pfx").onclick = function () { $("pfp").hidden = true; };
  $("pfn").onclick = function () { var A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", c = ""; var r = new Uint8Array(5); crypto.getRandomValues(r); for (var i = 0; i < 5; i++) c += A[r[i] % A.length]; $("pfc").value = c; };
  $("pfa").onclick = function () {
    var c = $("pfc").value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (c.length < 5) { msg("Code de 5 caracteres minimum."); return; }
    msg("Activation...");
    Notification.requestPermission().then(function (p) {
      if (p !== "granted") { msg("Notifications refusees par le navigateur."); throw 0; }
      return navigator.serviceWorker.ready;
    }).then(function (reg) {
      return reg.pushManager.getSubscription().then(function (s) { return s || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(window.afhPushKey) }); });
    }).then(function (s) {
      var name = get("afh_name") || "";
      return fetch("/push/subscribe", { method: "POST", body: JSON.stringify({ circle: c, subscription: s.toJSON(), name: name }) }).then(function (r) {
        if (!r.ok) throw new Error("serveur");
        set(LS, c); set(EP, s.endpoint); msg("C'est fait : partage le code " + c + " a tes amis.");
      });
    }).catch(function (e) { if (e !== 0) msg("Impossible d'activer (reessaie dans un instant)."); });
  };
  // Appele par le jeu quand il copie le lien d'invitation : previent le cercle (le serveur limite a 1 fois / 30 s).
  window.afhPushInvite = function (url) {
    var c = get(LS); if (!c) return;
    try { var m = /[?&]salon=([A-Za-z0-9]+)/.exec(url); if (!m) return;
      fetch("/push/invite", { method: "POST", body: JSON.stringify({ circle: c, code: m[1], endpoint: get(EP) }) }).catch(function () {}); } catch (e) {}
  };
})();
</script>

<script>if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }</script>
<script>
// Sauvegarde dans le stockage local du navigateur (appelee par le jeu) et fin du chargement.
miniquad_add_plugin({
  name: "afh_storage", version: 1,
  register_plugin: function (importObject) {
    // Vibration du telephone (retour haptique des coups) : navigator.vibrate, Android / Chrome.
    importObject.env.afh_vibrate = function (ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };
    importObject.env.afh_ready = function () { var l = document.getElementById("loading"); if (!l) return; l.style.transition = "opacity .25s"; l.style.opacity = "0"; l.style.pointerEvents = "none"; setTimeout(function () { l.hidden = true; }, 300); };
    // Zones sures (encoche, barre de gestes) : lues via une sonde CSS env(safe-area-inset-*), en centiemes de point.
    var probe = document.createElement("div");
    probe.style.cssText = "position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)";
    document.body.appendChild(probe);
    importObject.env.afh_safe_inset = function (i) {
      try { var cs = getComputedStyle(probe); var v = [cs.paddingLeft, cs.paddingTop, cs.paddingRight, cs.paddingBottom][i]; return Math.round((parseFloat(v) || 0) * 100); } catch (e) { return 0; }
    };
    // Manettes (API Gamepad) : etat lu a la demande par le jeu, disposition standard.
    function pad(i) { try { var l = navigator.getGamepads ? navigator.getGamepads() : []; var g = l[i]; return g && g.connected ? g : null; } catch (e) { return null; } }
    importObject.env.afh_pad_connected = function (i) { return pad(i) ? 1 : 0; };
    importObject.env.afh_pad_buttons = function (i) {
      var g = pad(i); if (!g) return 0;
      var bits = 0;
      for (var b = 0; b < Math.min(g.buttons.length, 17); b++) { if (g.buttons[b].pressed || g.buttons[b].value > 0.5) bits |= (1 << b); }
      return bits >>> 0;
    };
    importObject.env.afh_pad_axis = function (i, a) { var g = pad(i); return g && g.axes.length > a ? Math.round(g.axes[a] * 1000) : 0; };
    // Jeu en ligne : WebSocket vers le serveur de relais (les messages recus sont mis en file pour le jeu).
    var ws = null, wsq = [], wsState = 2;
    importObject.env.afh_ws_open = function (p, l) {
      try { if (ws) ws.close(); } catch (e) {}
      wsq = []; wsState = 0;
      try {
        ws = new WebSocket(UTF8ToString(p, l));
        ws.onopen = function () { wsState = 1; };
        ws.onclose = function () { wsState = 2; };
        ws.onerror = function () { wsState = 2; };
        ws.onmessage = function (e) { if (typeof e.data === "string") wsq.push(e.data); };
      } catch (e) { wsState = 2; }
    };
    importObject.env.afh_ws_send = function (p, l) { try { if (ws && ws.readyState === 1) ws.send(UTF8ToString(p, l)); } catch (e) {} };
    importObject.env.afh_ws_state = function () { return wsState; };
    importObject.env.afh_ws_close = function () { try { if (ws) ws.close(); } catch (e) {} wsState = 2; };
    importObject.env.afh_ws_recv = function (dst, cap) {
      if (!wsq.length) return 0;
      var b = new TextEncoder().encode(wsq[0]);
      if (b.length > cap) { wsq.shift(); return 0; }
      wsq.shift();
      new Uint8Array(wasm_memory.buffer, dst, b.length).set(b);
      return b.length;
    };
    // kind 0 : adresse WebSocket du serveur qui sert la page ; kind 1 : code de salon du lien d'invitation (?salon=CODE).
    importObject.env.afh_ws_page = function (kind, dst, cap) {
      var s = "";
      try {
        if (kind === 0 && location.protocol.indexOf("http") === 0) s = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/";
        if (kind === 1) s = new URLSearchParams(location.search).get("salon") || "";
        if (kind === 3 && new URLSearchParams(location.search).get("labo")) s = "1";
        if (kind === 2 && location.protocol.indexOf("http") === 0) s = location.origin + location.pathname.replace(/index\.html$/, "");
      } catch (e) {}
      var b = new TextEncoder().encode(s);
      if (!b.length || b.length > cap) return 0;
      new Uint8Array(wasm_memory.buffer, dst, b.length).set(b);
      return b.length;
    };
    // Invitation : copie le lien dans le presse-papiers ; sur telephone, ouvre aussi la feuille de partage.
    importObject.env.afh_share = function (p, l) {
      var url = UTF8ToString(p, l);
      var done = 0;
      try { if (window.afhPushInvite) window.afhPushInvite(url); } catch (e) {}
      function legacy() {
        try { var t = document.createElement("textarea"); t.value = url; t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select(); done = document.execCommand("copy") ? 1 : 0; document.body.removeChild(t); } catch (e) {}
      }
      try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(url).catch(legacy); done = 1; } else legacy(); } catch (e) { legacy(); }
      try { if (navigator.share && navigator.maxTouchPoints > 0) navigator.share({ title: "AI Fighter 2", text: "Viens jouer avec moi !", url: url }).catch(function () {}); } catch (e) {}
      return done;
    };
    importObject.env.afh_storage_set =function (kp, kl, vp, vl) {
      try { localStorage.setItem(UTF8ToString(kp, kl), UTF8ToString(vp, vl)); return 1; } catch (e) { return 0; }
    };
    importObject.env.afh_storage_len = function (kp, kl) {
      try { var v = localStorage.getItem(UTF8ToString(kp, kl)); return v === null ? -1 : new TextEncoder().encode(v).length; } catch (e) { return -1; }
    };
    importObject.env.afh_storage_read = function (kp, kl, dst) {
      try {
        var v = localStorage.getItem(UTF8ToString(kp, kl));
        if (v === null) return;
        var b = new TextEncoder().encode(v);
        new Uint8Array(wasm_memory.buffer, dst, b.length).set(b);
      } catch (e) {}
    };
  }
});
// Telephone (tactile, pixels denses) : on dessine a la taille CSS et le navigateur agrandit, bien plus fluide qu'en pleine
// resolution native (x7 pixels a remplir sur un ecran 3x). PC et ecrans peu denses : resolution native.
high_dpi = !((navigator.maxTouchPoints > 0 || 'ontouchstart' in window) && window.devicePixelRatio > 1.5);
load("ai_fighter_2.wasm");
document.getElementById("fs").addEventListener("click", function () {
  try { var d = document.documentElement; if (document.fullscreenElement) document.exitFullscreen(); else if (d.requestFullscreen) { d.requestFullscreen().then(function () {}).catch(function () {}); } } catch (e) {}
});
document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
// Pas de defilement, de zoom a deux doigts ni de tirer-pour-rafraichir : le jeu gere tous les doigts.
document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener("dblclick", function (e) { e.preventDefault(); });
</script>
<script>
// Touches maintenues quand la fenetre perd le focus ou que l'onglet se masque : le navigateur n'envoie plus le keyup,
// le jeu croit la touche toujours enfoncee (le heros continue de marcher au retour). On les relache a la main.
(function () {
  var held = {};
  window.addEventListener("keydown", function (e) { held[e.code] = 1; }, true);
  window.addEventListener("keyup", function (e) { delete held[e.code]; }, true);
  function release() {
    var codes = Object.keys(held); held = {};
    var c = document.getElementById("glcanvas");
    if (!c || !c.onkeyup) return;
    codes.forEach(function (code) { try { c.onkeyup({ code: code, ctrlKey: false, shiftKey: false, altKey: false }); } catch (e) {} });
  }
  window.addEventListener("blur", release);
  document.addEventListener("visibilitychange", function () { if (document.hidden) release(); });
})();
</script>
<script>
// Doigts « fantomes » : quand le systeme avale le touchend (geste de bord d'ecran Android, sortie du plein ecran, rotation,
// notification), le jeu croit le doigt toujours pose : le bouton reste « enfonce » et ne peut plus etre re-appuye, le stick
// reste vole. On suit les doigts reels et on envoie un touchend synthetique a ceux qui ont disparu.
(function () {
  var live = {};
  function track(e) {
    for (var i = 0; i < e.touches.length; i++) { var t = e.touches[i]; live[t.identifier] = { x: t.clientX, y: t.clientY }; }
    // Un doigt connu qui n'est plus dans la liste officielle : fini.
    var ids = {}; for (var j = 0; j < e.touches.length; j++) ids[e.touches[j].identifier] = 1;
    Object.keys(live).forEach(function (k) { if (!ids[k] && e.type !== "touchend" && e.type !== "touchcancel") flush([k]); });
  }
  function drop(e) { for (var i = 0; i < e.changedTouches.length; i++) delete live[e.changedTouches[i].identifier]; }
  function flush(only) {
    var c = document.getElementById("glcanvas");
    var ids = only || Object.keys(live);
    ids.forEach(function (k) {
      var p = live[k]; delete live[k];
      if (!c || !p || typeof Touch === "undefined" || typeof TouchEvent === "undefined") return;
      try {
        var t = new Touch({ identifier: +k, target: c, clientX: p.x, clientY: p.y });
        c.dispatchEvent(new TouchEvent("touchend", { bubbles: true, cancelable: true, changedTouches: [t], touches: [], targetTouches: [] }));
      } catch (e) {}
    });
  }
  ["touchstart", "touchmove"].forEach(function (n) { window.addEventListener(n, track, { capture: true, passive: true }); });
  ["touchend", "touchcancel"].forEach(function (n) { window.addEventListener(n, drop, { capture: true, passive: true }); });
  ["blur", "orientationchange", "fullscreenchange", "pagehide"].forEach(function (n) { window.addEventListener(n, function () { flush(); }); });
  document.addEventListener("fullscreenchange", function () { flush(); });
  document.addEventListener("visibilitychange", function () { if (document.hidden) flush(); });
})();
</script>
