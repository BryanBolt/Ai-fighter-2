<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preload" href="ai_fighter_2.wasm" as="fetch" type="application/wasm" crossorigin>
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f6f4">
<title>AI Fighter 2</title>
<style>
  /* Jeu plein ecran : papier clair, encre sombre, accent rouge sceau. Un seul look, voulu. */
  :root { --paper: #f7f6f4; --ink: #1a1a22; --seal: #d6423a; color-scheme: light; }
  html, body { margin: 0; height: 100%; height: 100dvh; width: 100%; position: fixed; inset: 0; overflow: hidden; background: var(--paper); color: var(--ink); touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas#glcanvas { contain: strict; display: block; position: absolute; left: 0; top: 0; width: 100%; height: 100%; height: 100dvh; outline: none; touch-action: none; }
  [hidden] { display: none !important; }
  #loading { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--paper); color: var(--ink); font: 600 20px/1.4 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; text-align: center; padding: 0 16px; }
  #loading i { display: block; width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--seal); margin-bottom: 18px; opacity: .85; }
  #loading small { font-weight: 400; font-size: 13px; opacity: .65; margin-top: 8px; letter-spacing: 0; }
  #fs { position: absolute; right: max(6px, env(safe-area-inset-right)); top: max(6px, env(safe-area-inset-top)); z-index: 3; width: 34px; height: 34px; opacity: .35; font: 600 16px monospace; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 6px; padding: 0; }
</style>
</head>
<body>

<canvas id="glcanvas" tabindex="1"></canvas>
<div id="loading"><i></i>AI FIGHTER 2<small>chargement, quelques secondes...</small></div>
<button id="fs" title="Plein ecran" aria-label="Plein ecran">[ ]</button>
<script src="mq_js_bundle.js"></script>
<script>
// Sauvegarde dans le stockage local du navigateur (appelee par le jeu) et fin du chargement.
miniquad_add_plugin({
  name: "afh_storage", version: 1,
  register_plugin: function (importObject) {
    importObject.env.afh_ready = function () { var l = document.getElementById("loading"); if (l) l.hidden = true; };
    // Zones sures (encoche, barre de gestes) : lues via une sonde CSS env(safe-area-inset-*), en centiemes de point.
    var probe = document.createElement("div");
    probe.style.cssText = "position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)";
    document.body.appendChild(probe);
    importObject.env.afh_safe_inset = function (i) {
      try { var cs = getComputedStyle(probe); var v = [cs.paddingLeft, cs.paddingTop, cs.paddingRight, cs.paddingBottom][i]; return Math.round((parseFloat(v) || 0) * 100); } catch (e) { return 0; }
    };
    // Manettes (API Gamepad) : etat lu a la demande par le jeu, disposition standard.
    function pad(i) { try { var l = navigator.getGamepads ? navigator.getGamepads() : []; var g = l[i]; return g && g.connected ? g : null; } catch (e) { return null; } }
    importObject.env.afh_pad_connected = function (i) { return pad(i) ? 1 : 0; };
    importObject.env.afh_pad_buttons = function (i) {
      var g = pad(i); if (!g) return 0;
      var bits = 0;
      for (var b = 0; b < Math.min(g.buttons.length, 17); b++) { if (g.buttons[b].pressed || g.buttons[b].value > 0.5) bits |= (1 << b); }
      return bits >>> 0;
    };
    importObject.env.afh_pad_axis = function (i, a) { var g = pad(i); return g && g.axes.length > a ? Math.round(g.axes[a] * 1000) : 0; };
    // Jeu en ligne : WebSocket vers le serveur de relais (les messages recus sont mis en file pour le jeu).
    var ws = null, wsq = [], wsState = 2;
    importObject.env.afh_ws_open = function (p, l) {
      try { if (ws) ws.close(); } catch (e) {}
      wsq = []; wsState = 0;
      try {
        ws = new WebSocket(UTF8ToString(p, l));
        ws.onopen = function () { wsState = 1; };
        ws.onclose = function () { wsState = 2; };
        ws.onerror = function () { wsState = 2; };
        ws.onmessage = function (e) { if (typeof e.data === "string") wsq.push(e.data); };
      } catch (e) { wsState = 2; }
    };
    importObject.env.afh_ws_send = function (p, l) { try { if (ws && ws.readyState === 1) ws.send(UTF8ToString(p, l)); } catch (e) {} };
    importObject.env.afh_ws_state = function () { return wsState; };
    importObject.env.afh_ws_close = function () { try { if (ws) ws.close(); } catch (e) {} wsState = 2; };
    importObject.env.afh_ws_recv = function (dst, cap) {
      if (!wsq.length) return 0;
      var b = new TextEncoder().encode(wsq[0]);
      if (b.length > cap) { wsq.shift(); return 0; }
      wsq.shift();
      new Uint8Array(wasm_memory.buffer, dst, b.length).set(b);
      return b.length;
    };
    // kind 0 : adresse WebSocket du serveur qui sert la page ; kind 1 : code de salon du lien d'invitation (?salon=CODE).
    importObject.env.afh_ws_page = function (kind, dst, cap) {
      var s = "";
      try {
        if (kind === 0 && location.protocol.indexOf("http") === 0) s = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/";
        if (kind === 1) s = new URLSearchParams(location.search).get("salon") || "";
        if (kind === 2 && location.protocol.indexOf("http") === 0) s = location.origin + location.pathname.replace(/index\.html$/, "");
      } catch (e) {}
      var b = new TextEncoder().encode(s);
      if (!b.length || b.length > cap) return 0;
      new Uint8Array(wasm_memory.buffer, dst, b.length).set(b);
      return b.length;
    };
    // Invitation : copie le lien dans le presse-papiers ; sur telephone, ouvre aussi la feuille de partage.
    importObject.env.afh_share = function (p, l) {
      var url = UTF8ToString(p, l);
      var done = 0;
      function legacy() {
        try { var t = document.createElement("textarea"); t.value = url; t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select(); done = document.execCommand("copy") ? 1 : 0; document.body.removeChild(t); } catch (e) {}
      }
      try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(url).catch(legacy); done = 1; } else legacy(); } catch (e) { legacy(); }
      try { if (navigator.share && navigator.maxTouchPoints > 0) navigator.share({ title: "AI Fighter 2", text: "Viens jouer avec moi !", url: url }).catch(function () {}); } catch (e) {}
      return done;
    };
    importObject.env.afh_storage_set =function (kp, kl, vp, vl) {
      try { localStorage.setItem(UTF8ToString(kp, kl), UTF8ToString(vp, vl)); } catch (e) {}
    };
    importObject.env.afh_storage_len = function (kp, kl) {
      try { var v = localStorage.getItem(UTF8ToString(kp, kl)); return v === null ? -1 : new TextEncoder().encode(v).length; } catch (e) { return -1; }
    };
    importObject.env.afh_storage_read = function (kp, kl, dst) {
      try {
        var v = localStorage.getItem(UTF8ToString(kp, kl));
        if (v === null) return;
        var b = new TextEncoder().encode(v);
        new Uint8Array(wasm_memory.buffer, dst, b.length).set(b);
      } catch (e) {}
    };
  }
});
// Telephone (tactile, pixels denses) : on dessine a la taille CSS et le navigateur agrandit, bien plus fluide qu'en pleine
// resolution native (x7 pixels a remplir sur un ecran 3x). PC et ecrans peu denses : resolution native.
high_dpi = !((navigator.maxTouchPoints > 0 || 'ontouchstart' in window) && window.devicePixelRatio > 1.5);
load("ai_fighter_2.wasm");
document.getElementById("fs").addEventListener("click", function () {
  try { var d = document.documentElement; if (document.fullscreenElement) document.exitFullscreen(); else if (d.requestFullscreen) { d.requestFullscreen().then(function () {}).catch(function () {}); } } catch (e) {}
});
document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
// Pas de defilement, de zoom a deux doigts ni de tirer-pour-rafraichir : le jeu gere tous les doigts.
document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener("dblclick", function (e) { e.preventDefault(); });
</script>
</body>
</html>
