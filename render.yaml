# Déploiement Render (plan gratuit) : un seul service qui sert le jeu web ET le relais en ligne.
# Attention : le disque du plan gratuit est éphémère (les idées proposées ne survivent pas à un redémarrage ;
# utiliser IDEAS_WEBHOOK pour les recevoir ailleurs). Le service s'endort après 15 min sans visite.
services:
  - type: web
    name: ai-fighter-2-test
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: AFK_MS
        value: "60000"
      - key: TRUST_PROXY
        value: "1"
      # Notifications push (invitation d'un ami) : a renseigner dans le tableau de bord Render (sync: false = valeur jamais dans le depot).
      # Voir tools/README_PERF.md (generation des cles). Sans ces 3 valeurs, le push reste simplement desactive.
      # Verdicts des pages de propositions : voir tools/README_VERDICTS.md. Sans VERDICT_KEY, la synchro est simplement desactivee.
      - key: VERDICT_KEY
        sync: false
      - key: VAPID_PUBLIC
        sync: false
      - key: VAPID_PRIVATE
        sync: false
      - key: VAPID_SUBJECT
        sync: false
